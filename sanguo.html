    bLog(`${factionById[aCity.owner].name}軍が${dCity.name}へ${siege?'攻城戦':'野戦'}を仕掛けた。`);bSyncHUD();bTickStart();
  }
  function bHexPath(x,y){const S=state.battle.size;bctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90),px=x+S*Math.cos(a),py=y+S*Math.sin(a);i?bctx.lineTo(px,py):bctx.moveTo(px,py);}bctx.closePath();}
  function bFillHex(k,color){const p=k.split(',').map(Number),xy=bCenter(p[0],p[1]);bHexPath(xy[0],xy[1]);bctx.fillStyle=color;bctx.fill();}
  function bDrawHex(c,r){const xy=bCenter(c,r),x=xy[0],y=xy[1],t=bTerrAt(c,r),tint=TERR[t].tint;bHexPath(x,y);if(tint){bctx.fillStyle=tint;bctx.fill();}bctx.strokeStyle='rgba(240,225,190,.22)';bctx.lineWidth=1;bctx.stroke();const cs=state.battle.castle;if(cs){const k=c+','+r;if(cs.walls.has(k)){bctx.fillStyle='rgba(120,110,95,.55)';bctx.fill();}if(cs.keep[0]===c&&cs.keep[1]===r){bctx.fillStyle='rgba(228,194,123,.4)';bctx.fill();bctx.fillStyle='#f7df9e';bctx.font=`bold ${Math.max(12,state.battle.size*0.5)}px serif`;bctx.textAlign='center';bctx.textBaseline='middle';bctx.fillText('城',x,y);}}}
  function bDrawStack(s){const xy=bCenter(s.col,s.row),x=xy[0],y=xy[1],S=state.battle.size,rad=S*0.6,u=UNITS[s.type];bctx.save();bctx.shadowColor='rgba(0,0,0,.6)';bctx.shadowBlur=8;bctx.fillStyle=s.side==='atk'?'#3f5f92':'#a24a44';bctx.beginPath();bctx.arc(x,y,rad,0,Math.PI*2);bctx.fill();bctx.shadowBlur=0;bctx.strokeStyle=u.color;bctx.lineWidth=2.5;bctx.stroke();bctx.fillStyle='#fff7e4';bctx.font=`bold ${rad*0.95}px serif`;bctx.textAlign='center';bctx.textBaseline='middle';bctx.fillText(u.jp,x,y-rad*0.1);bctx.font=`${Math.max(9,S*0.26)}px sans-serif`;bctx.textBaseline='top';bctx.fillText(s.count,x,y+rad*0.18);bctx.textBaseline='bottom';bctx.fillStyle='#f7df9e';bctx.font=`${Math.max(9,S*0.28)}px "Yu Gothic",Meiryo`;bctx.fillText(s.name,x,y-rad-3);bctx.restore();}
  function bAddFx(c,r,text,color){const xy=bCenter(c,r);state.battle.fx.push({x:xy[0],y:xy[1],text,color,t:0});}
  function bDrawFx(){state.battle.fx.forEach(f=>{bctx.save();bctx.globalAlpha=Math.max(0,1-f.t/60);bctx.fillStyle=f.color;bctx.font='bold 18px sans-serif';bctx.textAlign='center';bctx.fillText(f.text,f.x,f.y-f.t*0.6);bctx.restore();});}
  function bDraw(){if(state.screen!=='battle'||!state.battle)return;const B=state.battle,w=bcanvas.clientWidth,h=bcanvas.clientHeight;bctx.clearRect(0,0,w,h);const bg=battleBg(B.bgKey);if(bg.complete&&bg.naturalWidth){const s=Math.max(w/bg.naturalWidth,h/bg.naturalHeight),iw=bg.naturalWidth*s,ih=bg.naturalHeight*s;bctx.drawImage(bg,(w-iw)/2,(h-ih)/2,iw,ih);}else{bctx.fillStyle='#1a2620';bctx.fillRect(0,0,w,h);}bctx.fillStyle='rgba(6,10,12,.34)';bctx.fillRect(0,0,w,h);for(let r=0;r<BHEX.rows;r++)for(let c=0;c<BHEX.cols;c++)bDrawHex(c,r);if(B.range){B.range.move.forEach(k=>bFillHex(k,'rgba(110,200,220,.22)'));B.range.atk.forEach(k=>bFillHex(k,'rgba(210,90,80,.34)'));}if(B.sel&&B.sel.count>0){const xy=bCenter(B.sel.col,B.sel.row);bHexPath(xy[0],xy[1]);bctx.strokeStyle='#fff4c9';bctx.lineWidth=3;bctx.stroke();}B.stacks.filter(s=>s.count>0).forEach(bDrawStack);bDrawFx();}
  let bRaf=null;
  function bTickStart(){if(bRaf)return;const loop=()=>{if(state.screen!=='battle'){bRaf=null;return;}const B=state.battle;if(B)B.fx=B.fx.filter(f=>(f.t+=1)<60);bDraw();bRaf=requestAnimationFrame(loop);};bRaf=requestAnimationFrame(loop);}
  function bComputeRange(s){const B=state.battle,move=UNITS[s.type].move,best={},reach=new Set();best[s.col+','+s.row]=0;const pq=[[0,s.col,s.row]];while(pq.length){pq.sort((a,b)=>a[0]-b[0]);const top=pq.shift(),cost=top[0],c=top[1],r=top[2];if(cost>best[c+','+r])continue;const adjEnemy=bHexNeighbors(c,r).some(n=>{const st=bStackAt(n[0],n[1]);return st&&st.side!==s.side;});if(!(c===s.col&&r===s.row)&&adjEnemy)continue;for(const n of bHexNeighbors(c,r)){const nc=n[0],nr=n[1],key=nc+','+nr;if(bCastleBlocked(nc,nr)||bStackAt(nc,nr))continue;const t=bTerrAt(nc,nr);if(TERR[t].cost>=99)continue;const nCost=cost+TERR[t].cost;if(nCost<=move&&(best[key]===undefined||nCost<best[key])){best[key]=nCost;reach.add(key);pq.push([nCost,nc,nr]);}}}const rng=UNITS[s.type].range,atk=new Set();B.stacks.filter(e=>e.count>0&&e.side!==s.side).forEach(e=>{if(bDist(s.col,s.row,e.col,e.row)<=rng)atk.add(e.col+','+e.row);});return {move:reach,atk};}
  function bSelect(s){const B=state.battle;B.sel=s;B.range=(s&&!s.hasActed)?bComputeRange(s):{move:new Set(),atk:new Set()};bShowSel(s);}
  function bAttackTargets(s){const atk=new Set();state.battle.stacks.filter(e=>e.count>0&&e.side!==s.side).forEach(e=>{if(bDist(s.col,s.row,e.col,e.row)<=UNITS[s.type].range)atk.add(e.col+','+e.row);});return atk;}
  function bClick(px,py){const B=state.battle;if(!B||B.over||B.phase!=='player'||B.aiBusy)return;const cell=bPick(px,py);if(!cell)return;const c=cell[0],r=cell[1],s=bStackAt(c,r);if(B.sel&&!B.sel.hasActed){const key=c+','+r;if(B.range&&B.range.atk.has(key)&&s&&s.side!==B.playerSide){bDoAttack(B.sel,s);return;}if(B.range&&B.range.move.has(key)){bMove(B.sel,c,r);return;}}if(s&&s.side===B.playerSide&&!s.hasActed){bSelect(s);sfx('click');return;}if(s){bSelect(s);return;}bSelect(null);}
  function bMove(s,c,r){s.col=c;s.row=r;s.hasMoved=true;sfx('move');const atk=bAttackTargets(s);state.battle.range={move:new Set(),atk};if(atk.size===0){s.hasActed=true;bSelect(null);}else bShowSel(s);bCheckEnd();}
  function bDoAttack(atk,def){bResolveMelee(atk,def);atk.hasActed=true;atk.hasMoved=true;bSelect(null);bCleanup();bCheckEnd();bSyncHUD();}
  function bResolveMelee(atk,def){const B=state.battle,dist=bDist(atk.col,atk.row,def.col,def.row),ranged=UNITS[atk.type].range>=2&&dist>=2,tDef=TERR[bTerrAt(def.col,def.row)].def;let castle=1;if(B.castle&&B.siege&&def.side==='def'&&def.row<=1)castle=1.15;const baseAtk=atk.count*UNITS[atk.type].atk*(1+atk.st.bu/200)*advantage(atk.type,def.type),baseDef=def.count*UNITS[def.type].def*(1+def.st.tou/200)*tDef*castle,ratio=baseAtk/Math.max(1,baseDef);const defLoss=Math.round(def.count*clamp(0.13*ratio,0.03,0.5)*(0.85+Math.random()*0.3)),counter=ranged?0:0.5,atkLoss=Math.round(atk.count*clamp(0.13/Math.max(0.25,ratio),0,0.45)*counter*(0.85+Math.random()*0.3));def.count=Math.max(0,def.count-defLoss);atk.count=Math.max(0,atk.count-atkLoss);bAddFx(def.col,def.row,'-'+defLoss,'#ff9c8c');if(atkLoss>0)bAddFx(atk.col,atk.row,'-'+atkLoss,'#ffd27a');bLog(`${atk.name}が${def.name}を撃つ（損害${defLoss}${atkLoss?`／反撃${atkLoss}`:''}）。`);sfx('hit');}
  function bCleanup(){state.battle.stacks.forEach(s=>{if(s.count>0&&s.count<s.count0*0.12){bAddFx(s.col,s.row,'壊走','#ddd');s.count=0;}});}
  function bCheckEnd(){const B=state.battle;if(B.over)return;if(B.siege&&B.castle){const occ=bStackAt(B.castle.keep[0],B.castle.keep[1]);if(occ&&occ.side==='atk')return bFinish(true,'天守を制圧した');}const atkAlive=B.stacks.some(s=>s.side==='atk'&&s.count>0),defAlive=B.stacks.some(s=>s.side==='def'&&s.count>0);if(!defAlive)return bFinish(true,'敵軍を殲滅した');if(!atkAlive)return bFinish(false,'我が軍は壊滅した');}
  function bEndPlayerPhase(){const B=state.battle;if(!B||B.over||B.aiBusy)return;B.stacks.forEach(s=>{if(s.side===B.playerSide){s.hasMoved=true;s.hasActed=true;}});bSelect(null);B.phase='enemy';bSyncHUD();setTimeout(bRunEnemyPhase,300);}
  function bRunEnemyPhase(){const B=state.battle;if(!B||B.over)return;B.aiBusy=true;const aiSide=B.playerSide==='atk'?'def':'atk',units=B.stacks.filter(s=>s.side===aiSide&&s.count>0);let i=0;const step=()=>{if(B.over){B.aiBusy=false;return;}if(i>=units.length){bEndEnemyPhase();return;}const s=units[i++];if(s.count<=0)return step();bAiActUnit(s,aiSide);setTimeout(step,360);};setTimeout(step,200);}
  function bAiActUnit(s,aiSide){const B=state.battle,enemies=B.stacks.filter(e=>e.side!==aiSide&&e.count>0);if(!enemies.length)return;let target=null,bestScore=-1;enemies.forEach(e=>{if(bDist(s.col,s.row,e.col,e.row)<=UNITS[s.type].range){const sc=advantage(s.type,e.type)*e.count;if(sc>bestScore){bestScore=sc;target=e;}}});if(target){bResolveMelee(s,target);bCleanup();bCheckEnd();return;}if(B.siege&&aiSide==='def')return;let goal=null;if(B.siege&&aiSide==='atk'&&B.castle)goal=B.castle.keep;else{let nd=1e9;enemies.forEach(e=>{const d=bDist(s.col,s.row,e.col,e.row);if(d<nd){nd=d;goal=[e.col,e.row];}});}if(!goal)return;const rng=bComputeRange(s);let bestCell=null,bd=bDist(s.col,s.row,goal[0],goal[1]);rng.move.forEach(k=>{const p=k.split(',').map(Number),d=bDist(p[0],p[1],goal[0],goal[1]);if(d<bd){bd=d;bestCell=p;}});if(bestCell){s.col=bestCell[0];s.row=bestCell[1];const near=enemies.filter(e=>e.count>0&&bDist(s.col,s.row,e.col,e.row)<=UNITS[s.type].range);if(near.length){near.sort((a,b)=>b.count-a.count);bResolveMelee(s,near[0]);bCleanup();bCheckEnd();}}}
  function bEndEnemyPhase(){const B=state.battle;B.aiBusy=false;if(B.over)return;B.round++;if(B.round>B.maxRounds)return bFinish(false,'刻限を過ぎ、攻めきれなかった');B.stacks.forEach(s=>{s.hasMoved=false;s.hasActed=false;});B.phase='player';bSelect(null);bSyncHUD();}
  function bAutoResolve(){const B=state.battle;if(!B||B.over)return;const q=side=>{const arr=B.stacks.filter(s=>s.side===side&&s.count>0),soldiers=arr.reduce((n,s)=>n+s.count,0),quality=arr.length?arr.reduce((n,s)=>n+UNITS[s.type].atk*(1+s.st.bu/200)+UNITS[s.type].def*(1+s.st.tou/200),0)/arr.length/2:1;return {soldiers,quality};};const A=q('atk'),D=q('def');let a=A.soldiers*A.quality*(0.9+Math.random()*0.2),d=D.soldiers*D.quality*(B.siege?1.2:1)*(0.9+Math.random()*0.2);const win=a>=d,atkSurv=win?Math.max(10,Math.round(A.soldiers*clamp(1-d/(a+1),0.15,0.85))):Math.round(A.soldiers*clamp(1-a/(d+1),0,0.4)),defSurv=win?Math.round(D.soldiers*0.12):Math.max(8,Math.round(D.soldiers*clamp(1-a/(d+1),0.2,0.9)));bFinish(win,win?'諸将奮戦し勝利した':'力及ばず退いた',atkSurv,defSurv);}
  function bFinish(win,reason,ovA,ovD){const B=state.battle;if(!B||B.over)return;B.over=true;const atkSurv=ovA!=null?ovA:B.stacks.filter(s=>s.side==='atk').reduce((n,s)=>n+Math.max(0,s.count),0),defSurv=ovD!=null?ovD:B.stacks.filter(s=>s.side==='def').reduce((n,s)=>n+Math.max(0,s.count),0);bApplyResult(win,atkSurv,defSurv);sfx(win?'win':'lose');const box=document.getElementById('bResult');box.innerHTML=`<div class="bResultBox"><h2 style="color:${win?'var(--gold)':'var(--red)'}">${win?'勝 利':'敗 北'}</h2><p>${reason}。<br>生存兵：自軍 ${atkSurv} ／ 敵軍 ${defSurv}</p><button class="primary" id="bBackBtn">戦略画面へ戻る</button></div>`;box.classList.remove('hidden');document.getElementById('bBackBtn').onclick=bBackToMap;}
  function bApplyResult(win,atkSurv,defSurv){const B=state.battle,a=cityById[B.aCity],d=cityById[B.dCity];if(win){const prev=d.owner;d.owner=a.owner;d.garrison=Math.max(10,atkSurv);d.generals=B.atkGenerals.slice();a.generals=[];a.garrison=B.homeKeep;addLog(`${a.name}より出陣し${d.name}を攻略、${factionById[prev].name}から奪取した。`);state.selectedCity=d.id;}else{a.garrison=B.homeKeep+Math.floor(atkSurv*0.7);a.generals=B.atkGenerals.slice();d.garrison=Math.max(8,defSurv);addLog(`${d.name}攻めは成らず、${a.name}へ退いた。`);}}
  function bBackToMap(){state.battle=null;state.screen='game';document.getElementById('battleScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');document.getElementById('bResult').classList.add('hidden');resize();updateUI();draw();checkVictory();saveGame();}
  function bSyncHUD(){const B=state.battle;if(!B)return;document.getElementById('bTitle').textContent=(B.siege?'攻城戦・':'野戦・')+cityById[B.dCity].name;document.getElementById('bRound').textContent=B.round;document.getElementById('bMax').textContent=B.maxRounds;document.getElementById('bPhase').textContent=B.phase==='player'?'自軍の手番':'敵軍の手番';}
  function bShowSel(s){const el=document.getElementById('bSelect');if(!s||s.count<=0){el.classList.add('hidden');return;}const u=UNITS[s.type];el.classList.remove('hidden');el.innerHTML=`<h3>${s.name} <span style="color:var(--muted);font-size:12px">${u.jp}兵</span></h3><div>兵力 <b>${s.count}</b> / ${s.count0}</div><div class="bStats"><span>武 <b>${s.st.bu}</b></span><span>知 <b>${s.st.chi}</b></span><span>統 <b>${s.st.tou}</b></span></div>`;}
  function bLog(t){const B=state.battle;B.log.unshift(t);B.log=B.log.slice(0,10);document.getElementById('bLog').innerHTML=B.log.map(x=>`<div>${x}</div>`).join('');}
  function simResolve(aCity,dCity){const homeKeep=Math.max(10,Math.floor(aCity.garrison*0.15)),commit=Math.max(12,aCity.garrison-homeKeep),siege=dCity.prosperity>=60;const q=(gens,soldiers)=>{const list=(gens||[]).slice(0,4),quality=list.length?list.reduce((n,id)=>{const st=statFor(id);return n+(1+st.bu/200)+(1+st.tou/200);},0)/list.length/2:1;return {soldiers,quality};};const A=q(aCity.generals,commit),D=q(dCity.generals,dCity.garrison);let a=A.soldiers*A.quality*(0.9+Math.random()*0.2),d=D.soldiers*D.quality*(siege?1.2:1)*(0.9+Math.random()*0.2);const win=a>=d,atkSurv=win?Math.max(10,Math.round(A.soldiers*clamp(1-d/(a+1),0.15,0.85))):Math.round(A.soldiers*clamp(1-a/(d+1),0,0.4)),defSurv=win?Math.round(D.soldiers*0.12):Math.max(8,Math.round(D.soldiers*clamp(1-a/(d+1),0.2,0.9)));return {win,atkSurv,defSurv,commit,homeKeep};}
  // 音声（Web Audio API プロシージャル）
  let actx=null;
  function audioCtx(){if(state.muted)return null;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
  function sfx(name){const ac=audioCtx();if(!ac)return;const now=ac.currentTime,beep=(f,dur,type,g,delay)=>{const o=ac.createOscillator(),ga=ac.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(ga);ga.connect(ac.destination);const t=now+(delay||0);ga.gain.setValueAtTime(0.0001,t);ga.gain.exponentialRampToValueAtTime(g||0.12,t+0.012);ga.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.03);};switch(name){case 'click':beep(520,0.08,'square',0.05);break;case 'move':beep(300,0.12,'sine',0.08);break;case 'march':beep(170,0.2,'sawtooth',0.08);beep(240,0.16,'sawtooth',0.05,0.06);break;case 'hit':beep(140,0.14,'square',0.11);beep(90,0.18,'triangle',0.09,0.02);break;case 'win':[523,659,784,1047].forEach((f,i)=>beep(f,0.24,'triangle',0.1,i*0.12));break;case 'lose':[392,330,262].forEach((f,i)=>beep(f,0.3,'sine',0.09,i*0.14));break;default:beep(440,0.08,'sine',0.05);}}
  // 勝敗判定・セーブは後段で本実装（ここでは無害なスタブ）
  function checkVictory(){}
  function saveGame(){}
  bcanvas.addEventListener('pointerdown',e=>{const r=bcanvas.getBoundingClientRect();bClick(e.clientX-r.left,e.clientY-r.top);});
  document.getElementById('bEndTurn').onclick=()=>{if(state.screen==='battle')bEndPlayerPhase();};
  document.getElementById('bAuto').onclick=()=>{if(state.screen==='battle')bAutoResolve();};
  document.getElementById('bRetreat').onclick=()=>{if(state.screen==='battle'&&state.battle&&!state.battle.over)bFinish(false,'撤退を選び兵を退いた');};
  addEventListener('resize',()=>{if(state.screen==='battle')bResize();});
  mapImage.onload=()=>{if(state.screen==='game'){resize();draw()}};
  addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('rosterOverlay').classList.add('hidden')});
})();
