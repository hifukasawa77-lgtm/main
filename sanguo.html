  function cityPower(c){return c.garrison+(c.generals||[]).length*12+c.prosperity*.25}
  function endTurn(){state.turn++;if(state.turn%2===0)state.year++;state.gold+=80;CITIES.forEach(c=>{if(c.owner===state.faction)c.prosperity=Math.min(100,c.prosperity+1)});addLog(`${state.year}年：領内の収穫が終わり、金80を得た。`);updateUI();draw()}
  function develop(){const c=cityById[state.selectedCity];if(!c||c.owner!==state.faction||state.gold<100)return;state.gold-=100;c.prosperity=Math.min(100,c.prosperity+8);addLog(`${c.name}で屯田と治水を行い、民政が向上した。`);updateUI();draw()}
  function recruit(){const c=cityById[state.selectedCity];if(!c||c.owner!==state.faction||state.gold<120)return;const used=new Set(CITIES.flatMap(x=>x.generals||[]));const idx=GENERAL_IDS.findIndex(id=>!used.has(id));if(idx<0){addLog('登用できる武将が見つからない。');updateUI();return}state.gold-=120;c.generals=(c.generals||[]).concat(GENERAL_IDS[idx]);addLog(`${nameForGeneral(idx)}が${c.name}に加わった。`);updateUI();draw()}
  function attack(targetId){const a=cityById[state.selectedCity],d=cityById[targetId];if(!a||!d||a.owner!==state.faction||!a.neighbors.includes(d.id)||state.gold<50)return;const atk=cityPower(a)+Math.random()*25,def=cityPower(d)+Math.random()*20;state.gold-=50;if(atk>=def){d.owner=state.faction;d.garrison=Math.max(18,Math.floor(a.garrison*.36));a.garrison=Math.max(12,Math.floor(a.garrison*.54));addLog(`${a.name}から${d.name}へ進軍。攻城に成功した。`);state.selectedCity=d.id}else{a.garrison=Math.max(8,Math.floor(a.garrison*.58));addLog(`${a.name}の攻撃は退けられた。兵站を立て直そう。`)}updateUI();draw()}
  function nameForGeneral(i){return GENERAL_JP[i]||`武将${i+1}`}
  function cityPanel(){const c=cityById[state.selectedCity];if(!c)return '<h2>地図を読み込み中</h2>';const f=factionById[c.owner],mine=c.owner===state.faction;const enemy=c.neighbors.map(id=>cityById[id]).filter(x=>x&&x.owner!==state.faction);return `<h2>${c.name}</h2><div class="subtle">${f.name}／${f.leader}${mine?' ・ 自軍領':' ・ 他勢力領'}</div><div class="cityStats"><div class="stat">兵力<b>${c.garrison}</b></div><div class="stat">民政<b>${c.prosperity}</b></div><div class="stat">武将<b>${(c.generals||[]).length}</b></div></div><div class="sectionTitle">駐屯武将</div><div class="subtle">${(c.generals||[]).map(id=>nameForGeneral(GENERAL_IDS.indexOf(id))).join('、')||'なし'}</div>${mine?`<div class="panelActions"><button data-action="develop">内政（100金）</button><button data-action="recruit">登用（120金）</button></div><div class="sectionTitle">隣接する敵城へ攻撃（50金）</div><div class="targetList">${enemy.map(x=>`<button class="targetBtn" data-target="${x.id}"><span>${x.name}</span><small>${factionById[x.owner].name}・${x.garrison}兵</small></button>`).join('')||'<div class="subtle">攻撃可能な隣接城はありません。</div>'}</div>`:''}<div class="sectionTitle">軍議記録</div><div class="log">${state.log.map(x=>`<div>${x}</div>`).join('')}</div>`}
  function updateUI(){const f=factionById[state.faction];document.getElementById('yearText').textContent=`${state.year}年`;document.getElementById('turnText').textContent=state.turn;document.getElementById('factionText').textContent=f?.name||'—';document.getElementById('goldText').textContent=state.gold;document.getElementById('sidePanel').innerHTML=cityPanel();document.querySelectorAll('[data-action="develop"]').forEach(b=>b.onclick=develop);document.querySelectorAll('[data-action="recruit"]').forEach(b=>b.onclick=recruit);document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>attack(b.dataset.target));if(!state.rosterData)buildRoster()}
  function buildRoster(){const grid=document.getElementById('rosterGrid');grid.innerHTML='';GENERAL_JP.forEach((name,i)=>{const atlas=Math.floor(i/36),slot=i%36,col=slot%6,row=Math.floor(slot/6);const card=document.createElement('div');card.className='generalCard';card.innerHTML=`<div class="portrait" style="background-image:url('${ASSET_ROOT}gpt/sanguo-generals-atlas-0${atlas+1}.png');background-position:${col*20}% ${row*20}%"></div><span>${name}</span><small>${atlas+1}-${slot+1}</small>`;grid.appendChild(card)});state.rosterData=true}
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);state.drag={x:e.clientX,y:e.clientY,panX:state.panX,panY:state.panY,moved:false}});
  canvas.addEventListener('pointermove',e=>{if(!state.drag)return;const dx=e.clientX-state.drag.x,dy=e.clientY-state.drag.y;if(Math.abs(dx)+Math.abs(dy)>4)state.drag.moved=true;state.panX=state.drag.panX+dx;state.panY=state.drag.panY+dy;draw()});
  canvas.addEventListener('pointerup',e=>{const d=state.drag;state.drag=null;if(!d||d.moved)return;const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let hit=null;CITIES.forEach(c=>{const [x,y]=point(c);if(Math.hypot(mx-x,my-y)<Math.max(18,20*state.zoom))hit=c});if(hit){state.selectedCity=hit.id;updateUI();draw()}});
  canvas.addEventListener('wheel',e=>{e.preventDefault();const old=view(),factor=e.deltaY<0?1.12:.89;state.zoom=Math.max(.72,Math.min(2.8,state.zoom*factor));const r=canvas.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;const next=view();state.panX+=(px-old.x)*(1-factor);state.panY+=(py-old.y)*(1-factor);draw()},{passive:false});
  mapImage.onload=()=>{if(state.screen==='game'){resize();draw()}};
  addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('rosterOverlay').classList.add('hidden')});
})();
</script>
</body>
</html>
