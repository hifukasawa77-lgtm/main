  function sfx(name){const ac=audioCtx();if(!ac)return;const now=ac.currentTime,beep=(f,dur,type,g,delay)=>{const o=ac.createOscillator(),ga=ac.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(ga);ga.connect(ac.destination);const t=now+(delay||0);ga.gain.setValueAtTime(0.0001,t);ga.gain.exponentialRampToValueAtTime(g||0.12,t+0.012);ga.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.03);};switch(name){case 'click':beep(520,0.08,'square',0.05);break;case 'move':beep(300,0.12,'sine',0.08);break;case 'march':beep(170,0.2,'sawtooth',0.08);beep(240,0.16,'sawtooth',0.05,0.06);break;case 'hit':beep(140,0.14,'square',0.11);beep(90,0.18,'triangle',0.09,0.02);break;case 'win':[523,659,784,1047].forEach((f,i)=>beep(f,0.24,'triangle',0.1,i*0.12));break;case 'lose':[392,330,262].forEach((f,i)=>beep(f,0.3,'sine',0.09,i*0.14));break;default:beep(440,0.08,'sine',0.05);}}
  // ===== 外交 =====
  function ensureRel(a,b){const k=relKey(a,b);if(!state.relations[k])state.relations[k]={alliance:false,truceUntil:0,friend:0};return state.relations[k];}
  function relStatus(f){if(isAllied(state.faction,f))return {t:'同盟',c:'var(--teal)'};if(isTruce(state.faction,f))return {t:'停戦',c:'var(--blue)'};const r=state.relations[relKey(state.faction,f)];if(r&&r.friend<=-30)return {t:'敵対',c:'var(--red)'};return {t:'中立',c:'var(--muted)'};}
  function decayDiplomacy(){Object.values(state.relations).forEach(r=>{if(r.friend>0)r.friend=Math.max(0,r.friend-1);else if(r.friend<0)r.friend=Math.min(0,r.friend+1);});}
  function proposeAlliance(f){const r=ensureRel(state.faction,f),pc=factionCounts(),mine=pc[state.faction]||0,theirs=pc[f]||0;const accept=r.friend>=25||(theirs<=mine&&Math.random()<0.55)||(r.friend>=0&&Math.random()<0.3);if(accept){r.alliance=true;r.friend=Math.max(r.friend,30);addLog(`${factionById[f].name}と同盟を結んだ。`);}else addLog(`${factionById[f].name}は同盟を断った。`);sfx('click');buildDiplo();updateUI();saveGame();}
  function proposeTruce(f){const r=ensureRel(state.faction,f),accept=r.friend>=-15||Math.random()<0.5;if(accept){r.truceUntil=state.turn+6;r.friend=Math.max(r.friend,5);addLog(`${factionById[f].name}と6巡の停戦に合意した。`);}else addLog(`${factionById[f].name}は停戦を拒んだ。`);sfx('click');buildDiplo();updateUI();saveGame();}
  function giveGift(f){if(state.gold<50){addLog('贈物に充てる資金が足りない。');buildDiplo();return;}state.gold-=50;const r=ensureRel(state.faction,f);r.friend=Math.min(100,r.friend+15);r.alliance=r.alliance;addLog(`${factionById[f].name}へ贈物（50金）を届け、関係が改善した。`);sfx('click');buildDiplo();updateUI();saveGame();}
  function jointAttack(f){if(state.gold<100){addLog('共同出兵の兵糧（100金）が足りない。');buildDiplo();return;}const allyCities=CITIES.filter(c=>c.owner===f&&c.garrison>=40);let done=false;for(const c of allyCities){for(const nid of c.neighbors){const d=cityById[nid];if(!d||d.owner===f||d.owner===state.faction||isAllied(f,d.owner)||isTruce(f,d.owner))continue;state.gold-=100;const prev=d.owner,r=simResolve(c,d);if(r.win){d.owner=f;d.garrison=Math.max(10,r.atkSurv);d.generals=c.generals.slice();c.generals=[];c.garrison=r.homeKeep;addLog(`同盟軍（${factionById[f].name}）が${d.name}を${factionById[prev].name}から攻略した。`);}else{c.garrison=r.homeKeep+Math.floor(r.atkSurv*0.7);d.garrison=Math.max(8,r.defSurv);addLog(`同盟軍（${factionById[f].name}）の${d.name}攻めは退けられた。`);}done=true;break;}if(done)break;}if(!done)addLog(`${factionById[f].name}には出兵できる戦線がなかった。`);sfx('march');buildDiplo();updateUI();draw();checkVictory();saveGame();}
  function buildDiplo(){const grid=document.getElementById('diploGrid');const pc=factionCounts();const others=FACTIONS.filter(f=>f.id!==state.faction&&(pc[f.id]||0)>0);grid.innerHTML='';if(!others.length){grid.innerHTML='<div class="subtle">交渉できる勢力がありません。</div>';return;}others.forEach(f=>{const st=relStatus(f.id),ally=isAllied(state.faction,f.id),card=document.createElement('div');card.className='diploCard';card.style.setProperty('--dc',f.color);card.innerHTML=`<h3>${f.name}</h3><div class="dLeader">君主：${f.leader}　領土 ${pc[f.id]||0}州</div><span class="dRel" style="color:${st.c}">${st.t}</span><div class="dActions">${ally?`<button data-joint="${f.id}">共同出兵（100金）</button>`:`<button data-ally="${f.id}">同盟</button><button data-truce="${f.id}">停戦</button>`}<button data-gift="${f.id}">贈物（50金）</button></div>`;grid.appendChild(card);});grid.querySelectorAll('[data-ally]').forEach(b=>b.onclick=()=>proposeAlliance(b.dataset.ally));grid.querySelectorAll('[data-truce]').forEach(b=>b.onclick=()=>proposeTruce(b.dataset.truce));grid.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>giveGift(b.dataset.gift));grid.querySelectorAll('[data-joint]').forEach(b=>b.onclick=()=>jointAttack(b.dataset.joint));}
  // ===== セーブ／ロード（localStorage・端末内のみ） =====
  const SAVE_KEY='sanguo_save_v1';
  function saveGame(){if(!state.faction)return;try{const data={v:1,faction:state.faction,year:state.year,turn:state.turn,gold:state.gold,selectedCity:state.selectedCity,over:state.over,muted:state.muted,relations:state.relations,cities:CITIES.map(c=>({id:c.id,owner:c.owner,garrison:c.garrison,prosperity:c.prosperity,generals:c.generals}))};localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}}
  function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
  function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
  function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;const d=JSON.parse(raw);if(!d||!d.faction)return false;state.faction=d.faction;state.year=d.year;state.turn=d.turn;state.gold=d.gold;state.selectedCity=d.selectedCity;state.over=!!d.over;state.muted=!!d.muted;state.relations=d.relations||{};(d.cities||[]).forEach(cd=>{const c=cityById[cd.id];if(c){c.owner=cd.owner;c.garrison=cd.garrison;c.prosperity=cd.prosperity;c.generals=cd.generals||[];}});state.log=[`${factionById[state.faction].name}・${state.year}年から戦いを再開した。`];return true;}catch(e){return false;}}
  const SCENARIO_STORIES=[
    {id:'yellow_turban',date:'184年2月',title:'黄巾の乱',image:'gpt/scenarios/sanguo-scenario-184-yellow-turban-gpt-image-2.png',comment:'飢饉と重税に苦しむ民が立ち上がり、後漢の秩序は大きく揺らぐ。各地の英雄たちは、乱世の入口へ踏み出した。',year:184},
    {id:'anti_dong_zhuo',date:'190年1月',title:'反董卓連合軍',image:'gpt/scenarios/sanguo-scenario-190-anti-dong-zhuo-gpt-image-2.png',comment:'洛陽を掌握した董卓に対し、諸侯は連合軍を結成する。だが、共通の敵を前にしても、野心は一つではない。',year:190},
    {id:'lu_bu_campaign',date:'198年1月',title:'呂布討伐戦',image:'gpt/scenarios/sanguo-scenario-198-lu-bu-campaign-gpt-image-2.png',comment:'天下無双と称された呂布は、下邳で追い詰められた。曹操と劉備の思惑が交錯する、運命の包囲戦が始まる。',year:198},
    {id:'guandu',date:'200年1月',title:'官渡の戦い',image:'gpt/scenarios/sanguo-scenario-200-guandu-gpt-image-2.png',comment:'河北を制した袁紹と、献帝を擁する曹操。兵力差を覆す知略が、中原の覇権を決めようとしている。',year:200},

    {id:'red_cliffs',date:'208年8月',title:'赤壁の戦い',image:'gpt/scenarios/sanguo-scenario-208-red-cliffs-gpt-image-2.png',comment:'曹操の大軍は長江を南下する。孫権と劉備は連合し、水上決戦に天下の行方を託した。',year:208},

    {id:'five_routes',date:'223年',title:'五路侵攻戦',image:'gpt/scenarios/sanguo-scenario-223-five-routes-gpt-image-2.png',comment:'劉備の死後、魏・呉・南蛮などの脅威が蜀を包囲する。諸葛亮は五つの侵攻路を前に、国家の存亡を担う。',year:223}
  ];
  let selectedScenario=null;
  const storyStyle=document.createElement('style');storyStyle.textContent='.scenarioModal{position:fixed;inset:0;z-index:30;background:rgba(4,7,10,.92);display:grid;place-items:center;padding:20px}.scenarioBox{width:min(1050px,100%);max-height:92vh;overflow:auto;background:#101821;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}.scenarioGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.scenarioCard{text-align:left;padding:14px;border-color:rgba(228,194,123,.3)}.scenarioCard small{display:block;color:var(--gold);margin-bottom:4px}.storyArt{width:100%;max-height:54vh;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}.storyCopy{margin:16px 0;color:#f5efe3;line-height:1.85;font-size:16px}.storyTitle{margin:15px 0 0;font-family:serif;font-size:32px;color:var(--gold)}@media(max-width:650px){.scenarioGrid{grid-template-columns:1fr}.scenarioBox{padding:16px}.storyTitle{font-size:25px}}';document.head.appendChild(storyStyle);
  const scenarioModal=document.createElement('div');scenarioModal.className='scenarioModal hidden';document.body.appendChild(scenarioModal);
  function openScenarioPicker(){scenarioModal.classList.remove('hidden');scenarioModal.innerHTML=`<div class="scenarioBox"><div class="eyebrow">SCENARIO SELECT / シナリオ選択</div><h2 style="margin:8px 0 18px;font-family:serif">開始年代を選択</h2><div class="scenarioGrid">${SCENARIO_STORIES.map((s,i)=>`<button class="scenarioCard" data-scenario="${i}"><small>${s.date}</small><b>${s.title}</b></button>`).join('')}</div><div style="margin-top:16px"><button id="scenarioClose">戻る</button></div></div>`;scenarioModal.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>openStory(SCENARIO_STORIES[Number(b.dataset.scenario)]));document.getElementById('scenarioClose').onclick=()=>scenarioModal.classList.add('hidden');}
  function openStory(s){selectedScenario=s;scenarioModal.innerHTML=`<div class="scenarioBox"><img class="storyArt" src="${ASSET_ROOT+s.image}" alt="${s.title}"><div class="eyebrow" style="margin-top:15px">${s.date} / OPENING STORY</div><h2 class="storyTitle">${s.title}</h2><p class="storyCopy">${s.comment}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button id="storyBack">シナリオ選択へ</button><button id="storyStart" class="primary">この時代で開始</button></div></div>`;document.getElementById('storyBack').onclick=openScenarioPicker;document.getElementById('storyStart').onclick=()=>startScenario(s);}
  function startScenario(s){clearSave();state.over=false;state.year=s.year;state.turn=1;state.gold=600;state.relations={};state.selectedCity=CITIES.find(c=>c.owner===state.faction)?.id||'luo_yang';state.log=[`${s.date}`];state.log=[`${s.title}：${s.comment}`];scenarioModal.classList.add('hidden');enterGame();saveGame();}
  document.getElementById('startButton').onclick=()=>{if(state.faction)openScenarioPicker();};
  const landscapeStyle=document.createElement('style');landscapeStyle.textContent='.sanguo-landscape-gate{display:none;position:fixed;inset:0;z-index:90;place-items:center;padding:24px;background:rgba(4,7,10,.94);text-align:center}.sanguo-landscape-gate .landscape-card{max-width:390px;padding:28px 24px;border:1px solid rgba(228,194,123,.45);border-radius:18px;background:linear-gradient(145deg,rgba(24,32,42,.98),rgba(10,15,21,.98));box-shadow:var(--shadow)}.sanguo-landscape-gate .landscape-icon{font-size:54px;line-height:1}.sanguo-landscape-gate h2{margin:12px 0 8px;font-family:serif;color:var(--gold)}.sanguo-landscape-gate p{margin:0;color:var(--muted);line-height:1.7}.sanguo-landscape-gate button{margin-top:20px}@media (max-width:760px) and (orientation:portrait){body.sanguo-touch .sanguo-landscape-gate{display:grid}}';document.head.appendChild(landscapeStyle);
  const landscapeGate=document.createElement('div');landscapeGate.className='sanguo-landscape-gate';landscapeGate.innerHTML='<div class="landscape-card"><div class="landscape-icon">📱↔️</div><h2>横向きでプレイ</h2><p>三国志・天下三分は横画面に最適化されています。<br>端末を横向きにしてください。</p><p style="font-size:12px;margin-top:8px">Landscape mode is recommended.</p><button class="primary">横向き全画面で開始</button></div>';document.body.appendChild(landscapeGate);
  const touchCapable=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;document.body.classList.toggle('sanguo-touch',touchCapable);
  landscapeGate.querySelector('button').onclick=()=>{const el=document.documentElement,request=el.requestFullscreen||el.webkitRequestFullscreen;try{Promise.resolve(request?request.call(el):null).then(()=>{if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape');}).catch(()=>{});}catch(e){}};
  const EXPANDED_PORTRAIT_ATLASES=[
    {file:'gpt/sanguo-generals-atlas-01.png',cols:6,rows:6,count:36},{file:'gpt/sanguo-generals-atlas-02.png',cols:6,rows:6,count:36},{file:'gpt/sanguo-generals-atlas-03.png',cols:6,rows:6,count:36},
    {file:'gpt/sanguo-generals-atlas-04-gpt-image-2.png',cols:6,rows:6,names:['Yue Jin','Li Dian','Cao Zhen','Cao Xiu','Wang Shuang','Guo Huai','Wen Pin','Zang Ba','Hao Zhao','Jia Kui','Tian Chou','Cao Shuang','Ma Liang','Ma Su','Liao Hua','Wang Ping','Zhang Yi','Ma Zhong','Zhuge Zhan','Jiang Wan','Fei Yi','Dong Yun','Huo Yi','Yan Yan','Jiang Qin','Zhou Tai','Lu Kang','Sun Luban','Bu Zhi','Kan Ze','Xue Zong','Zhuge Jin','Sun Deng','Sun Hao','Zhuge Ke','He Qi']},

  const extraNames=EXPANDED_PORTRAIT_ATLASES.slice(3).flatMap(a=>a.names); extraNames.forEach(n=>{GENERAL_JP.push(n);GENERAL_IDS.push(n.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''));});
  buildRoster=()=>{const grid=document.getElementById('rosterGrid');grid.innerHTML='';let offset=0;EXPANDED_PORTRAIT_ATLASES.forEach(a=>{const count=a.count||a.names.length;for(let slot=0;slot<count&&offset<GENERAL_JP.length;slot++,offset++){const col=slot%a.cols,row=Math.floor(slot/a.cols),st=statFor(GENERAL_IDS[offset]),card=document.createElement('div');card.className='generalCard';card.innerHTML=`<div class="portrait" style="background-image:url('${ASSET_ROOT}${a.file}');background-size:${a.cols*100}% ${a.rows*100}%;background-position:${col*(100/(a.cols-1||1))}% ${row*(100/(a.rows-1||1))}%"></div><span>${GENERAL_JP[offset]}</span><small>武${st.bu} 知${st.chi} 統${st.tou}</small>`;grid.appendChild(card);}});state.rosterData=true;};
  const guide=document.createElement('div');guide.className='scenarioModal hidden';guide.innerHTML='<div class="scenarioBox"><div class="eyebrow">QUICK TUTORIAL / 遊び方</div><h2 style="font-family:serif;color:var(--gold)">天下を制する三手</h2><p class="storyCopy">1. 自領をタップして「内政」「登用」を行います。<br>2. 隣接する敵城を選び、出陣します。<br>3. ヘックス戦では地形と兵科相性を活かして勝利を目指します。<br><br>騎兵は弓兵に、弓兵は槍兵に、槍兵は騎兵に有利です。山・森・河川のヘックスは防御や移動に影響します。</p><div style="text-align:right"><button class="primary">理解した</button></div></div>';document.body.appendChild(guide);guide.querySelector('button').onclick=()=>{guide.classList.add('hidden');localStorage.setItem('sanguoTutorialSeen','1');};
  const priorStartScenario=startScenario; startScenario=(s)=>{priorStartScenario(s);if(!localStorage.getItem('sanguoTutorialSeen'))guide.classList.remove('hidden');};
  const HISTORY_EVENTS={200:{title:'官渡・烏巣奇襲',text:'補給線を断つ奇策が、兵力差を覆す鍵となる。曹操軍は決断を迫られている。'},208:{title:'赤壁・連環の計',text:'長江の風向きが戦局を左右する。水軍を率いる者は火計の機会をうかがう。'},214:{title:'益州の民心',text:'新たな統治者には、兵だけでなく民の信頼が求められる。内政の成果が大きく影響する。'},223:{title:'五路からの脅威',text:'四方からの圧力に備え、城ごとの兵力と外交関係を見直す時である。'}};
  const historyBox=document.createElement('div');historyBox.className='scenarioModal hidden';document.body.appendChild(historyBox);function showHistoryEvent(ev){historyBox.innerHTML=`<div class="scenarioBox"><div class="eyebrow">HISTORICAL EVENT / 歴史イベント</div><h2 class="storyTitle">${ev.title}</h2><p class="storyCopy">${ev.text}</p><div style="text-align:right"><button class="primary">軍議を続ける</button></div></div>`;historyBox.classList.remove('hidden');historyBox.querySelector('button').onclick=()=>historyBox.classList.add('hidden');}

document.getElementById('endTurnButton').onclick=endTurn;

  addEventListener('resize',()=>{if(state.screen==='battle')bResize();});
