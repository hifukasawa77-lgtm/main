<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>幕末風雲記</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-frame">
    <header class="game-hud">
      <div class="clan-head"><i id="clan-mark"></i><div><strong id="faction-label">勢力を選択</strong><small id="date-label">嘉永6年 7月・第1月</small></div></div>
      <div class="hud-stat"><span>金</span><b id="treasury-label">—</b><em>両</em></div>
      <div class="hud-stat"><span>総兵力</span><b id="military-label">—</b><em>人</em></div>
      <div class="hud-stat"><span>近代化</span><b id="modernization-label">—</b><em>/100</em></div>
      <div class="hud-stat"><span>威信</span><b id="influence-label">—</b><em>/100</em></div>
      <div class="hud-stat last"><span>民心</span><b id="stability-label">—</b><em>/100</em></div>
    </header>
    <section class="play-area">
      <section class="map-stage"><div id="map" class="strategic-map" aria-label="幕末日本地図"></div><p class="map-tip">拠点を選択　/　自勢力: 内政・出陣　/　他勢力: 交渉・侵攻</p></section>
      <aside class="side-panel">
        <section id="location-panel" class="location-panel"></section>
        <section class="clans"><h2>— 勢力 / Domains —</h2><div id="faction-list"></div></section>
        <section class="chronicle"><h2>— 瓦版 —</h2><ol id="chronicle-list"></ol></section>
      </aside>
    </section>
    <footer class="game-footer"><span>幕末の野望 / Bakumatsu no Fūunki</span><div><button id="save-button" class="sub-button">記録</button><button id="reset-button" class="sub-button">タイトルへ</button><button id="advance-button" class="end-turn">月を進める<br><small>End Turn</small></button></div></footer>
  </main>
  <dialog id="start-dialog" class="start-dialog"><div class="title-art"></div><section><p>BAKUMATSU FŪUNKI</p><h1>幕末風雲記</h1><h2 id="scenario-title">嘉永六年、黒船来航。</h2><span id="scenario-copy">天下を巡る争いは、城ではなく藩・港・朝廷へ舞台を変えた。</span><h3>シナリオを選択</h3><div id="scenario-choices" class="scenario-choices"></div><h3>プレイする勢力を選択</h3><div id="faction-choices" class="faction-choices"></div></section></dialog>
  <dialog id="command-dialog" class="command-dialog"><div id="command-content"></div></dialog>
  <script src="data.js"></script><script src="game.js"></script>
</body>
</html>
