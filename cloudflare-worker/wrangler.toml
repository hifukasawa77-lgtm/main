name = "ai-proxy"
main = "gemini-proxy.js"
compatibility_date = "2024-09-23"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2026091401"
simple = { limit = 30, period = 60 }

# 攻撃の遮断: 拒否（401/403/413/415/429・攻撃パターン）を送信元IPごとに数え、
# 60秒に10回を超えたIPは15分間すべて拒否する（security-monitor.js）。
[[ratelimits]]
name = "ABUSE_LIMITER"
namespace_id = "2026100801"
simple = { limit = 10, period = 60 }

# シスログ（RFC 5424 形式の SECURITY 行）を Workers Logs に残す。
# 見方: npx wrangler tail / ダッシュボード → Workers → ログ
[observability]
enabled = true

[ai]
binding = "AI"

# 共有学習メモリ（任意）— ダッシュボードで KV namespace「AGENT_MEMORY」を作成し、
# 下の id を実際の namespace ID に置き換えること（README.md 参照）
# [[kv_namespaces]]
# binding = "KV"
# id = "<AGENT_MEMORY の namespace ID>"

[vars]
VOCALIS_MONTHLY_BUDGET_USD = "0.50"

[[durable_objects.bindings]]
name = "VOCALIS_BUDGET"
class_name = "VocalisBudget"

[[migrations]]
tag = "vocalis-budget-v1"
new_sqlite_classes = ["VocalisBudget"]
