name = "notebook-proxy"
main = "notebook-worker.js"
compatibility_date = "2024-09-23"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2026091402"
simple = { limit = 10, period = 60 }

# 攻撃の遮断: 拒否（401/403/413/415/429・攻撃パターン）を送信元IPごとに数え、
# 60秒に10回を超えたIPは15分間すべて拒否する（security-monitor.js）。
[[ratelimits]]
name = "ABUSE_LIMITER"
namespace_id = "2026100802"
simple = { limit = 10, period = 60 }

# シスログ（RFC 5424 形式の SECURITY 行）を Workers Logs に残す。
# 見方: npx wrangler tail / ダッシュボード → Workers → ログ
[observability]
enabled = true

[ai]
binding = "AI"
