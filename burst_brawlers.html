  s.connect(f);f.connect(g);g.connect(mg);s.start(t,rnd()*.5);s.stop(t+d+.03);
}

function bgmTick(){
  if(!AC||AC.state!=='running'||!bgmOn)return;
  while(bgmNext<AC.currentTime+.25){
    const s=bgmStep%16,bar=Math.floor(bgmStep/16)%4,dly=bgmNext-AC.currentTime;
    if(!muted){
      tone(BASS[s],.11,'triangle',.11,0,dly);
      if(s%2===0){const n=LEAD[bar][(s/2)%4];tone(220*Math.pow(2,n/12)*(s%8===6?2:1),.1,'square',.032,0,dly);}
      if(s%4===0)noise(.06,.1,200,dly);
      if(s%4===2)noise(.05,.06,6000,dly,'highpass');
    }
    bgmNext+=60/160/4;bgmStep++;
  }
}

function padRead(i){
  let g=null;try{const gp=navigator.getGamepads?navigator.getGamepads():[];g=gp[i];}catch(e){}
  if(!g||!g.connected)return null;
  const b=n=>!!(g.buttons[n]&&g.buttons[n].pressed),ax=g.axes[0]||0,ay=g.axes[1]||0;
  return {l:ax<-.45||b(14),r:ax>.45||b(15),u:ay<-.55||b(12),d:ay>.55||b(13),jump:b(0)||b(3)||ay<-.8,a:b(2),s:b(1),sh:b(4)||b(5)||b(6)||b(7)};
}
const padPrev=[{},{}];
function pollPadMenus(){
  for(let i=0;i<2;i++){
    const g=padRead(i);if(!g)continue;
    const raw=navigator.getGamepads()[i],anyBtn=raw.buttons.some(b=>b.pressed),pv=padPrev[i];
    const edge=(k,v)=>v&&!pv[k];
    const cur={l:g.l,r:g.r,u:g.u,d:g.d,ok:raw.buttons[0]&&raw.buttons[0].pressed,back:raw.buttons[1]&&raw.buttons[1].pressed,start:raw.buttons[9]&&raw.buttons[9].pressed,any:anyBtn};
    if(G.mode==='demo'&&G.scene!=='select'&&edge('any',cur.any)){openSelect();sfx.menu();}
    else if(G.scene==='select'){
      if(i===0){if(edge('l',cur.l))selectKey('KeyA');if(edge('r',cur.r))selectKey('KeyD');if(edge('u',cur.u))selectKey('KeyW');if(edge('d',cur.d))selectKey('KeyS');if(edge('ok',cur.ok))selectKey('KeyJ');if(edge('back',cur.back))selectKey('KeyK');}
      else{if(edge('l',cur.l))selectKey('ArrowLeft');if(edge('r',cur.r))selectKey('ArrowRight');if(edge('ok',cur.ok))selectKey('Comma');if(edge('back',cur.back))selectKey('Period');}
    }
    else if(G.scene==='result'&&G.resT>1.2&&G.mode==='play'&&edge('ok',cur.ok))openSelect();
    else if((G.scene==='fight'||G.scene==='count')&&G.mode==='play'&&edge('start',cur.start))G.paused=!G.paused;
    padPrev[i]=cur;
  }
}

/* ---------------- 当たり判定・攻撃 ---------------- */
function boxOf(f,mv){return f.face>0?{x:f.x+mv.bx,y:f.y+mv.by,w:mv.bw,h:mv.bh}:{x:f.x-mv.bx-mv.bw,y:f.y+mv.by,w:mv.bw,h:mv.bh};}
function hurtOf(o){return {x:o.x-19,y:o.y-86,w:38,h:86};}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function startAttack(f,kind,inp){
  const c=CH[f.ch];let name,mv;
  if(kind==='b'){
    if(inp.u){if(f.upUsed&&!f.ground)return false;name='upB';mv=Object.assign({},MV.upB);mv.rise=c.rise;}
    else{name='special';mv=Object.assign({},c.sp);}
  }else{
    name=inp.u?'up':inp.d?'down':(inp.l||inp.r)?'side':'jab';mv=Object.assign({},MV[name]);
    if(c.mod&&c.mod[name])Object.assign(mv,c.mod[name]);
    if(f.ground){if(name==='side'&&(inp.l||inp.r))f.face=inp.r?1:-1;}
    else{
      if(name==='jab'){name='nair';mv={dur:26,h0:5,h1:16,bx:-48,by:-90,bw:96,bh:84,dmg:6.5,kb:300,ks:3,ang:52,hs:4};}
      else if(name==='side'){const dirIn=inp.r?1:-1;
        if(dirIn===f.face){name='fair';mv={dur:34,h0:11,h1:18,bx:18,by:-92,bw:76,bh:58,dmg:10,kb:410,ks:4.8,ang:38,hs:6};}
        else{name='bair';mv={dur:32,h0:9,h1:16,bx:-92,by:-88,bw:72,bh:52,dmg:11,kb:450,ks:5.2,ang:36,hs:6,rev:true};}}
      else if(name==='down'){mv.ang=-72;mv.dmg=9;mv.kb=330;mv.ks=3.6;}
      if(c.mod&&c.mod[name])Object.assign(mv,c.mod[name]);
    }
  }
  mv.dur=Math.round(mv.dur*c.spd);if(mv.h0!==undefined){mv.h0=Math.round(mv.h0*c.spd);mv.h1=Math.round(mv.h1*c.spd);}
  f.state='attack';f.atk={name,mv,fr:0,hit:[],air:!f.ground,ch:0,cg:f.ground&&(name==='side'||name==='up'||name==='down'),ap:false};f.st=0;
  sfx.swing();return true;
}
function applyHit(att,tgt,mv,dirx,pos){
  if(tgt.inv>0||tgt.dead)return false;
  if(tgt.state==='grab'&&tgt.gr&&tgt.gr.v){tgt.gr.v.state='free';tgt.gr.v.gb=null;tgt.gr=null;}
  const c=CH[tgt.ch],pw=att?CH[att.ch].power:1;
  let dmg=mv.dmg*pw;
  if(tgt.state==='shield'){
    tgt.shield-=dmg*.02+.03;sfx.shield();spark(pos.x,pos.y,'#8ff',6,200,.25,4);ring(pos.x,pos.y,'#8ff',60,.2);
    tgt.vx+=dirx*160;G.hitstop=Math.max(G.hitstop,3);
    if(tgt.shield<=0){tgt.state='stun';tgt.stun=150;tgt.shield=.5;tgt.sb=true;sfx.sbreak();burst(tgt.x,tgt.y-40,'#8ff');tgt.vy=-600;tgt.ground=false;}
    return true;
  }
  tgt.pct=Math.min(999,tgt.pct+dmg);
  if(att){att.dmgDealt+=dmg;tgt.last=att;tgt.lastT=300;}
  const kbF=(mv.kb+mv.ks*tgt.pct)/c.weight*1.18;
  const a=mv.ang*Math.PI/180;
  tgt.vx=Math.cos(a)*dirx*kbF;tgt.vy=-Math.sin(a)*kbF;
  if(tgt.ground&&tgt.vy>0){tgt.vy=-Math.abs(tgt.vy)*.5;}
  if(tgt.vy<-60||kbF>380)tgt.ground=false;
  tgt.state='stun';tgt.stun=clamp(Math.floor(kbF*.034),9,64);tgt.atk=null;tgt.ledge=null;tgt.sb=false;tgt.flash=6;tgt.helpless=false;
  tgt.spin=dirx*(kbF>700?1:0);
  const hs=Math.min(14,mv.hs||3+Math.floor(dmg/3));G.hitstop=Math.max(G.hitstop,hs);
  G.shake=Math.max(G.shake,Math.min(18,dmg*.7));
  sfx.hit(dmg+tgt.pct*.04);
  spark(pos.x,pos.y,'#ffe27a',12+Math.floor(dmg),420,.35,5);spark(pos.x,pos.y,'#fff',6,300,.25,4);ring(pos.x,pos.y,'#fff',60+dmg*4,.25);
  return true;
}
function checkMeleeHits(f){
  const a=f.atk,mv=a.mv;if(mv.h0===undefined||a.fr<mv.h0||a.fr>mv.h1)return;
  const b=boxOf(f,mv);
  for(const o of fighters){
    if(o===f||o.dead||o.out||a.hit.includes(o))continue;
    if(overlap(b,hurtOf(o))){
      a.hit.push(o);
      applyHit(f,o,mv,mv.rev?-f.face:f.face,{x:lerp(f.x,o.x,.7)+f.face*10,y:o.y-50});
    }
  }
  for(const it of items){if(it.t==='bomb'&&it.state!=='held'&&!a.hit.includes(it)&&overlap(b,{x:it.x-14,y:it.y-28,w:28,h:28})){a.hit.push(it);it.vx=f.face*520;it.vy=-380;it.state='thrown';it.owner=f;it.fuse=Math.min(it.fuse||90,70);}}
}

/* ---------------- ステージ衝突 ---------------- */
function collideStage(f,py){
  let landed=false;const m=ST.main;
  if(f.vy>=0){
    for(const p of PLATS){
      if(p.soft&&f.drop>0)continue;
      if(f.x>p.x0-4&&f.x<p.x1+4&&py<=p.y+3&&f.y>=p.y){f.y=p.y;f.vy=0;landed=true;f.plat=p;break;}
    }
  }
  if(!landed){
    const top=m.y,bot=m.y+m.depth,l=m.x0,r=m.x1,fx0=f.x-17,fx1=f.x+17,fy0=f.y-84,fy1=f.y;
    if(fx1>l&&fx0<r&&fy1>top+8&&fy0<bot){
      const pl=fx1-l,pr=r-fx0,pb=bot-fy0,mn=Math.min(pl,pr,pb);
      if(mn===pl){f.x-=pl;if(f.vx>0)f.vx=0;}else if(mn===pr){f.x+=pr;if(f.vx<0)f.vx=0;}else{f.y+=pb;if(f.vy<0)f.vy=0;}
    }
  }
  return landed;
}
function tryLedge(f){
  if(f.lc>0||f.vy<0||f.state==='stun')return false;
  for(const L of ST.ledges){
    if(L.who&&L.who!==f)continue;
    const dx=(f.x-L.x)*L.side;
    if(dx>-6&&dx<46&&f.y>L.y+24&&f.y<L.y+120){
      f.state='ledge';f.ledge=L;L.who=f;f.ledgeT=0;f.x=L.x+L.side*22;f.y=L.y+86;f.vx=f.vy=0;f.face=-L.side;f.jumps=1;f.upUsed=false;f.helpless=false;f.atk=null;
      sfx.ledge();spark(L.x,L.y,'#fff',6,160,.25,3);return true;
    }
  }
  return false;
}
function leaveLedge(f){if(f.ledge){f.ledge.who=null;f.ledge=null;}}

/* ---------------- ファイター更新 ---------------- */
function koFighter(f){
  const bx=clamp(f.x,ST.blast.l+40,ST.blast.r-40),by=clamp(f.y,ST.blast.t+40,ST.blast.b-40);
  burst(bx,by,f.col);sfx.ko();G.shake=26;G.flashW=.25;
  f.dead=true;f.stocks--;f.falls++;leaveLedge(f);G.noKoT=0;G.sudden=false;
  if(f.last&&f.lastT>0&&f.last!==f)f.last.kills++;
  if(f.held){f.held.state='fall';f.held=null;}
  f.pct=0;f.vx=f.vy=0;
  if(f.stocks<=0){f.out=true;f.dead=true;}else f.respT=110;
  const alive=fighters.filter(o=>!o.out);
  if(alive.length<=1&&G.scene==='fight'){G.slow=1;G.slowT=70;}
  checkEnd();
}
function respawn(f){
  f.dead=false;f.state='respawn';f.rt=0;f.x=(f.slot-1.5)*70;f.y=-420;f.vx=f.vy=0;f.ground=true;f.plat=null;f.inv=240;f.pct=0;f.shield=1;f.jumps=2;f.upUsed=false;f.helpless=false;f.atk=null;f.stun=0;f.held=null;f.face=f.x<0?1:-1;
}
function checkEnd(){
  if(G.scene!=='fight')return;
  const alive=fighters.filter(o=>!o.out);
  if(alive.length<=1){G.scene='result';G.resT=0;G.winner=alive[0]||null;if(G.mode==='play')sfx.win();}
}
function tryGrab(f){
  for(const o of fighters){
    if(o===f||o.dead||o.out||o.inv>0||['ledge','respawn','grabbed','grab','dodge'].includes(o.state))continue;
    const dx=(o.x-f.x)*f.face;
    if(dx>6&&dx<100&&Math.abs(o.y-f.y)<50){
      f.state='grab';f.gr={v:o,t:0};o.state='grabbed';o.gb=f;o.esc=0;o.atk=null;o.stun=0;o.ledge&&leaveLedge(o);
      G.hitstop=Math.max(G.hitstop,3);sfx.hit(6);spark(o.x,o.y-50,'#fff',8,200,.25,4);return true;
    }
  }
  return false;
}
function throwFoe(f,o,dir){
  let ang=38,kb=470,ks=5.6,dmg=9,dx=f.face;
  if(dir==='u'){ang=88;kb=470;ks=5;dmg=8;}
  else if(dir==='d'){ang=70;kb=380;ks=4.6;dmg=7;}
  else if(dir==='l'||dir==='r'){const d=dir==='r'?1:-1;if(d!==f.face){kb=500;ks=5.8;dmg=9.5;dx=-f.face;}}
  o.state='free';o.gb=null;f.state='free';f.gr=null;o.inv=0;
  applyHit(f,o,{dmg,kb,ks,ang,hs:8},dx,{x:o.x,y:o.y-50});
}
function updateFighter(f,inp){
  f.anim++;f.flash=Math.max(0,f.flash-1);f.sq*=.8;
  if(f.lastT>0)f.lastT--;
  if(f.dead){if(f.out)return;f.respT--;if(f.respT<=0)respawn(f);return;}
  if(f.inv>0)f.inv--;if(f.drop>0)f.drop--;if(f.lc>0)f.lc--;
  const c=CH[f.ch],py=f.y;
  let moved=true;
  switch(f.state){
  case 'grab':{
    const o=f.gr&&f.gr.v;
    if(!o||o.state!=='grabbed'||o.dead){f.state='free';f.gr=null;break;}
    f.gr.t++;o.x=f.x+f.face*44;o.y=f.y;o.vx=o.vy=0;o.ground=true;o.plat=f.plat;f.vx*=.6;
    if(inp.aP){o.pct+=1.6;sfx.hit(3);spark(o.x,o.y-50,'#fff',4,160,.2,3);f.gr.t=Math.max(0,f.gr.t-6);G.hitstop=Math.max(G.hitstop,2);}
    const dir=inp.u?'u':inp.d?'d':inp.r?'r':inp.l?'l':null;
    if(f.gr.t>8&&dir||f.gr.t>150){throwFoe(f,o,dir||'f');}
    break;}
  case 'grabbed':{
    const g=f.gb;
    if(!g||g.state!=='grab'||g.dead){f.state='free';f.gb=null;break;}
    f.esc=(f.esc||0)+(inp.jumpP+inp.aP+inp.sP)*3+((inp.l||inp.r)&&f.anim%8===0?1:0);
    if(f.esc>=12){f.state='free';f.gb=null;g.state='free';g.gr=null;g.lag=0;f.vx=-g.face*260;f.vy=-200;f.ground=false;f.inv=14;sfx.djump();spark(f.x,f.y-50,'#fff',8,200,.25,4);}
    moved=false;break;}
  case 'respawn':{
    f.rt++;f.vx=f.vy=0;f.y=-420;
    if(inp.l||inp.r||inp.jumpP||inp.aP||inp.sP||inp.u||f.rt>200){f.state='free';f.ground=false;f.vy=-100;f.vx=0;}
    moved=false;break;}
  case 'ledge':{
    f.ledgeT++;f.inv=Math.max(f.inv,2);moved=false;
    if(inp.jumpP||inp.u||inp.aP){leaveLedge(f);const L=f.ledge||{side:-f.face};f.state='free';f.x+=-f.face*0;f.x=ST.main[f.face<0?'x1':'x0']*0+(f.face>0?ST.main.x0+26:ST.main.x1-26);f.y=0;f.vy=0;f.vx=0;f.ground=true;f.plat=ST.main;f.inv=40;dust(f.x,0,5);break;}
    if(inp.dP||f.ledgeT>260){leaveLedge(f);f.state='free';f.lc=30;f.ground=false;f.vy=60;f.vx=-f.face*0;}
    break;}
  case 'stun':{
    f.stun--;
    f.vy=Math.min(FALLMAX*1.4,f.vy+GRAV*DT);
    f.vx*=f.ground?.88:.997;
    if(inp.l)f.vx-=22;if(inp.r)f.vx+=22;
    if(f.stun<=0&&!f.sb){f.state='free';f.spin=0;}
    else if(f.stun<=0){f.state='free';f.sb=false;}
    break;}
  case 'dodge':{
    f.dodgeT--;f.inv=Math.max(f.inv,2);f.vx*=.92;if(f.dodgeT<=0)f.state='free';
    if(!f.ground)f.vy=Math.min(f.vy+GRAV*DT*.3,200);
    break;}
  case 'shield':{
    f.shield-=.0035;if(f.shield<=0){f.state='stun';f.stun=150;f.shield=.5;f.sb=true;sfx.sbreak();burst(f.x,f.y-40,'#8ff');f.vy=-600;f.ground=false;break;}
    f.vx*=.8;
    if(!inp.sh){f.state='free';break;}
    if(inp.jumpP){f.state='free';f.vy=-c.jump;f.ground=false;f.jumps=1;sfx.jump();break;}
    if(inp.aP){if(tryGrab(f))break;}
    if(inp.dP){f.state='dodge';f.dodgeT=20;f.vx=0;break;}
    if((inp.l||inp.r)&&f.shield<1&&f.st>6){f.state='dodge';f.dodgeT=22;f.vx=(inp.r?1:-1)*520;f.face=inp.r?-1:1;break;}
    f.st++;
    break;}
  case 'attack':{
    const a=f.atk,mv=a.mv;
    if(a.cg&&a.fr===mv.h0-3&&inp.aH&&a.ch<38&&f.ground){a.ch++;if(a.ch===1)sfx.swing();if(a.ch%12===0)tone(300+a.ch*8,.08,'triangle',.05);}
    else{
      a.fr++;
      if(a.ch>0&&!a.ap){const m=a.ch/38;mv.dmg*=1+m*.7;mv.kb*=1+m*.3;mv.ks*=1+m*.3;mv.hs=(mv.hs||3)+Math.floor(m*4);a.ap=true;sfx.swing();spark(f.x+f.face*30,f.y-60,'#fff',10,300,.25,4);}
    }
    if(a.fr===1){if(mv.lunge&&f.ground)f.vx+=f.face*mv.lunge*1.6;}
    if(mv.rise&&a.fr===4){f.vy=-mv.rise;f.ground=false;f.upUsed=true;f.vx=((inp.r?1:0)-(inp.l?1:0))*c.air*1.1;f.helpless=true;burst&&spark(f.x,f.y,c.acc,10,250,.3,4);}
    if(mv.proj&&a.fr===mv.proj.at)spawnProj(f,mv.proj);
    if(mv.rise&&a.fr>4&&a.fr<mv.dur-6){f.vx+=((inp.r?1:0)-(inp.l?1:0))*40;f.vx=clamp(f.vx,-c.air*1.2,c.air*1.2);}
    checkMeleeHits(f);
    if(f.ground)f.vx*=.82;else{f.vx+=((inp.r?1:0)-(inp.l?1:0))*c.air*.5*DT*8;f.vx*=.995;}
    if(a.fr>=mv.dur){f.state='free';f.atk=null;}
    break;}
  default:{ // free
    if(f.held&&(inp.aP)){throwItem(f,inp);break;}
    // 横移動
    if(inp.faceTo&&f.ground)f.face=inp.faceTo;
    const dir=(inp.r?1:0)-(inp.l?1:0);
    if(f.ground){
      if(dir){f.face=dir;f.vx+=dir*3300*DT;f.vx=clamp(f.vx,-c.run,c.run);}
      else{f.vx*=.8;if(Math.abs(f.vx)<8)f.vx=0;}
      if(inp.sh){f.state='shield';f.st=0;break;}
      if(inp.dP&&f.plat&&f.plat.soft){f.drop=16;f.ground=false;f.y+=4;}
    }else{
      if(dir){f.vx+=dir*1600*DT;f.vx=clamp(Math.abs(f.vx)>c.air?f.vx*.99:f.vx,-Math.max(c.air,Math.abs(f.vx)),Math.max(c.air,Math.abs(f.vx)));if(Math.abs(f.vx)>c.air)f.vx-=Math.sign(f.vx)*30;}
      else f.vx*=.992;
      if(inp.shP&&!f.airDodged){f.state='dodge';f.dodgeT=18;f.airDodged=true;f.vx=dir*480;f.vy=dir?-60:0;break;}
    }
    if(inp.jumpP){
      if(f.ground){f.vy=-c.jump;f.ground=false;f.jumps=1;f.sq=-.5;dust(f.x,f.y,4);sfx.jump();}
      else if(f.jumps>0&&!f.helpless){f.vy=-c.djump;f.jumps--;f.vx=dir*c.air*.7+f.vx*.3;sfx.djump();ring(f.x,f.y-10,'#fff',40,.25);spark(f.x,f.y,'#fff',6,120,.25,3);}
    }
    if(!f.ground&&inp.d&&f.vy>-80&&f.vy<700&&!f.helpless){f.fast=true;}
    if(inp.aP&&!f.helpless)startAttack(f,'a',inp);
    else if(inp.sP)startAttack(f,'b',inp);
    break;}
  }
  if(!moved)return;
  // 重力と移動
  if(f.state==='free'||f.state==='attack'||f.state==='dodge'||f.state==='shield'){
    if(!f.ground){
      let g=GRAV;if(f.state==='dodge')g=0;
      f.vy+=g*DT;const lim=f.fast?FASTFALL:FALLMAX;if(f.vy>lim)f.vy=lim;
    }
  }
  if(f.ground&&f.plat&&f.plat.mov){f.x+=f.plat.dx;f.y=f.plat.y;}
  f.x+=f.vx*DT;f.y+=f.vy*DT;
  if(f.ground){
    f.vy=0;
    const p=f.plat;
    if(!p||f.x<p.x0-6||f.x>p.x1+6){f.ground=false;f.plat=null;}
  }
  if(!f.ground||f.state==='stun'){
    const wasAir=!f.ground;
    const landed=collideStage(f,py);
    if(landed){
      if(f.state==='stun'&&f.vyPrev>520&&f.stun>6){f.vy=-f.vyPrev*.38;f.ground=false;f.sq=.5;sfx.land();dust(f.x,f.y,6);G.shake=Math.max(G.shake,4);}
      else{
        f.ground=true;f.vy=0;if(wasAir){f.sq=.5;dust(f.x,f.y,5);sfx.land();}
        f.jumps=2;f.fast=false;f.upUsed=false;f.helpless=false;f.airDodged=false;
        if(f.state==='attack'&&f.atk&&f.atk.air){f.atk.fr=Math.max(f.atk.fr,f.atk.mv.dur-7);}
        if(f.state==='stun'&&f.stun>14)f.stun=14;
      }
    }
    if(!f.ground&&(f.state==='free'||f.state==='attack'))tryLedge(f);
  }else collideStage(f,f.y-1);
  f.vyPrev=f.vy;
  // 軌跡
  if(f.state==='stun'&&hyp(f.vx,f.vy)>800){f.trail.push({x:f.x,y:f.y-42,a:1});}
  for(const t of f.trail)t.a-=.08;f.trail=f.trail.filter(t=>t.a>0);
  // 場外
  const B=ST.blast;if(f.x<B.l||f.x>B.r||f.y<B.t||f.y>B.b)koFighter(f);
}

/* ---------------- アイテム・弾 ---------------- */
function spawnItem(){
  const t=rnd()<.5?'heart':'bomb';
  items.push({t,x:(rnd()-.5)*700,y:-800,vx:0,vy:0,state:'fall',life:900,owner:null,fuse:0,hold:0});
}
function throwItem(f,inp){
  const it=f.held;f.held=null;it.state='thrown';it.owner=f;it.vx=f.face*640+f.vx*.3;it.vy=-280;it.x=f.x+f.face*20;it.y=f.y-60;it.fuse=75;sfx.swing();
}
function explodeBomb(it){
  boomFx(it.x,it.y);
  for(const o of fighters){
    if(o.dead||o.out)continue;const d=hyp(o.x-it.x,(o.y-44)-it.y);
    if(d<150){
      const dx=Math.sign(o.x-it.x)||1,mv={dmg:14,kb:480,ks:5.2,ang:55,hs:10};
      applyHit(it.owner&&it.owner!==o?it.owner:null,o,mv,dx,{x:o.x,y:o.y-44});
    }
  }
}
function boomFx(x,y){G.shake=Math.max(G.shake,16);sfx.boom();spark(x,y,'#ffa13a',34,600,.5,7);spark(x,y,'#fff',14,400,.3,6);ring(x,y,'#ffd27a',170,.4);ring(x,y,'#ff7a3a',120,.3);}
function updateItems(){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.life--;
    if(it.state==='held'){it.hold++;if(it.hold>260){it.state='fall';const h=fighters.find(f=>f.held===it);if(h)h.held=null;explodeBomb(it);items.splice(i,1);}continue;}
    if(it.state==='fall'){it.vy=Math.min(it.vy+500*DT,it.y<-300?140:520);it.y+=it.vy*DT;it.x+=it.vx*DT;it.vx*=.9;
      for(const p of PLATS){if(it.x>p.x0&&it.x<p.x1&&it.y>=p.y&&it.y-it.vy*DT<=p.y+4){it.y=p.y;it.vy=0;break;}}
      if(it.y>ST.blast.b||it.life<=0){items.splice(i,1);continue;}
      for(const f of fighters){
        if(f.dead||f.out||f.state==='respawn')continue;
        if(Math.abs(f.x-it.x)<30&&f.y-it.y<64&&f.y-it.y>-24){
          if(it.t==='heart'){f.pct=Math.max(0,f.pct-35);sfx.heal();spark(f.x,f.y-50,'#ff7a9a',16,260,.5,5);items.splice(i,1);break;}
          else if(!f.held){f.held=it;it.state='held';it.hold=0;sfx.item();break;}
        }
      }
    }else if(it.state==='thrown'){
      it.vy+=GRAV*.6*DT;it.x+=it.vx*DT;it.y+=it.vy*DT;it.fuse--;
      for(const p of PLATS){if(it.vy>0&&it.x>p.x0&&it.x<p.x1&&it.y>=p.y&&it.y-it.vy*DT<=p.y+4){it.y=p.y;it.vy*=-.4;it.vx*=.7;break;}}
      let hit=false;
      for(const f of fighters){if(f===it.owner&&it.fuse>40)continue;if(f.dead||f.out)continue;if(overlap({x:it.x-14,y:it.y-28,w:28,h:28},hurtOf(f))){hit=true;break;}}
      if(hit||it.fuse<=0||it.y>ST.blast.b){if(it.y<ST.blast.b)explodeBomb(it);items.splice(i,1);}
    }
  }
}
function updateProjs(){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.life-=DT;p.vy+=p.gy*DT;p.x+=p.vx*DT;p.y+=p.vy*DT;
    let dead=p.life<=0;
    if(p.type==='nut'||p.gy){
      for(const pl of PLATS){if(p.vy>0&&p.x>pl.x0&&p.x<pl.x1&&p.y>=pl.y&&p.y-p.vy*DT<=pl.y+4){p.y=pl.y;p.vy=-p.vy*p.bounce;p.bn++;dust(p.x,p.y,2);if(p.bn>3)dead=true;}}
      const m=ST.main;if(p.y>m.y&&p.y<m.y+m.depth&&((p.vx>0&&p.x>m.x0-8&&p.x<m.x0+30)||(p.vx<0&&p.x<m.x1+8&&p.x>m.x1-30))){p.vx=-p.vx;p.bn++;}
    }
    if(!dead)for(const o of fighters){
      if(o===p.owner||o.dead||o.out)continue;
      if(overlap({x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2},hurtOf(o))){
        applyHit(p.owner,o,p.mv,Math.sign(p.vx)||1,{x:p.x,y:p.y});dead=true;break;
      }
    }
    if(!dead)for(const q of projs){if(q!==p&&q.owner!==p.owner&&hyp(q.x-p.x,q.y-p.y)<p.r+q.r){spark(p.x,p.y,'#fff',8,250,.25,3);q.life=0;dead=true;}}
    if(dead||Math.abs(p.x)>1500||p.y>1000||p.y<-1300)projs.splice(i,1);
  }
}

/* ---------------- CPU の思考 ---------------- */
function aiInput(f){const inp=aiInput0(f);if(inp.aP)inp.aH=1;if(f.ai.hold>0){f.ai.hold--;inp.aH=1;}return inp;}
function aiInput0(f){
  const a=f.ai,lvl=a.lvl,inp={l:0,r:0,u:0,d:0,jumpP:0,aP:0,aH:0,sP:0,dP:0,sh:0,shP:0};
  let tgt=null,bd=1e9;
  for(const o of fighters){if(o===f||o.dead||o.out||o.state==='respawn')continue;const d=hyp(o.x-f.x,(o.y-f.y)*1.3);if(d<bd){bd=d;tgt=o;}}
  if(a.t>0)a.t--;if(a.sh>0)a.sh--;if(a.jt>0)a.jt--;
  if(f.state==='grabbed'){if(rnd()<.2)inp.jumpP=1;return inp;}
  if(f.state==='grab'){const g=f.gr;if(g){if(g.t<10&&rnd()<.25)inp.aP=1;else if(g.t>=12+((1-lvl)*30|0)){const e=f.x<0?-1:1;if(Math.abs(f.x)>150){if(e===1)inp.r=1;else inp.l=1;}else inp.u=1;}}return inp;}
  if(a.gr>0){a.gr--;inp.sh=1;if(f.state==='shield'){inp.aP=1;a.gr=0;a.t=30;}return inp;}
  const m=ST.main,c=CH[f.ch];
  if(f.state==='respawn'){if(a.wait++>40+rnd()*40){inp.jumpP=1;}return inp;}
  // 復帰
  const off=f.x<m.x0-24||f.x>m.x1+24||f.y>60&&!f.ground;
  if(f.state==='ledge'){a.wait++;if(a.wait>25+(1-lvl)*60){inp.jumpP=1;a.wait=0;}return inp;}
  a.wait=0;
  if(!f.ground&&off){
    const tx=f.x<0?m.x0+80:m.x1-80;
    if(f.x<tx-20)inp.r=1;else if(f.x>tx+20)inp.l=1;
    if(f.vy>-50&&a.jt<=0){
      if(f.jumps>0&&!f.helpless){inp.jumpP=1;a.jt=16;}
      else if(!f.upUsed&&f.y>-20){inp.u=1;inp.sP=1;a.jt=30;}
    }
    return inp;
  }
  if(!tgt){return inp;}
  const dx=tgt.x-f.x,dy=tgt.y-f.y,adx=Math.abs(dx);
  const dirT=dx>0?1:-1;
  // 道中の下り崖チェック
  const nearEdge=f.ground&&f.plat&&((f.x<f.plat.x0+34&&dirT<0)||(f.x>f.plat.x1-34&&dirT>0));
  // 防御
  if(a.sh>0){inp.sh=1;return inp;}
  if(tgt.state==='attack'&&adx<150&&Math.abs(dy)<110&&rnd()<.03*lvl*(f.ground?1:0)){a.sh=14+rnd()*14|0;inp.sh=1;return inp;}
  // 持ち物
  if(f.held&&adx<460&&a.t<=0){if(f.face===dirT){inp.aP=1;a.t=20;return inp;}}
  // 地上でターゲットが下の足場なら下り
  if(f.ground&&f.plat&&f.plat.soft&&dy>80&&adx<260&&rnd()<.04){inp.dP=1;inp.d=1;}
  // ガード中の相手はつかむ
  if(tgt.state==='shield'&&adx<95&&Math.abs(dy)<60&&f.ground&&a.t<=0&&rnd()<.5*lvl){a.gr=10;inp.faceTo=dirT;inp.sh=1;return inp;}
  // 攻撃
  const reachX=f.ch<4?(f.ch===0?100:84):Math.max(64,(c.mod.side.bw||74)+22);
  if(adx<reachX&&Math.abs(dy)<100&&a.t<=0){
    inp.l=dirT<0?1:0;inp.r=dirT>0?1:0;
    const r=rnd();
    if(!c.sp.proj&&r<.35)inp.sP=1;
    else if(dy<-70)inp.u=1,inp.aP=1;
    else if(dy>30&&!f.ground){inp.d=1;inp.aP=1;}
    else if(r<.5){inp.l=0;inp.r=0;inp.aP=1;inp.faceTo=dirT;}
    else {inp.aP=1;inp.l=dirT<0?1:0;inp.r=dirT>0?1:0;}
    if(!inp.aP&&!inp.sP)inp.aP=1;
    if(f.ground&&inp.aP&&(inp.u||inp.l||inp.r)&&rnd()<.28*lvl)a.hold=18+Math.floor(rnd()*22);
    a.t=Math.floor(10+(1-lvl)*34+rnd()*14);
    return inp;
  }
  // 飛び道具
  if(c.sp.proj&&adx>170&&adx<620&&Math.abs(dy)<130&&f.face===dirT&&a.t<=0&&rnd()<.05+.04*lvl){inp.sP=1;a.t=Math.floor(24+(1-lvl)*30);return inp;}
  // 上のターゲットへジャンプ
  if(dy<-110&&adx<240&&a.jt<=0){
    if(f.ground){inp.jumpP=1;a.jt=22;}
    else if(f.jumps>0&&f.vy>-100&&rnd()<.25){inp.jumpP=1;a.jt=22;}
    if(f.ground)inp.l=dirT<0?1:0,inp.r=dirT>0?1:0;
    return inp;
  }
  // 接近
  if(!nearEdge||Math.abs(dy)<60&&!f.ground){
    if(adx>34){inp.l=dirT<0?1:0;inp.r=dirT>0?1:0;}
    if(rnd()<.01*lvl&&f.ground&&a.jt<=0){inp.jumpP=1;a.jt=40;}
    if(!f.ground&&adx<260&&Math.abs(dy)<110&&a.t<=0&&rnd()<.08*lvl){inp.aP=1;a.t=20;if(dy>20)inp.d=1;}
  }
  // 足場の上の低い位置に居るなら上へ
  if(f.ground&&f.plat===ST.main&&dy<-200&&a.jt<=0&&adx<300){inp.jumpP=1;a.jt=30;}
  return inp;
}

/* ---------------- シーン管理 ---------------- */
function newMatch(cfg,mode){
  fighters.length=0;projs.length=0;items.length=0;parts.length=0;rings.length=0;
  loadStage(cfg.stage||0);G.pclock=0;G.noKoT=0;G.sudden=false;G.bombT=0;
  const n=4;const chs=[];
  for(let i=0;i<n;i++){
    const hs=cfg.humans.findIndex(h=>h.slot===i);
    let ch;
    if(hs>=0)ch=cfg.humans[hs].ch;
    else{do{ch=Math.floor(rnd()*CH.length);}while(chs.includes(ch)&&chs.length<CH.length&&rnd()<.9);}
    chs.push(ch);
    const f=newFighter(i,ch,hs>=0?cfg.humans[hs].hslot:-1,mode==='demo'?.85:cfg.lvl||.65);
    spawnAt(f,i,n);fighters.push(f);
  }
  G.mode=mode;G.scene='count';G.count=3.2;G.hitstop=0;G.slow=0;G.winner=null;G.itemT=500;G.paused=false;G.cam={x:0,y:-120,s:.8};
  if(mode==='demo')G.count=.01;
  bgmOn=true;
}
function startDemo(){
  G.sel=null;newMatch({humans:[],lvl:.85,stage:Math.floor(rnd()*STAGES.length)},'demo');G.scene='fight';G.count=0;
}
function openSelect(){
  G.scene='select';G.mode='play';G.rosterPage=0;
  G.sel=[{join:true,ch:0,ok:false},{join:false,ch:1,ok:false}];G.selStart=0;
}
function startFromSelect(){
  const humans=[];
  G.sel.forEach((s,i)=>{if(s.join)humans.push({slot:humans.length,hslot:i,ch:s.ch});});
  newMatch({humans,lvl:CPU_LV[G.cpuIdx===undefined?1:G.cpuIdx],stage:G.stagePick||0},'play');sfx.ok();
}

/* ---------------- 入力イベント ---------------- */
addEventListener('keydown',ev=>{if(!ARTREADY)return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','Slash'].includes(ev.code))ev.preventDefault();
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  if(ev.repeat)return;
  if(ev.code==='KeyM'){muted=!muted;return;}
  if(ev.metaKey||ev.ctrlKey||ev.altKey||(ev.code.startsWith('F')&&ev.code.length<=3))return;
  keys[ev.code]=true;
  if(G.scene==='fight'&&G.mode==='demo'||(G.scene==='count'&&G.mode==='demo')){openSelect();sfx.menu();return;}
  if(G.scene==='select'){selectKey(ev.code);return;}
  if(G.scene==='fight'||G.scene==='count'){
    if(ev.code==='KeyP'||ev.code==='Escape'){G.paused=!G.paused;return;}
    if(G.paused&&ev.code==='KeyQ'){startDemo();return;}
  }
  if(G.scene==='result'&&G.resT>1.2&&(ev.code==='Enter'||ev.code==='Space'||ev.code==='KeyJ')){openSelect();sfx.ok();return;}
  if(G.scene==='result'&&ev.code==='Escape'){startDemo();return;}
});
addEventListener('keyup',ev=>{keys[ev.code]=false;});

const CPU_LV=[.35,.62,.9],CPU_NAME=['よわい','ふつう','つよい'];
function selectKey(code){
  if(code==='KeyQ'||code==='KeyE'){G.cpuIdx=((G.cpuIdx===undefined?1:G.cpuIdx)+1)%3;sfx.menu();return;}
  const S=G.sel;const p1=S[0],p2=S[1];
  if(code==='Tab'||code==='PageDown'||code==='PageUp'){const pages=Math.ceil(CH.length/12);G.rosterPage=((G.rosterPage||0)+(code==='PageUp'?-1:1)+pages)%pages;sfx.menu();return;}
  const mv=(p,d)=>{if(p.ok)return;p.ch=(p.ch+d+CH.length)%CH.length;G.rosterPage=Math.floor(p.ch/12);sfx.menu();};
  if(code==='KeyW'||code==='ArrowUp'){G.stagePick=((G.stagePick||0)+STAGES.length-1)%STAGES.length;sfx.menu();return;}
  if(code==='KeyS'||code==='ArrowDown'){G.stagePick=((G.stagePick||0)+1)%STAGES.length;sfx.menu();return;}
  if(code==='KeyA')mv(p1,-1);else if(code==='KeyD')mv(p1,1);
  else if(code==='KeyJ'||code==='Enter'||code==='Space'){if(!p1.ok){p1.ok=true;sfx.ok();}checkSelStart();}
  else if(code==='KeyK'){if(p1.ok)p1.ok=false;else{startDemo();}}
  else if(code==='Escape'){startDemo();}
  if(code==='ArrowLeft'||code==='ArrowRight'){
    if(!p2.join){p2.join=true;p2.ok=false;sfx.ok();}else mv(p2,code==='ArrowLeft'?-1:1);
  }else if(code==='Comma'){if(p2.join){if(!p2.ok){p2.ok=true;sfx.ok();}checkSelStart();}}
  else if(code==='Period'){if(p2.join){if(p2.ok)p2.ok=false;else{p2.join=false;}}}
}
function checkSelStart(){
  const S=G.sel;if(S.every(s=>!s.join||s.ok))G.selStart=.9;
}

/* ---------------- カメラ ---------------- */
function updateCamera(){
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,n=0;
  for(const f of fighters){if(f.dead||f.out)continue;
    const fx=clamp(f.x,-1000,1000),fy=clamp(f.y,-800,600);minx=Math.min(minx,fx);maxx=Math.max(maxx,fx);miny=Math.min(miny,fy-90);maxy=Math.max(maxy,fy);n++;}
  if(!n){minx=-300;maxx=300;miny=-300;maxy=100;}
  minx=Math.min(minx,-380);maxx=Math.max(maxx,380);maxy=Math.max(maxy,110);miny=Math.min(miny,-430);
  const w=maxx-minx+320,h=maxy-miny+250;
  const ts=clamp(Math.min(VW/w,VH/h),.42,1.1),cx=(minx+maxx)/2,cy=(miny+maxy)/2+10;
  const k=.07;G.cam.s+=(ts-G.cam.s)*k;G.cam.x+=(cx-G.cam.x)*k;G.cam.y+=(cy-G.cam.y)*k;
}

/* ---------------- メイン更新 ---------------- */
function update(){
  G.t+=DT;G.tick++;G.shake*=.88;G.flashW=Math.max(0,G.flashW-DT);
  pollPadMenus();
  // 演出の進行
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=DT;if(p.life<=0){parts.splice(i,1);continue;}p.x+=p.vx*DT;p.y+=p.vy*DT;p.vy+=p.g*DT;p.vx*=.95;p.vy*=.98;}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=DT;if(r.life<=0)rings.splice(i,1);else r.r=lerp(r.r,r.r1,.2);}
  if(G.scene==='select'){
    if(G.selStart>0){G.selStart-=DT;if(G.selStart<=0)startFromSelect();}
    G.cam.s=.8;return;
  }
  if(G.paused)return;
  if(G.scene==='count'){
    const prev=Math.ceil(G.count);G.count-=DT;const n=Math.ceil(G.count);
    if(n!==prev&&n>=1&&n<=3)sfx.beep();
    if(G.count<=0){G.scene='fight';sfx.go();}
    updateCamera();return;
  }
  if(G.scene==='result'){
    G.resT+=DT;updateCamera();
    if(G.mode==='demo'&&G.resT>4)startDemo();
    // 勝者は軽く動く
    return;
  }
  // スローモーション
  if(G.slow>0){G.slowT--;if(G.slowT<=0)G.slow=0;if(G.tick%3!==0)return;}
  if(G.hitstop>0){G.hitstop--;updateCamera();return;}
  G.pclock+=DT;movePlats();
  if(G.scene==='fight'){
    G.noKoT+=DT;
    if(G.noKoT>40&&!G.sudden){G.sudden=true;G.bombT=60;for(const f of fighters)if(!f.out)f.pct=Math.max(f.pct,220);sfx.go();G.flashW=.2;}
    if(G.sudden){G.bombT--;if(G.bombT<=0){spawnItem();items[items.length-1].t='bomb';G.bombT=200;}}
  }
  for(const f of fighters){
    let inp;
    if(f.dead||f.out)inp={l:0,r:0,u:0,d:0,jumpP:0,aP:0,sP:0,dP:0,sh:0,shP:0};
    else inp=f.human?humanInput(f):aiInput(f);
    updateFighter(f,inp);
  }
  // 押し合い
  for(let i=0;i<fighters.length;i++){const a=fighters[i];if(a.dead||a.out||a.state==='ledge'||a.state==='respawn')continue;
    for(let j=i+1;j<fighters.length;j++){const b=fighters[j];if(b.dead||b.out||b.state==='ledge'||b.state==='respawn')continue;
      if(Math.abs(a.y-b.y)<60&&Math.abs(a.x-b.x)<34&&a.state!=='dodge'&&b.state!=='dodge'){const p=(34-Math.abs(a.x-b.x))*.12*(a.x<b.x?-1:1);a.x+=p;b.x-=p;}}}
  updateProjs();updateItems();
  G.itemT--;if(G.itemT<=0){if(items.length<2)spawnItem();G.itemT=700+rnd()*500;}
  updateCamera();
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function poseSheet(name,count){
  const image=ART[name],w=image.width,h=image.height,n=w*h;
  const source=document.createElement('canvas');source.width=w;source.height=h;
  const g=source.getContext('2d');g.drawImage(image,0,0);
  const pixels=g.getImageData(0,0,w,h).data,labels=new Int32Array(n),queue=new Int32Array(n),parts=[null],alphaThreshold=['diego','pippa'].includes(name)?160:16;
  for(let k=0;k<n;k++){
    if(labels[k]||pixels[k*4+3]<alphaThreshold)continue;
    const label=parts.length;let head=0,tail=1,sx=0,sy=0;queue[0]=k;labels[k]=label;
    const add=r=>{if(r>=0&&r<n&&!labels[r]&&pixels[r*4+3]>=alphaThreshold){labels[r]=label;queue[tail++]=r;}};
    while(head<tail){const p=queue[head++],x=p%w,y=Math.floor(p/w);sx+=x;sy+=y;if(x>0)add(p-1);if(x<w-1)add(p+1);if(y>0)add(p-w);if(y<h-1)add(p+w);}
    parts.push({area:tail,x:sx/tail,y:sy/tail,owner:-1});
  }
  const main=parts.slice(1).filter(p=>p.area>10000);
  for(const p of main)p.owner=Math.min(3,Math.floor(p.x/w*4))+Math.min(1,Math.floor(p.y/h*2))*4;
  for(const p of parts.slice(1))if(p.area>=8&&p.owner<0){let best=null,dist=Infinity;for(const m of main){const d=(p.x-m.x)**2+(p.y-m.y)**2;if(d<dist){dist=d;best=m;}}p.owner=best?best.owner:-1;}
  const owners=new Int16Array(n);owners.fill(-1);
  for(let p=0;p<n;p++)if(labels[p])owners[p]=parts[labels[p]].owner;
  // Retain antialiased edges and the original alpha within two pixels of each component.
  for(let pass=0;pass<2;pass++){const next=owners.slice();for(let p=0;p<n;p++)if(owners[p]<0&&pixels[p*4+3]>0){const x=p%w;const near=[x>0?p-1:-1,x<w-1?p+1:-1,p>=w?p-w:-1,p<n-w?p+w:-1];for(const q of near)if(q>=0&&owners[q]>=0){next[p]=owners[q];break;}}owners.set(next);}
  const bounds=Array.from({length:count},()=>({x0:w,y0:h,x1:-1,y1:-1}));
  for(let p=0;p<n;p++){const i=owners[p];if(i<0||i>=count)continue;const x=p%w,y=Math.floor(p/w),b=bounds[i];b.x0=Math.min(b.x0,x);b.x1=Math.max(b.x1,x);b.y0=Math.min(b.y0,y);b.y1=Math.max(b.y1,y);}
  return bounds.map((b,i)=>{if(b.x1<0)throw new Error('Empty pose: '+name+'/'+i);const out=document.createElement('canvas');out.width=b.x1-b.x0+1;out.height=b.y1-b.y0+1;const cg=out.getContext('2d'),data=cg.createImageData(out.width,out.height);for(let y=0;y<out.height;y++)for(let x=0;x<out.width;x++){const p=(y+b.y0)*w+x+b.x0;if(owners[p]===i){const j=(y*out.width+x)*4;data.data.set(pixels.subarray(p*4,p*4+4),j);}}cg.putImageData(data,0,0);return out;});
}

function cutArt(name,i,cols,rows,trim=false){
  const im=ART[name],cw=im.width/cols,ch=im.height/rows,c=document.createElement('canvas');c.width=Math.ceil(cw);c.height=Math.ceil(ch);const g=c.getContext('2d');g.drawImage(im,(i%cols)*cw,Math.floor(i/cols)*ch,cw,ch,0,0,c.width,c.height);
  if(!trim)return c;const d=g.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>24){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
  if(x1<0)throw Error('Empty art '+name+'/'+i);const out=document.createElement('canvas');out.width=x1-x0+1;out.height=y1-y0+1;out.getContext('2d').drawImage(c,x0,y0,out.width,out.height,0,0,out.width,out.height);return out;
}
const PROP=[],FXART=[],GUESTFX=[];

function limb(x0,y0,ang,len,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+Math.sin(ang)*len,y0+Math.cos(ang)*len);ctx.stroke();return [x0+Math.sin(ang)*len,y0+Math.cos(ang)*len];}
function getPose(f){
  const p={legF:0,legB:0,armF:.2,armB:-.2,lean:0,air:!f.ground,atk:null,prog:0,bob:0};
  const sp=Math.abs(f.vx);
  if(f.state==='attack'&&f.atk){
    const a=f.atk,pr=a.fr/a.mv.dur;p.atk=a.name;p.prog=pr;
    const sw=(s,e)=>lerp(s,e,Math.min(1,pr*1.6));
    if(a.name==='jab'){p.armF=sw(1.2,1.75);p.armB=-.3;}
    else if(a.name==='side'){p.armF=sw(-.4,1.9);p.armB=-.8;p.lean=.15;}
    else if(a.name==='up'){p.armF=sw(1.4,3.1);p.armB=2.6;}
    else if(a.name==='down'){p.armF=sw(1.2,.2);p.armB=.5;p.lean=.2;}
    else if(a.name==='upB'){p.armF=3.1;p.armB=3.1;}
    else if(a.name==='nair'){p.armF=sw(.4,2.6);p.armB=sw(-.4,-2.6);p.legF=.9;p.legB=-.9;}
    else if(a.name==='fair'){p.armF=sw(-.2,1.9);p.armB=-.6;}
    else if(a.name==='bair'){p.armF=-1.9;p.armB=sw(1.4,-1.8);p.lean=-.12;}
    else {p.armF=sw(-.6,1.7);p.armB=sw(-.6,1.4);}
    if(!a.air){p.legF=.3;p.legB=-.3;}
  }else if(f.state==='grab'){p.armF=1.55;p.armB=1.35;p.lean=.1;}
  else if(f.state==='grabbed'||f.state==='stun'){p.armF=2.4;p.armB=-2.4;p.legF=.8;p.legB=-.8;}
  else if(f.state==='shield'){p.armF=1.1;p.armB=1.1;}
  else if(f.state==='ledge'){p.armF=3.0;p.armB=3.0;p.legF=.2;p.legB=-.1;}
  else if(!f.ground){p.legF=.7;p.legB=-.5;p.armF=1.6;p.armB=-1.3;}
  else if(sp>40){const ph=f.anim*.28*(sp/300+.5);p.legF=Math.sin(ph)*.9;p.legB=-Math.sin(ph)*.9;p.armF=-Math.sin(ph)*.9;p.armB=Math.sin(ph)*.9;p.lean=.1;p.bob=Math.abs(Math.sin(ph))*3;}
  else{p.bob=Math.sin(f.anim*.07)*1.2;}
  return p;
}

  else if(p.air||f.state==='ledge'||f.state==='stun'||f.state==='grabbed')index=3;
  else if(Math.abs(f.vx||0)>40&&f.ground)index=1+Math.floor((f.anim||0)/6)%2;
  const im=frames[index],h=CH[ch].height||110,k=Math.min(h/im.height,150/im.width),w=im.width*k,dh=im.height*k;

}

    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(f.x-22,f.y+10,44,6);ctx.fillStyle=k>.95?'#ff5a3a':'#ffe27a';ctx.fillRect(f.x-21,f.y+11,42*k,4);}
  if(f.state==='attack'&&f.atk){const a=f.atk,mv=a.mv;if(mv.h0!==undefined&&a.fr>=mv.h0&&a.fr<=mv.h1+2){const b=boxOf(f,mv),pr=(a.fr-mv.h0)/Math.max(1,mv.h1-mv.h0+2);ctx.globalAlpha=.6*(1-pr);ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.scale(f.face,1);ctx.drawImage(FXART[9],-b.w/2,-b.h/2,b.w,b.h);ctx.restore();ctx.globalAlpha=1;}}
  // 持ち物

  otext((f.human?PNAME[f.slot]:'CPU'),f.x,my-16,14,f.col,'center','rgba(0,0,0,.8)',4);
}

function drawProj(p){
  const index={ofuda:0,nut:1,beam:2,wire:3,blade:4,flame:5}[p.type]??2;
  const guestIndex={spirit:0,bullet:1,moonblade:2,lightning:3,chain:4,wind:5}[p.type],image=guestIndex===undefined?FXART[index]:GUESTFX[guestIndex];
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.type==='nut'?G.t*10:Math.atan2(p.vy,p.vx));ctx.drawImage(image,-p.r*1.8,-p.r*1.8,p.r*3.6,p.r*3.6);ctx.restore();
}
function drawEffects(){
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);const d=p.r*2.8*(.4+.6*p.life/p.max);ctx.drawImage(FXART[p.r>6?7:p.col.startsWith('rgba')?10:6],p.x-d/2,p.y-d/2,d,d);}
  for(const r of rings){ctx.globalAlpha=clamp(r.life/r.max,0,1);ctx.drawImage(FXART[11],r.x-r.r,r.y-r.r,r.r*2,r.r*2);}ctx.globalAlpha=1;
}
function pctColor(p){return p<40?'#ffffff':p<80?'#ffe27a':p<130?'#ff9a3a':p<180?'#ff4a3a':'#c01030';}
function drawHUD(){
  const n=fighters.length,pw=250,gap=24,tw=n*pw+(n-1)*gap,x0=(VW-tw)/2;
  fighters.forEach((f,i)=>{
    const x=x0+i*(pw+gap),y=VH-118;
    artPanel(x,y,pw,96);ctx.strokeStyle=f.col;ctx.lineWidth=3;rr(x,y,pw,96,16);ctx.stroke();
    ctx.fillStyle=f.col;rr(x,y,52,24,10);ctx.fill();otext(f.human?PNAME[f.slot]:'CPU',x+26,y+13,15,'#fff','center','rgba(0,0,0,.5)',3);
    otext(CH[f.ch].name,x+pw-14,y+14,17,'#e8e8f0','right','rgba(0,0,0,.8)',4);
    // 顔アイコン
    const portrait=POSEART[f.ch][0],faceW=portrait.width*.65,faceH=portrait.height*.36;ctx.save();ctx.beginPath();ctx.arc(x+34,y+62,24,0,TAU);ctx.clip();ctx.drawImage(portrait,(portrait.width-faceW)/2,0,faceW,faceH,x+8,y+36,52,52);ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+34,y+62,24,0,TAU);ctx.stroke();
    if(f.out){otext('K.O.',x+pw/2+30,y+56,34,'#888','center');}
    else{
      const pc=Math.floor(f.pct),bump=f.flash>0?1+f.flash*.03:1;
      ctx.save();ctx.translate(x+150,y+56);ctx.scale(bump,bump);otext(pc+'%',0,0,46,pctColor(f.pct),'center','rgba(10,14,30,1)',7);ctx.restore();
      for(let s=0;s<3;s++){ctx.fillStyle=s<f.stocks?f.col:'rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(x+100+s*26,y+86,8,0,TAU);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=2;ctx.stroke();}
    }
  });
  // 画面外の矢印
  const s=G.cam.s;
  for(const f of fighters){if(f.dead||f.out)continue;
    const sx=VW/2+(f.x-G.cam.x)*s,sy=VH/2+30+(f.y-G.cam.y)*s;
    if(sx<20||sx>VW-20||sy<20||sy>VH-20){
      const ax=clamp(sx,36,VW-36),ay=clamp(sy,36,VH-150),ang=Math.atan2(sy-ay,sx-ax);
      ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);ctx.fillStyle=f.col;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-12,-16);ctx.lineTo(-12,16);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    }
  }
}
function drawWorld(){
  ctx.save();
  const sh=G.shake>.4?G.shake:0;
  ctx.translate(VW/2+(rnd()-.5)*sh,VH/2+30+(rnd()-.5)*sh);ctx.scale(G.cam.s,G.cam.s);ctx.translate(-G.cam.x,-G.cam.y);
  drawStage();
  for(const it of items)if(it.state!=='held')drawItem(it,it.x,it.y,false);
  for(const f of fighters)drawFighter(f);
  for(const p of projs)drawProj(p);
  drawEffects();
  ctx.restore();
}
function drawSelect(){
  ctx.fillStyle='rgba(8,10,28,.86)';ctx.fillRect(0,0,VW,VH);
  otext('キャラクターを えらべ! / SELECT FIGHTER',VW/2,48,34,'#ffe27a');
  const pages=Math.ceil(CH.length/12),page=clamp(G.rosterPage||0,0,pages-1),first=page*12;
  otext('全'+CH.length+'人  /  PAGE '+(page+1)+' / '+pages+'  — Tab・PageUp・PageDownでページ切替',VW/2,78,14,'#bfcbe9');
  const cols=6,cw=190,gap=14,x0=(VW-cols*cw-(cols-1)*gap)/2;
  for(let i=first;i<Math.min(CH.length,first+12);i++){
    const local=i-first,x=x0+(local%cols)*(cw+gap),y=94+Math.floor(local/cols)*168,c=CH[i];artPanel(x,y,cw,152);
    ctx.save();ctx.translate(x+cw/2,y+106);ctx.scale(.8,.8);drawChar(i,{anim:G.tick,state:'free',ground:true,vx:0},{bob:Math.sin(G.t*3+i),lean:0,air:false});ctx.restore();
    otext(c.name,x+cw/2,y+125,c.name.length>10?13:16,'#fff','center','rgba(0,0,0,.8)',3);
    otext(c.kana,x+cw/2,y+142,9,'#bcc7e9','center','rgba(0,0,0,.8)',2);
    G.sel.forEach((p,pi)=>{if(!p.join||p.ch!==i)return;ctx.strokeStyle=PCOL[pi];ctx.lineWidth=4;rr(x+pi*4,y+pi*4,cw-pi*8,152-pi*8,12);ctx.stroke();ctx.fillStyle=PCOL[pi];rr(x+(pi?cw-62:8),y+8,54,23,8);ctx.fill();otext(PNAME[pi]+(p.ok?' OK':''),x+(pi?cw-35:35),y+20,12,'#fff','center','rgba(0,0,0,.7)',3);});
  }
  G.sel.forEach((p,pi)=>{
    const x=35+pi*612,y=442;artPanel(x,y,598,116);if(!p.join){otext('2P: ← / → で参加',x+299,y+54,24,'#aab7da');return;}
    const c=CH[p.ch];otext(PNAME[pi]+' '+c.name,x+16,y+22,20,PCOL[pi],'left','rgba(0,0,0,.8)',3);
    otext('必殺: '+c.specialName+'  /  '+c.source,x+16,y+48,13,'#ffe27a','left','rgba(0,0,0,.8)',2);
    const lines=wrap(c.desc,566);lines.slice(0,2).forEach((line,i)=>otext(line,x+16,y+70+i*16,13,'#cdd5ef','left','rgba(0,0,0,.8)',2));
    otext(['POWER','SPEED','JUMP','REACH'].map((label,i)=>label+' '+c.stats[i]+'/5').join('   '),x+16,y+103,11,'#bcc9e9','left','rgba(0,0,0,.8)',2);
  });
  const sg=STAGES[G.stagePick||0];otext('W / S  ステージ: '+sg.name+' / '+sg.en,VW/2,586,22,'#ffe27a');
  otext('Q / E  CPU難易度: '+CPU_NAME[G.cpuIdx===undefined?1:G.cpuIdx],VW/2,615,17,'#aee2f0');
  otext('1P: A/D 選択・J/Enter 決定・K 戻る   2P: ←/→ 参加・選択・, 決定・. 戻る',VW/2,646,17,'#dfe3ff');
  otext('全員の決定でスタート / 残る枠はCPU / ゲームパッド対応',VW/2,681,15,'#b5c1e5');
  if(G.selStart>0)otext('スタート!',VW-120,48,28,'#ffe27a');
}

function wrap(t,w){ctx.font='bold 13px '+FONT;const out=[];let line='';for(const ch of t){if(ctx.measureText(line+ch).width>w){out.push(line);line=ch;}else line+=ch;}out.push(line);return out;}
function drawTitle(){
  ctx.fillStyle='rgba(8,10,30,.4)';ctx.fillRect(0,0,VW,VH);
  ctx.drawImage(ART.logo,VW/2-480,66,960,200);
  if(Math.floor(G.t*1.6)%2===0)otext('なにかキーを おして スタート!',VW/2,VH-232,38,'#ffe27a');
  artPanel(VW/2-420,VH-196,840,110);
  otext('ダメージ%が たまるほど 遠くへ ふっとぶ! 場外に出したら KO。さいごまで 生き残れ!',VW/2,VH-170,20,'#fff');
  otext('1P: A/D いどう・W/Space ジャンプ・S した・J こうげき・K ひっさつ・L ガード    2P: ←→↑↓ と , . /',VW/2,VH-138,16,'#cfd5ee');
  otext('J長押しで「ため」/ ガード+J で「つかみ・投げ」/ ガード+←→ でかいひ / 2段ジャンプ・ふち つかまり / アイテム / M おと / P ポーズ',VW/2,VH-110,15,'#aab2d4');
  otext('ただいま CPU どうしの デモ対戦中',VW/2,VH-62,16,'rgba(255,255,255,.55)');
}
function drawCount(){
  const n=Math.ceil(G.count),f=G.count-Math.floor(G.count);
  otext(n>0?String(n):'',VW/2,VH/2-40,160*(1+f*.3),'#ffe27a','center','#1a1240',14);
  artPanel(VW/2-390,VH/2+90,780,86);
  otext('J: こうげき(←→↑↓ で技がかわる・長押しで「ため」!)   K: ひっさつ(↑+K でふっき)',VW/2,VH/2+120,19,'#fff');
  otext('L: ガード  ガード中に J で「つかみ」→ 方向で投げ   空中 J / ←+J / →+J でもちがう技!',VW/2,VH/2+152,19,'#ffe27a');
}
function drawResult(){
  ctx.fillStyle='rgba(8,10,30,'+Math.min(.7,G.resT*.6)+')';ctx.fillRect(0,0,VW,VH);
  if(G.resT<.6)return;
  const w=G.winner;
  if(w){otext(CH[w.ch].name+' の勝利!',VW/2,150,fittedTextSize(CH[w.ch].name+' の勝利!',1100,86),w.col,'center','#1a1240',10);otext((w.human?PNAME[w.slot]:'CPU')+'  KO '+w.kills+' / 与ダメ '+Math.floor(w.dmgDealt)+'%',VW/2,226,28,'#fff');
    for(const sx of[-1,1]){ctx.save();ctx.translate(VW/2+sx*455,430+Math.sin(G.t*4+sx)*6);ctx.scale(sx*2.2,2.2);drawChar(w.ch,{anim:G.tick},{legF:.1,legB:-.1,armF:3.1,armB:3.1+(sx>0?0:0),lean:0,bob:Math.abs(Math.sin(G.t*5))*6});ctx.restore();}
    ctx.globalAlpha=.5;for(let i=0;i<10;i++){const a=i/10*TAU+G.t;ctx.fillStyle=w.col;ctx.beginPath();ctx.arc(VW/2+Math.cos(a)*(520+Math.sin(G.t*3+i)*20),380+Math.sin(a)*190,5,0,TAU);ctx.fill();}ctx.globalAlpha=1;}
  else otext('引き分け',VW/2,150,86,'#fff');
  const rows=fighters.slice().sort((a,b)=>b.stocks-a.stocks||b.kills-a.kills);
  rows.forEach((f,i)=>{const y=290+i*58;artPanel(VW/2-300,y,600,48);ctx.fillStyle=f.col;rr(VW/2-300,y,10,48,5);ctx.fill();
    otext((i+1)+'位',VW/2-262,y+25,22,'#ffe27a','left','rgba(0,0,0,.7)',4);otext(CH[f.ch].name,VW/2-196,y+25,fittedTextSize(CH[f.ch].name,200,24),'#fff','left');otext((f.human?PNAME[f.slot]:'CPU'),VW/2+30,y+25,18,f.col,'left','rgba(0,0,0,.7)',4);
    otext('KO '+f.kills+'   やられ '+f.falls,VW/2+280,y+25,20,'#cfd5ee','right');});
  if(G.mode==='play'&&G.resT>1.2&&Math.floor(G.t*2)%2===0)otext('Enter / J : キャラせんたくへ     Esc : タイトルへ',VW/2,VH-60,26,'#ffe27a');
}
function draw(){
  drawBackground();
  if(G.scene!=='select'||true)drawWorld();
  if(G.flashW>0){ctx.fillStyle='rgba(255,255,255,'+G.flashW*1.6+')';ctx.fillRect(0,0,VW,VH);}
  if((G.scene==='fight'&&G.mode!=='demo')||G.scene==='count'||G.scene==='result')drawHUD();
  if(G.scene==='count')drawCount();
  if(G.sudden&&G.scene==='fight')otext('サドンデス!',VW/2,70+Math.sin(G.t*8)*3,54,'#ff5a3a','center','#1a1240',10);
  if(G.scene==='fight'&&G.mode==='demo')drawTitle();
  if(G.scene==='result')drawResult();
  if(G.scene==='select')drawSelect();
  if(G.slow>0){ctx.fillStyle='rgba(120,140,255,.08)';ctx.fillRect(0,0,VW,VH);}
  if(G.paused){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,VW,VH);otext('ポーズ中',VW/2,VH/2-90,70,'#fff');otext('P / Esc で再開   Q でタイトルへ',VW/2,VH/2-30,24,'#cfd5ee');
    otext('1P  A/D いどう  W/Space ジャンプ  S した  J こうげき(長押し=ため)  K ひっさつ  L ガード(+Jでつかみ)',VW/2,VH/2+40,19,'#fff');
    otext('2P  ←/→ いどう  ↑ ジャンプ  ↓ した  , こうげき  . ひっさつ  / ガード',VW/2,VH/2+72,19,'#fff');
    otext('ゲームパッド: スティック/十字 いどう  A ジャンプ  X こうげき  B ひっさつ  LB/RB ガード  Start ポーズ',VW/2,VH/2+104,17,'#cfd5ee');}
}

/* ---------------- ループ ---------------- */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(.1,(now-last)/1000);last=now;
  while(acc>=DT){update();acc-=DT;}
  draw();requestAnimationFrame(frame);
}
loadArtwork().then(()=>{ARTREADY=true;startDemo();requestAnimationFrame(frame);}).catch(error=>{console.error(error);ctx.clearRect(0,0,VW,VH);otext('画像を読み込めませんでした。再読み込みしてください。',VW/2,VH/2,26,'#fff');});
window.__g={G,fighters,projs,items,keys,ST,CH,startDemo,openSelect,newMatch,step(n){for(let i=0;i<n;i++)update();draw();},selectKey,koFighter,applyHit};
})();
</script>
