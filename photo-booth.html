<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!--
    CSP: 完全クライアントサイド。外部ライブラリ・外部通信は一切なし。
    映像は getUserMedia でカメラから取得し、Canvas 内で処理・保存するのみ（外部送信なし）。
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="カメラ映像にリアルタイムでフィルターをかけて撮影できるフォトブース。グレースケール・セピア・エッジ・ハーフトーン・ドット絵・ASCIIなど。完全ブラウザ内処理・映像は外部送信なし。Real-time camera filter photo booth, all on-device.">
  <title>フォトブース | Photo Booth</title>
  <link rel="canonical" href="https://hifukasawa77-lgtm.github.io/main/photo-booth.html">
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <!-- OGP / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="フォトブース | Photo Booth">
  <meta property="og:description" content="カメラ映像にリアルタイムでフィルターをかけて撮影。完全ブラウザ内処理・映像は外部送信なし。">
  <meta property="og:url" content="https://hifukasawa77-lgtm.github.io/main/photo-booth.html">
  <meta property="og:image" content="https://hifukasawa77-lgtm.github.io/main/assets/logo/favicon.svg">
  <meta name="twitter:card" content="summary">
  <style>
    :root{
      --bg:#05070d; --panel:#0b1020; --text:#e6edf6; --muted:#8b97a8;
      --cyan:#22d3ee; --purple:#a78bfa;
      --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.09);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--text); min-height:100vh;
      font-family:"Aptos","Segoe UI Variable","Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;
      line-height:1.6; -webkit-font-smoothing:antialiased;
    }
    a{color:var(--cyan)}
    #bg-canvas{position:fixed; inset:0; z-index:-1; pointer-events:none}
    .wrap{max-width:820px; margin:0 auto; padding:28px 18px 72px}

    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
    .home{color:var(--muted); text-decoration:none; font-size:.85rem; display:inline-flex; align-items:center; gap:6px}
    .home:hover{color:var(--cyan)}

    .hero{text-align:center; margin-bottom:22px}
    .hero h1{font-size:clamp(1.7rem,5vw,2.5rem); margin:.2em 0 .1em; letter-spacing:.01em}
    .hero .sub{color:var(--muted); font-weight:600; margin:0; font-size:.9rem}
    .hero .note{color:var(--muted); font-size:.82rem; margin:.7em 0 0}
    .grad{background:linear-gradient(135deg,var(--cyan) 0%,var(--purple) 100%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      box-shadow:0 8px 30px rgba(0,0,0,0.35); padding:20px; margin:18px 0;
    }

    .stage{position:relative; width:100%; max-width:560px; margin:0 auto; aspect-ratio:3/4;
      border-radius:16px; overflow:hidden; background:#000; display:flex; align-items:center; justify-content:center}
    #canvas{width:100%; height:100%; object-fit:cover; display:block}
    .stage .placeholder{position:absolute; color:var(--muted); text-align:center; padding:20px; font-size:.9rem}
    .stage .placeholder .big{font-size:2.6rem; display:block; margin-bottom:8px}
    #video{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}

    .btn{
      appearance:none; border:0; cursor:pointer; font:inherit; font-weight:600;
      border-radius:12px; padding:11px 18px; color:#04121a;
      background:linear-gradient(135deg,var(--cyan) 0%,#38bdf8 100%);
      box-shadow:0 4px 16px rgba(34,211,238,0.22); transition:transform .15s,box-shadow .15s,opacity .15s;
    }
    .btn:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(34,211,238,0.3)}
    .btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none}
    .btn.purple{background:linear-gradient(135deg,var(--purple) 0%,#8b5cf6 100%); color:#fff; box-shadow:0 4px 16px rgba(167,139,250,0.22)}
    .btn.ghost{background:transparent; color:var(--cyan); border:1px solid var(--border); box-shadow:none}
    .btn.ghost:hover{background:rgba(34,211,238,0.08)}
    .btn-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; margin-top:16px}

    .filters{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px}
    .chip{
      appearance:none; cursor:pointer; font:inherit; font-size:.82rem; font-weight:600;
      border:1px solid var(--border); border-radius:999px; padding:7px 14px; color:var(--text);
      background:rgba(255,255,255,0.03); transition:all .15s;
    }
    .chip:hover{border-color:var(--cyan); color:var(--cyan)}
    .chip[aria-pressed="true"]{background:linear-gradient(135deg,rgba(34,211,238,0.18),rgba(167,139,250,0.18));
      border-color:var(--cyan); color:#fff}
    .chip .en{color:var(--muted); font-weight:500; font-size:.72rem; margin-left:4px}
    .chip[aria-pressed="true"] .en{color:rgba(255,255,255,0.7)}

    .toggles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px}

    #status{color:var(--muted); font-size:.84rem; min-height:1.3em; text-align:center; margin-top:12px}
    .shot-wrap{text-align:center; margin-top:16px; display:none}
    .shot-wrap.show{display:block}
    #shot{max-width:100%; max-height:300px; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,0.4)}
    .shot-wrap .save-row{margin-top:12px}

    .toast{
      position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
      background:rgba(11,16,32,0.95); color:var(--text); border:1px solid var(--border);
      padding:11px 18px; border-radius:12px; font-size:.86rem; opacity:0; pointer-events:none;
      transition:opacity .25s,transform .25s; z-index:50; max-width:90vw; text-align:center;
    }
    .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

    @media (prefers-reduced-motion: reduce){
      *{transition:none !important}
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <main class="wrap">
    <div class="topbar">
      <a class="home" href="index.html">← ホーム / Home</a>
    </div>

    <header class="hero">
      <h1>📷 <span class="grad">フォトブース</span></h1>
      <p class="sub">Photo Booth — リアルタイム映像フィルター</p>
      <p class="note">カメラ映像にフィルターをかけて撮影。完全ブラウザ内処理・映像は外部送信なし。<br>
        Apply live filters and snap a photo — everything runs on your device.</p>
    </header>

    <section class="card">
      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas" width="480" height="640"></canvas>
        <div class="placeholder" id="placeholder">
          <span class="big">📷</span>
          カメラを起動して撮影しよう<br>
          <span style="font-size:.8rem;color:var(--muted)">Start the camera to begin</span>
        </div>
      </div>

      <div class="filters" id="filters" role="group" aria-label="フィルター選択 / Filters"></div>

      <div class="toggles">
        <button class="chip" id="mirror-btn" type="button" aria-pressed="true">🪞 ミラー<span class="en">Mirror</span></button>
        <button class="chip" id="flip-btn" type="button">🔄 カメラ切替<span class="en">Flip cam</span></button>
      </div>

      <div class="btn-row">
        <button class="btn" id="start-btn" type="button">カメラ起動 / Start</button>
        <button class="btn purple" id="shot-btn" type="button" disabled>📸 撮影 / Snap</button>
        <button class="btn ghost" id="stop-btn" type="button" disabled>停止 / Stop</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>

      <div class="shot-wrap" id="shot-wrap">
        <img id="shot" alt="撮影した写真 / Captured photo">
        <div class="save-row btn-row">
          <a class="btn" id="save-btn" download="photo-booth.png">⬇ 保存 / Download</a>
          <button class="btn ghost" id="retake-btn" type="button">撮り直す / Retake</button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="alert"></div>

  <script>
  (function () {
    'use strict';
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var placeholder = document.getElementById('placeholder');
    var startBtn = document.getElementById('start-btn');
    var shotBtn = document.getElementById('shot-btn');
    var stopBtn = document.getElementById('stop-btn');
    var mirrorBtn = document.getElementById('mirror-btn');
    var flipBtn = document.getElementById('flip-btn');
    var filtersEl = document.getElementById('filters');
    var statusEl = document.getElementById('status');
    var shotWrap = document.getElementById('shot-wrap');
    var shotImg = document.getElementById('shot');
    var saveBtn = document.getElementById('save-btn');
    var retakeBtn = document.getElementById('retake-btn');
    var toastEl = document.getElementById('toast');

    var stream = null, rafId = 0, running = false;
    var facing = 'user';       // 'user' | 'environment'
    var mirror = true;
    var current = 'none';

    var MAXW = 640;            // 処理解像度の上限（性能確保）
    var toastTimer = 0;
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
    }
    function setStatus(msg) { statusEl.textContent = msg || ''; }

    /* ---------- フィルター定義 ---------- */
    var FILTERS = [
      { id: 'none',      ja: 'オリジナル', en: 'None' },
      { id: 'grayscale', ja: 'モノクロ',   en: 'Gray' },
      { id: 'sepia',     ja: 'セピア',     en: 'Sepia' },
      { id: 'invert',    ja: '反転',       en: 'Invert' },
      { id: 'edge',      ja: 'エッジ',     en: 'Edge' },
      { id: 'halftone',  ja: 'ハーフトーン', en: 'Halftone' },
      { id: 'pixel',     ja: 'ドット絵',   en: 'Pixel' },
      { id: 'ascii',     ja: 'アスキー',   en: 'ASCII' }
    ];
    FILTERS.forEach(function (f) {
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.dataset.id = f.id;
      b.setAttribute('aria-pressed', f.id === current ? 'true' : 'false');
      b.innerHTML = f.ja + '<span class="en">' + f.en + '</span>';
      b.addEventListener('click', function () {
        current = f.id;
        Array.prototype.forEach.call(filtersEl.children, function (c) {
          c.setAttribute('aria-pressed', c.dataset.id === current ? 'true' : 'false');
        });
      });
      filtersEl.appendChild(b);
    });

    /* ---------- カメラ起動 / 停止 ---------- */
    function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast('このブラウザはカメラ非対応です / Camera not supported'); return;
      }
      setStatus('カメラを起動中… / Starting camera…');
      var constraints = { video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
      navigator.mediaDevices.getUserMedia(constraints)
        .then(function (s) {
          stream = s; video.srcObject = s;
          return video.play();
        })
        .then(function () {
          running = true;
          placeholder.style.display = 'none';
          shotBtn.disabled = false; stopBtn.disabled = false;
          startBtn.disabled = true;
          setStatus('');
          loop();
        })
        .catch(function (err) {
          setStatus('');
          toast('カメラを起動できませんでした（' + ((err && err.name) || 'error') + '）/ Camera unavailable');
        });
    }
    function stopCamera() {
      running = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      video.srcObject = null;
      shotBtn.disabled = true; stopBtn.disabled = true; startBtn.disabled = false;
      placeholder.style.display = '';
    }

    /* ---------- 描画ループ ---------- */
    function loop() {
      if (!running) return;
      if (video.readyState >= 2 && video.videoWidth) {
        var vw = video.videoWidth, vh = video.videoHeight;
        var w = Math.min(vw, MAXW), h = Math.round(w * vh / vw);
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        drawFrame(w, h);
      }
      rafId = requestAnimationFrame(loop);
    }

    function drawBase(w, h) {
      ctx.save();
      if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
      ctx.drawImage(video, 0, 0, w, h);
      ctx.restore();
    }

    function drawFrame(w, h) {
      if (current === 'pixel') return drawPixel(w, h);
      if (current === 'ascii') return drawAscii(w, h);
      if (current === 'halftone') return drawHalftone(w, h);
      drawBase(w, h);
      if (current === 'none') return;
      var img = ctx.getImageData(0, 0, w, h);
      var d = img.data;
      if (current === 'grayscale') {
        for (var i = 0; i < d.length; i += 4) {
          var g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
          d[i] = d[i + 1] = d[i + 2] = g;
        }
      } else if (current === 'invert') {
        for (var j = 0; j < d.length; j += 4) { d[j] = 255 - d[j]; d[j + 1] = 255 - d[j + 1]; d[j + 2] = 255 - d[j + 2]; }
      } else if (current === 'sepia') {
        for (var k = 0; k < d.length; k += 4) {
          var r = d[k], gg = d[k + 1], b = d[k + 2];
          d[k]     = Math.min(255, r * 0.393 + gg * 0.769 + b * 0.189);
          d[k + 1] = Math.min(255, r * 0.349 + gg * 0.686 + b * 0.168);
          d[k + 2] = Math.min(255, r * 0.272 + gg * 0.534 + b * 0.131);
        }
      } else if (current === 'edge') {
        edgeSobel(img, w, h);
      }
      ctx.putImageData(img, 0, 0);
    }

    // Sobel エッジ検出（シアン発光・控えめ）
    function edgeSobel(img, w, h) {
      var s = img.data, out = new Uint8ClampedArray(s.length);
      var lum = new Float32Array(w * h);
      for (var p = 0, q = 0; p < s.length; p += 4, q++) lum[q] = s[p] * 0.299 + s[p + 1] * 0.587 + s[p + 2] * 0.114;
      for (var y = 1; y < h - 1; y++) {
        for (var x = 1; x < w - 1; x++) {
          var o = y * w + x;
          var gx = -lum[o - w - 1] - 2 * lum[o - 1] - lum[o + w - 1] + lum[o - w + 1] + 2 * lum[o + 1] + lum[o + w + 1];
          var gy = -lum[o - w - 1] - 2 * lum[o - w] - lum[o - w + 1] + lum[o + w - 1] + 2 * lum[o + w] + lum[o + w + 1];
          var mag = Math.sqrt(gx * gx + gy * gy);
          var v = mag > 255 ? 255 : mag;
          var i4 = o * 4;
          // 暗背景に控えめなシアン寄りのエッジ（ネオン過多を避ける）
          out[i4] = v * 0.30; out[i4 + 1] = v * 0.92; out[i4 + 2] = v; out[i4 + 3] = 255;
        }
      }
      img.data.set(out);
    }

    function drawHalftone(w, h) {
      // 元フレームをオフスクリーンで取得
      var off = getOffscreen(w, h);
      var octx = off.getContext('2d');
      octx.save();
      if (mirror) { octx.translate(w, 0); octx.scale(-1, 1); }
      octx.drawImage(video, 0, 0, w, h); octx.restore();
      var d = octx.getImageData(0, 0, w, h).data;
      ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, w, h);
      var step = 6;
      ctx.fillStyle = '#e6edf6';
      for (var y = 0; y < h; y += step) {
        for (var x = 0; x < w; x += step) {
          var o = (y * w + x) * 4;
          var lumv = (d[o] * 0.299 + d[o + 1] * 0.587 + d[o + 2] * 0.114) / 255;
          var rad = (1 - lumv) * (step / 2);
          if (rad > 0.4) { ctx.beginPath(); ctx.arc(x + step / 2, y + step / 2, rad, 0, 6.283); ctx.fill(); }
        }
      }
    }

    function drawPixel(w, h) {
      var cols = 72, rows = Math.round(cols * h / w);
      var off = getOffscreen(cols, rows);
      var octx = off.getContext('2d');
      octx.imageSmoothingEnabled = true;
      octx.save();
      if (mirror) { octx.translate(cols, 0); octx.scale(-1, 1); }
      octx.drawImage(video, 0, 0, cols, rows); octx.restore();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, cols, rows, 0, 0, w, h);
    }

    var RAMP = '@%#*+=-:. ';
    function drawAscii(w, h) {
      var cell = 6, cols = Math.floor(w / cell), rows = Math.floor(h / cell);
      var off = getOffscreen(cols, rows);
      var octx = off.getContext('2d');
      octx.save();
      if (mirror) { octx.translate(cols, 0); octx.scale(-1, 1); }
      octx.drawImage(video, 0, 0, cols, rows); octx.restore();
      var d = octx.getImageData(0, 0, cols, rows).data;
      ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, w, h);
      ctx.font = cell + 'px monospace'; ctx.textBaseline = 'top';
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var o = (y * cols + x) * 4;
          var lumv = (d[o] * 0.299 + d[o + 1] * 0.587 + d[o + 2] * 0.114) / 255;
          var ci = Math.min(RAMP.length - 1, Math.floor(lumv * RAMP.length));
          var ch = RAMP.charAt(ci);
          if (ch !== ' ') {
            // 明度でシアン〜パープルにわずかに色付け（控えめ）
            ctx.fillStyle = lumv > 0.5 ? '#22d3ee' : '#a78bfa';
            ctx.fillText(ch, x * cell, y * cell);
          }
        }
      }
    }

    var _off = null;
    function getOffscreen(w, h) {
      if (!_off) _off = document.createElement('canvas');
      if (_off.width !== w || _off.height !== h) { _off.width = w; _off.height = h; }
      return _off;
    }

    /* ---------- 撮影 ---------- */
    function snap() {
      if (!running) return;
      try {
        var url = canvas.toDataURL('image/png');
        shotImg.src = url; saveBtn.href = url;
        shotWrap.classList.add('show');
        shotWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        toast('撮影しました / Snapped!');
      } catch (e) {
        toast('撮影に失敗しました / Capture failed');
      }
    }

    /* ---------- イベント ---------- */
    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    shotBtn.addEventListener('click', snap);
    retakeBtn.addEventListener('click', function () { shotWrap.classList.remove('show'); });
    mirrorBtn.addEventListener('click', function () {
      mirror = !mirror; mirrorBtn.setAttribute('aria-pressed', mirror ? 'true' : 'false');
    });
    flipBtn.addEventListener('click', function () {
      facing = (facing === 'user') ? 'environment' : 'user';
      // 背面カメラは通常ミラー不要
      mirror = (facing === 'user');
      mirrorBtn.setAttribute('aria-pressed', mirror ? 'true' : 'false');
      if (running) { stopCamera(); startCamera(); }
    });
    window.addEventListener('beforeunload', stopCamera);

    /* ---------- 背景アンビエントパーティクル ---------- */
    (function ambient() {
      var c = document.getElementById('bg-canvas'), x = c.getContext('2d');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var pts = [], W, H;
      function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
      resize(); addEventListener('resize', resize);
      var N = reduce ? 0 : Math.min(60, Math.floor(innerWidth / 22));
      for (var i = 0; i < N; i++) pts.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.4, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25, c: Math.random() > 0.5 ? '34,211,238' : '167,139,250' });
      function tick() {
        x.clearRect(0, 0, W, H);
        for (var i = 0; i < pts.length; i++) {
          var p = pts[i]; p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
          x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283);
          x.fillStyle = 'rgba(' + p.c + ',0.5)'; x.fill();
        }
        if (!reduce) requestAnimationFrame(tick);
      }
      tick();
    })();
  })();
  </script>
</body>
</html>
