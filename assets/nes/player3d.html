<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; script-src-attr 'none'; style-src 'self'; connect-src 'self' https://unpkg.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'">
<title>NES Voxel Player</title><link rel="stylesheet" href="player3d.css">
<script src="https://unpkg.com/jsnes@2.1.0/dist/jsnes.min.js" integrity="sha384-9VM07v3soyIdTnWETAJmGKMQ0OnmtTnnv5rF5APysr6eFopiJc4KoFYMvt9QFPvk" crossorigin="anonymous" defer></script>
<script src="formats.js" defer></script><script src="voxel-data.js" defer></script><script src="voxel-renderer.js" defer></script><script src="player3d.js" defer></script>
</head><body>
<canvas id="scene" aria-label="3Dゲーム画面。ドラッグで回転、ホイールで拡大。" tabindex="0"></canvas>
<canvas id="hud" width="256" height="240" aria-hidden="true"></canvas>
<div class="toolbar"><button id="soundBtn" type="button">音声ON</button><button id="frontBtn" type="button">正面</button><button id="orbitBtn" type="button">斜め</button><button id="saveBtn" type="button">保存</button><label class="file-label">読込<input id="stateInput" type="file" accept=".json"></label></div>
<div class="inspector"><span>2D原画をクリック → タイル選択</span><canvas id="source" width="256" height="240" aria-label="タイル選択用の2D原画" tabindex="0"></canvas></div>
<p id="notice" role="status">3Dコアを準備しています。</p>
</body></html>
