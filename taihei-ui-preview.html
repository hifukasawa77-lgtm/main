<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>太平風雲記 UI Redesign Preview v2</title>
<style>
:root{--ink:#17120d;--ink2:#241a12;--paper:#e7dcc2;--paper2:#cdbb92;--verm:#9f2f24;--gold:#b38a45;--north:#9b3b32;--south:#365b73;--neutral:#786b52}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0f0c09;color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden}body{background:radial-gradient(circle at 50% 15%,#33261a 0,#17120d 48%,#0c0907 100%)}button{font:inherit}.shell{width:100vw;height:100vh;display:grid;grid-template-rows:68px 1fr 76px;border:1px solid #4b3724;box-shadow:inset 0 0 70px #000}.topbar{display:grid;grid-template-columns:300px 1fr;background:linear-gradient(#302217,#1e160f);border-bottom:2px solid var(--gold)}.brand{display:flex;align-items:center;gap:14px;padding:8px 18px;border-right:1px solid #5b432b}.crest{width:42px;height:42px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:20px}.title{font-size:24px;letter-spacing:.16em}.era{font-size:12px;color:#c7b58e;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(6,1fr)}.stat{display:flex;flex-direction:column;justify-content:center;padding:6px 14px;border-right:1px solid #4b3724}.stat span{font-size:11px;color:#b9a788}.stat b{font-size:18px;color:#f0e2bf}.stat small{font-size:10px;color:#89775d}.main{min-height:0;display:grid;grid-template-columns:1fr 326px;background:#15100c}.mapwrap{position:relative;overflow:hidden;border-right:2px solid #4d3824}.mapframe{position:absolute;inset:0;background:#1a1510}.mapframe iframe{width:100%;height:100%;border:0;filter:saturate(.72) sepia(.18) brightness(.84)}.mapveil{pointer-events:none;position:absolute;inset:0;background:linear-gradient(90deg,rgba(37,25,15,.22),transparent 18%,transparent 82%,rgba(37,25,15,.2));box-shadow:inset 0 0 44px rgba(0,0,0,.7)}.legend{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;padding:7px 10px;background:rgba(24,17,12,.9);border:1px solid #705234;font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.n{background:var(--north)}.s{background:var(--south)}.u{background:var(--neutral)}.side{background:linear-gradient(90deg,#231910,#17110c);padding:10px;display:flex;flex-direction:column;gap:9px;overflow:auto}.panel{border:1px solid #5c432c;background:linear-gradient(145deg,rgba(62,45,28,.74),rgba(30,22,15,.88));box-shadow:inset 0 0 0 1px rgba(204,171,111,.08)}.panel h2{margin:0;padding:8px 11px;background:rgba(128,88,45,.18);border-bottom:1px solid #5a412b;font-size:14px;letter-spacing:.12em;color:#e9d9b2}.body{padding:10px}.place{display:flex;justify-content:space-between;align-items:center}.place strong{font-size:24px}.badge{padding:3px 8px;border:1px solid #86524b;color:#d8a79f;background:#3d1f1b;font-size:11px}.rows{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.cell{padding:7px;background:rgba(0,0,0,.18);border-left:2px solid #88683b}.cell span{display:block;font-size:10px;color:#aa9778}.cell b{font-size:16px}.retainer{display:flex;gap:9px;align-items:center}.portrait{width:58px;height:68px;border:1px solid #796047;background:linear-gradient(135deg,#6c5944,#211811);display:grid;place-items:center;font-size:26px;color:#d7c29a}.retainer h3{margin:0;font-size:16px}.retainer p{margin:4px 0 0;font-size:11px;color:#b8a788}.meter{height:7px;background:#2a1c12;margin-top:7px;border:1px solid #4d3824}.meter i{display:block;height:100%;background:linear-gradient(90deg,#7c3027,#c78d4f)}.courtgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.court{padding:8px;border:1px solid #58422d;background:#201812}.court b{display:block;font-size:13px}.court em{font-style:normal;font-size:20px}.north{color:#d18f83}.south{color:#84b2cb}.alert{padding:8px;border-left:3px solid var(--verm);background:rgba(112,38,27,.13);font-size:11px;line-height:1.5;color:#d7c19d}.action{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action button{padding:9px 6px;background:#2a1b12;color:#dfcca5;border:1px solid #6d4b2f;cursor:pointer}.action button:hover{background:#54311e}.history{font-size:11px;line-height:1.75;color:#cab790}.bottom{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(#24180f,#120d09);border-top:2px solid var(--gold)}.cmd{border:0;border-right:1px solid #4f3824;background:transparent;color:#d7c6a2;font-size:15px;letter-spacing:.08em;cursor:pointer}.cmd strong{display:block;font-size:20px;color:#c59a55}.cmd:hover,.cmd.active{background:linear-gradient(#58311e,#2a190f);color:#fff1ca}.cmd.active{box-shadow:inset 0 3px 0 var(--verm)}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(30,20,13,.96);border:1px solid var(--gold);padding:8px 18px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:900px){.shell{grid-template-rows:56px 1fr 62px}.topbar{grid-template-columns:220px 1fr}.title{font-size:18px}.stats{grid-template-columns:repeat(3,1fr)}.stat:nth-child(n+4){display:none}.main{grid-template-columns:1fr 250px}.cmd{font-size:11px}.cmd strong{font-size:15px}.side{padding:6px}.body{padding:7px}.place strong{font-size:19px}}@media(max-width:700px) and (orientation:portrait){body:before{content:"太平風雲記は横向き表示で確認してください";position:fixed;inset:0;z-index:50;background:#17110c;display:grid;place-items:center;padding:30px;text-align:center;color:#e7dcc2;font-size:18px}}
</style></head><body>
<div class="shell"><header class="topbar"><div class="brand"><div class="crest">二</div><div><div class="title">太平風雲記</div><div class="era" id="era">建武三年 四月　足利尊氏</div></div></div><div class="stats"><div class="stat"><span>金</span><b id="gold">2,850</b><small>貫</small></div><div class="stat"><span>総兵力</span><b>18,400</b><small>人</small></div><div class="stat"><span>威信</span><b>72</b><small>/ 100</small></div><div class="stat"><span>朝廷評価</span><b>61</b><small>/ 100</small></div><div class="stat"><span>忠義</span><b id="loyalty">68</b><small>/ 100</small></div><div class="stat"><span>恩賞余力</span><b id="reward">43</b><small>/ 100</small></div></div></header>
<main class="main"><section class="mapwrap"><div class="mapframe"><iframe src="taihei.html" title="太平風雲記 本体"></iframe></div><div class="mapveil"></div><div class="legend"><span><i class="dot n"></i>北朝方</span><span><i class="dot s"></i>南朝方</span><span><i class="dot u"></i>中立・反乱</span></div><div class="toast" id="toast"></div></section><aside class="side" id="side"></aside></main>
<nav class="bottom"><button class="cmd active" data-panel="domestic"><strong>政</strong>内政</button><button class="cmd" data-panel="military"><strong>軍</strong>軍事</button><button class="cmd" data-panel="diplomacy"><strong>盟</strong>外交</button><button class="cmd" data-panel="court"><strong>廷</strong>朝廷</button><button class="cmd" data-panel="reward"><strong>賞</strong>恩賞</button><button class="cmd" data-panel="akutou"><strong>悪</strong>悪党</button><button class="cmd" data-panel="info"><strong>覧</strong>情報</button></nav></div>
<script>
const side=document.getElementById('side'),toast=document.getElementById('toast');let month=4,gold=2850,loyalty=68,reward=43;
const common=()=>`<section class="panel"><h2>選択国</h2><div class="body"><div class="place"><strong>播磨国</strong><span class="badge">北朝方</span></div><div class="rows"><div class="cell"><span>拠点</span><b>姫路</b></div><div class="cell"><span>石高</span><b>120</b></div><div class="cell"><span>兵</span><b>3,200</b></div><div class="cell"><span>民心</span><b>67</b></div></div></div></section>`;
const panels={domestic:()=>common()+`<section class="panel"><h2>政務</h2><div class="body"><div class="action"><button data-act="開墾">開墾</button><button data-act="治安">治安</button><button data-act="築城">築城</button><button data-act="徴税">徴税</button></div></div></section><section class="panel"><h2>国主・武将</h2><div class="body"><div class="retainer"><div class="portrait">赤</div><div><h3>赤松則村</h3><p>統率 78　武勇 71　政治 73</p><div class="meter"><i style="width:74%"></i></div><p>忠誠 74 / 100</p></div></div></div></section>`,military:()=>common()+`<section class="panel"><h2>軍勢</h2><div class="body"><div class="rows"><div class="cell"><span>主力</span><b>2,400</b></div><div class="cell"><span>守備</span><b>800</b></div><div class="cell"><span>士気</span><b>73</b></div><div class="cell"><span>兵糧</span><b>61</b></div></div><div class="action"><button data-act="出陣">出陣</button><button data-act="徴兵">徴兵</button></div></div></section>`,diplomacy:()=>common()+`<section class="panel"><h2>外交</h2><div class="body"><div class="history">赤松氏　友好 62<br>細川氏　友好 48<br>新田氏　警戒 71</div><div class="action"><button data-act="同盟交渉">同盟</button><button data-act="停戦交渉">停戦</button></div></div></section>`,court:()=>`<section class="panel"><h2>朝廷・正統性</h2><div class="body"><div class="courtgrid"><div class="court"><b class="north">北朝</b><em>64</em></div><div class="court"><b class="south">南朝</b><em>31</em></div></div><div class="rows"><div class="cell"><span>朝廷関係</span><b>61</b></div><div class="cell"><span>官位</span><b>従五位</b></div></div><div class="action"><button data-act="任官を奏請">任官</button><button data-act="討伐令を奏請">討伐令</button></div></div></section><section class="panel"><h2>政局</h2><div class="body alert">南北両朝の正統性が拮抗しています。京都・吉野の帰趨が天下の評価を大きく左右します。</div></section>`,reward:()=>`<section class="panel"><h2>恩賞</h2><div class="body"><div class="alert">恩賞要求が2件あります。未処理のまま月を進めると忠義が低下します。</div><div class="retainer"><div class="portrait">赤</div><div><h3>赤松則村</h3><p>功績 86　要求 20</p><div class="meter"><i style="width:74%"></i></div><p>忠誠 74</p></div></div><div class="action"><button data-act="所領を与える">所領</button><button data-act="金銭を与える">金銭</button></div></div></section>`,akutou:()=>`<section class="panel"><h2>悪党衆</h2><div class="body"><div class="rows"><div class="cell"><span>雇用数</span><b>310</b></div><div class="cell"><span>露見度</span><b>18</b></div></div><div class="action"><button data-act="撹乱">撹乱</button><button data-act="放火">放火</button><button data-act="流言">流言</button><button data-act="略奪">略奪</button></div></div></section>`,info:()=>`<section class="panel"><h2>年代記</h2><div class="body history">1333年　鎌倉幕府滅亡<br>1334年　建武の新政<br>1335年　中先代の乱<br>1336年　足利尊氏、京都へ</div></section><section class="panel"><h2>勢力凡例</h2><div class="body history"><span class="north">● 北朝方</span><br><span class="south">● 南朝方</span><br>● 中立・反乱勢力</div></section>`};
function showPanel(id){side.innerHTML=panels[id]();side.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>notify(b.dataset.act+'を選択しました'));}
function notify(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
document.querySelectorAll('.cmd').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.cmd').forEach(x=>x.classList.remove('active'));b.classList.add('active');showPanel(b.dataset.panel)}));showPanel('domestic');
</script></body></html>
