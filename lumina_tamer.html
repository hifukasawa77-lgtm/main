function drawTitle(g) {

/* ====================================================================
   更新・メインループ
   ==================================================================== */
function update(dt) {

  for (let i = waiters.length - 1; i >= 0; i--) { if (waiters[i].cond()) { const w = waiters.splice(i, 1)[0]; w.res(); } }
  if (DLG && !DLG.done) { DLG.i += dt * 55; if (DLG.i >= DLG.text.length) { DLG.i = DLG.text.length; DLG.done = true; } }
  if (DLG && DLG.done) { if (DLG.auto || demo) { DLG.t += dt; if (DLG.t > (demo ? .9 : .85)) resolveDlg(); } }
  if (DLG && DLG.done && !DLG.auto && !demo && DLG.t === 0 && false) resolveDlg();
  if (mode === 'over') updateOver(dt);
  else if (mode === 'title') { }
}
function render() {
  const g = ctx; g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  g.imageSmoothingEnabled = true;
  if (mode === 'title') drawTitle(g);

}
let last = performance.now(), acc = 0;
function frame(now) {

  render(); requestAnimationFrame(frame);
}

addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { last = performance.now(); });
buildTex(); resize(); startDemo(); cv.focus(); requestAnimationFrame(frame);
