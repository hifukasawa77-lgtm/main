<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="assets/js/frame-guard.js"></script>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumina Tamer | ルミナ・テイマー</title>
<meta name="description" content="生成画像アセットを使用したオリジナル・モンスター育成RPG。草むらで出会い、仲間にして、街のジムリーダーに挑もう。開くと自動デモ、キーやスマホのタッチ操作で自分でも遊べます。">
<style>
html,body{margin:0;height:100%;background:#06070f;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;outline:none;background:#000;touch-action:none}
#tp{display:none;position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:5;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.touch #tp{display:block}
body.touch.portrait{align-items:flex-start}
#tp button{position:absolute;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;font:800 18px system-ui,sans-serif;color:#e8f4ff;background:rgba(20,28,52,.62);border:1.5px solid rgba(160,210,255,.45);border-radius:50%;width:var(--b);height:var(--b);padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#tp button.on{background:rgba(90,170,255,.6);border-color:#bfe3ff}
#tp .d{border-radius:14px}
#tp .sm{width:calc(var(--b)*.78);height:calc(var(--b)*.78);font-size:14px}
#tp{--b:62px;--m:14px}
#tp [data-k=u]{left:calc(var(--m) + var(--b) + 4px);bottom:calc(var(--m) + (var(--b) + 4px)*2)}
#tp [data-k=d]{left:calc(var(--m) + var(--b) + 4px);bottom:var(--m)}
#tp [data-k=l]{left:var(--m);bottom:calc(var(--m) + var(--b) + 4px)}
#tp [data-k=r]{left:calc(var(--m) + (var(--b) + 4px)*2);bottom:calc(var(--m) + var(--b) + 4px)}
#tp [data-k=ok]{right:var(--m);bottom:calc(var(--m) + var(--b)*.5 + 4px)}
#tp [data-k=back]{right:calc(var(--m) + var(--b) + 6px);bottom:var(--m)}
#tp [data-k=run]{right:calc(var(--m) + var(--b)*.1);bottom:calc(var(--m) + var(--b)*1.75 + 12px)}
</style>
</head>
<body>
<canvas id="c" width="640" height="512" tabindex="0" aria-label="Lumina Tamer"></canvas>
<div id="tp" aria-label="タッチ操作 / Touch controls">
<button class="d" data-k="u" aria-label="上 Up">▲</button><button class="d" data-k="l" aria-label="左 Left">◀</button><button class="d" data-k="r" aria-label="右 Right">▶</button><button class="d" data-k="d" aria-label="下 Down">▼</button>
<button data-k="ok" aria-label="けってい OK">A</button><button data-k="back" aria-label="もどる・メニュー Back">B</button><button class="sm" data-k="run" aria-label="ダッシュ Run">RUN</button>

function bfs(sx, sy, tx, ty) {
  const m = curMap(), key = (x, y) => y * m.w + x, prev = new Map(), q = [[sx, sy]]; prev.set(key(sx, sy), null);
  while (q.length) {
    const [x, y] = q.shift(); if (x === tx && y === ty) break;
    for (const d of ['u', 'd', 'l', 'r']) { const nx = x + DIRV[d][0], ny = y + DIRV[d][1]; if (prev.has(key(nx, ny))) continue; if (!canWalk(nx, ny) && !(nx === tx && ny === ty && !SOLID.has(tileAt(nx, ny)))) continue; prev.set(key(nx, ny), [x, y, d]); q.push([nx, ny]); }
  }
  if (!prev.has(key(tx, ty))) return null;
  const path = []; let c = prev.get(key(tx, ty)); let cx = tx, cy = ty;
  while (c) { path.unshift(c[2]); cx = c[0]; cy = c[1]; c = prev.get(key(cx, cy)); }
  return path;
}

    const cands = []; const m = curMap();
    for (let y = 10; y <= 26; y++) for (let x = 4; x <= 36; x++) if (m.g[y][x] === 'g' && canWalk(x, y)) cands.push([x, y]);
    const [tx, ty] = pick(cands), path = bfs(P.tx, P.ty, tx, ty);
    if (!path) { await wait(300); continue; }
    for (const d of path) { if (myEpoch !== epoch) return; await stepDemo(d); }

    for (let i = 0; i < 24 && myEpoch === epoch; i++) {

function monsterSheet(name,count){

}

/* ====================================================================
   更新・メインループ
   ==================================================================== */
function update(dt) {
  gtime += dt;
  for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; t.t -= dt; if (t.t <= 0) { timers.splice(i, 1); t.res(); } }
  for (let i = anims.length - 1; i >= 0; i--) { const a = anims[i]; a.t += dt; const p = clamp(a.t / a.dur, 0, 1); a.fn(p); if (p >= 1) { anims.splice(i, 1); a.res(); } }
  for (let i = waiters.length - 1; i >= 0; i--) { if (waiters[i].cond()) { const w = waiters.splice(i, 1)[0]; w.res(); } }
  if (DLG && !DLG.done) { DLG.i += dt * 55; if (DLG.i >= DLG.text.length) { DLG.i = DLG.text.length; DLG.done = true; } }
  if (DLG && DLG.done) { if (DLG.auto || demo) { DLG.t += dt; if (DLG.t > (demo ? .9 : .85)) resolveDlg(); } }
  if (DLG && DLG.done && !DLG.auto && !demo && DLG.t === 0 && false) resolveDlg();
  if (mode === 'over') updateOver(dt);
  else if (mode === 'title') { }
}
function render() {

  else if (mode === 'evo' && B) drawEvo(g);
  else if (mode === 'ending' && END) drawEnding(g);
  else if (S && P) drawOver(g);
  if (demo && mode !== 'title') drawDemoOverlay(g);
  if (DLG) drawDialog(g);
  if (MENU) drawMenu(g);
  if (TR > 0) { g.fillStyle = 'rgba(255,255,255,' + TR + ')'; g.fillRect(0, 0, W, H); }
}
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > .1) dt = .1;
  acc += dt * TESTSPEED; let n = 0;
  while (acc >= FIX && n++ < 40) { update(FIX); acc -= FIX; }
  render(); requestAnimationFrame(frame);
}
function resize() {

  cv.width = Math.max(1, Math.round(W * k * dpr)); cv.height = Math.max(1, Math.round(H * k * dpr));
}
