<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      background: #0d0d1a;
      color: #ccd;
      font-family: 'Segoe UI', 'Meiryo', sans-serif;
      font-size: 13px;
    }

    /* ---- ヘッダー ---- */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(0,200,255,0.2);
    }
    .header h1 {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #7ee8ff;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .dot.active { background: #22d3ee; box-shadow: 0 0 6px rgba(34,211,238,0.6); }

    /* ---- トグルスイッチ ---- */
    .switch { position: relative; display: inline-block; width: 38px; height: 21px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 21px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 15px;
      height: 15px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #99a;
      transition: transform 0.2s, background 0.2s;
    }
    .switch input:checked + .slider {
      background: rgba(34,211,238,0.25);
      border-color: rgba(34,211,238,0.6);
    }
    .switch input:checked + .slider::before { transform: translateX(17px); background: #7ee8ff; }

    /* ---- タブ ---- */
    .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .tabs button {
      flex: 1;
      padding: 9px 0 8px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #778;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tabs button small { display: block; font-size: 9px; opacity: 0.65; margin-top: 1px; }
    .tabs button:hover { color: #aab; }
    .tabs button.active { color: #7ee8ff; border-bottom-color: #22d3ee; }

    .panel { display: none; padding: 12px 16px 16px; }
    .panel.active { display: block; }

    /* ---- 共通パーツ ---- */
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    input[type="search"], input[type="time"], textarea {
      width: 100%;
      padding: 7px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,200,255,0.25);
      border-radius: 7px;
      color: #ccd;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: rgba(0,200,255,0.6); }
    textarea { resize: vertical; min-height: 84px; line-height: 1.6; }

    .link-btn {
      flex-shrink: 0;
      padding: 6px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px;
      color: #99a;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .link-btn:hover { color: #7ee8ff; border-color: rgba(0,200,255,0.45); }

    .count { font-size: 11px; color: #778; margin-bottom: 8px; }
    .count b { color: #7ee8ff; font-weight: 600; }

    /* ---- リスト ---- */
    .list { max-height: 320px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    .row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 8px 9px;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .row:hover { background: rgba(34,211,238,0.06); border-color: rgba(34,211,238,0.25); }
    .row.on { border-color: rgba(34,211,238,0.45); background: rgba(34,211,238,0.08); }

    .row input[type="checkbox"] {
      margin-top: 2px;
      width: 15px;
      height: 15px;
      accent-color: #22d3ee;
      flex-shrink: 0;
      cursor: pointer;
    }
    .row .body { flex: 1; min-width: 0; }
    .row .name {
      font-size: 12.5px;
      color: #dde;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row.on .name { color: #a7f0ff; }
    .row .sub {
      font-size: 11px;
      color: #778;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row .unread {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      flex-shrink: 0;
      margin-top: 5px;
    }

    /* ---- 履歴 ---- */
    .hist { padding: 8px 9px; margin-bottom: 4px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; cursor: pointer; }
    .hist:hover { border-color: rgba(34,211,238,0.3); }
    .hist .top { display: flex; align-items: center; gap: 6px; }
    .hist .name { flex: 1; font-size: 12px; color: #a7f0ff; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
    .hist .time { font-size: 10px; color: #667; flex-shrink: 0; }
    .hist .msg { font-size: 11.5px; color: #99a; margin-top: 3px; line-height: 1.45;
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tag { font-size: 9px; padding: 1px 5px; border-radius: 4px; flex-shrink: 0; }
    .tag.keyword { background: rgba(167,139,250,0.18); color: #c4b5fd; }
    .tag.quiet { background: rgba(255,255,255,0.08); color: #889; }

    /* ---- 設定 ---- */
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .field-head span { flex: 1; font-size: 12px; color: #ccd; }
    .field-head span em { display: block; font-style: normal; font-size: 10px; color: #667; margin-top: 1px; }
    .times { display: flex; align-items: center; gap: 8px; }
    .times span { color: #667; font-size: 12px; }
    .hint { font-size: 10.5px; color: #667; line-height: 1.5; margin-top: 6px; }

    .empty { padding: 24px 8px; text-align: center; font-size: 11.5px; color: #667; line-height: 1.7; }
    .warn {
      padding: 8px 10px;
      background: rgba(255,200,0,0.06);
      border: 1px solid rgba(255,200,0,0.2);
      border-radius: 6px;
      font-size: 11px;
      color: #bba;
      line-height: 1.5;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot" id="dot"></div>
    <h1>Teams Chat Notifier</h1>
    <label class="switch" title="通知の監視 ON/OFF">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <nav class="tabs">
    <button data-tab="chats" class="active">チャット<small>Chats</small></button>
    <button data-tab="settings">設定<small>Settings</small></button>
    <button data-tab="history">履歴<small>History</small></button>
  </nav>

  <section class="panel active" id="panel-chats">
    <div id="rosterWarn"></div>
    <div class="toolbar">
      <input type="search" id="filter" placeholder="チャットを検索 / Filter">
      <button class="link-btn" id="clearSel">全解除</button>
    </div>
    <div class="count">通知するチャット: <b id="selCount">0</b> 件 / 全 <b id="allCount">0</b> 件</div>
    <div class="list" id="chatList"></div>
  </section>

  <section class="panel" id="panel-settings">
    <div class="field">
      <div class="field-head">
        <span>静音時間帯<em>Quiet hours — 通知を出さず履歴にだけ残す</em></span>
        <label class="switch"><input type="checkbox" id="quietEnabled"><span class="slider"></span></label>
      </div>
      <div class="times">
        <input type="time" id="quietStart">
        <span>〜</span>
        <input type="time" id="quietEnd">
      </div>
      <div class="hint">開始が終了より遅い場合は日をまたぐ時間帯として扱います（例: 19:00〜08:00）。</div>
    </div>

    <div class="field">
      <div class="field-head">
        <span>キーワード監視<em>Keywords — 未選択のチャットでも通知する</em></span>
        <label class="switch"><input type="checkbox" id="keywordsEnabled"><span class="slider"></span></label>
      </div>
      <textarea id="keywords" placeholder="1行に1つ&#10;深澤&#10;至急&#10;レビュー依頼"></textarea>
      <div class="hint">チャット名・送信者名・本文のいずれかに含まれていれば通知します（大文字小文字は区別しません）。</div>
    </div>
  </section>

  <section class="panel" id="panel-history">
    <div class="toolbar">
      <div class="count" style="flex:1;margin:0;">直近 <b id="histCount">0</b> 件（最大50件）</div>
      <button class="link-btn" id="clearHist">履歴を消去</button>
    </div>
    <div class="list" id="histList"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
