  G.items=ITEMS0.map(i=>Object.assign({taken:false},i));
  G.zombies=ZOM0.map(mkZombie);
  // 坑長(ボス) 換気室の守り
  const b=mkZombie([71.5,6.5,3]);b.boss=true;b.hp=b.mhp=16;b.spd=1.0;G.zombies.push(b);
  G.gun=false;G.mag=0;G.res=0;G.herb=0;G.keys={};G.fuse=0;G.flags={vent:false};G.hp=100;G.torch=true;G.notes={};G.stats={kills:0,time:0};
  G.msg=[];G.doc=null;G.reload=0;G.fireCd=0;G.deadT=0;G.clearT=0;
  P.x=5.5;P.y=33.5;P.yaw=-Math.PI/2;P.vx=P.vy=0;
}
function snapshot(){
  return {
    j:JSON.stringify({p:[P.x,P.y,P.yaw],hp:G.hp,gun:G.gun,mag:G.mag,res:G.res,herb:G.herb,keys:G.keys,fuse:G.fuse,flags:G.flags,notes:G.notes,items:G.items,zombies:G.zombies,stats:G.stats}),wl:WL.slice(),seen:SEEN.slice()};
}
function restore(s){
  const o=JSON.parse(s.j);P.x=o.p[0];P.y=o.p[1];P.yaw=o.p[2];P.vx=P.vy=0;
  G.hp=Math.max(o.hp,60);G.gun=o.gun;G.mag=o.mag;G.res=o.res;G.herb=o.herb;G.keys=o.keys;G.fuse=o.fuse;G.flags=o.flags;G.notes=o.notes;G.items=o.items;G.zombies=o.zombies;G.stats=o.stats;
  WL.set(s.wl);SEEN.set(s.seen);G.msg=[];G.doc=null;G.reload=0;
  // 近くの屍人は下がらせる
  for(const z of G.zombies)if(z.hp>0&&hyp(z.x-P.x,z.y-P.y)<5){z.x=z.home[0];z.y=z.home[1];z.state='idle';}
}
function checkpoint(){G.cp=snapshot();}
function say(t,d){G.msg.push({t,age:0,d:d||3.4});if(G.msg.length>4)G.msg.shift();}

/* ================= 音 ================= */
let AC=null,mg=null,muted=false,nb=null,windG=null;
function audioInit(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    mg=AC.createGain();mg.gain.value=.8;mg.connect(AC.destination);
    nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;
    const s=AC.createBufferSource();s.buffer=nb;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;windG=AC.createGain();windG.gain.value=.08;
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.09;lg.gain.value=.05;lfo.connect(lg);lg.connect(windG.gain);lfo.start();
    s.connect(f);f.connect(windG);windG.connect(mg);s.start();
    const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.value=43;og.gain.value=.05;o.connect(og);og.connect(mg);o.start();
    const o2=AC.createOscillator(),og2=AC.createGain();o2.type='sine';o2.frequency.value=45.5;og2.gain.value=.04;o2.connect(og2);og2.connect(mg);o2.start();
  }catch(e){AC=null;}
}
function tone(f,d,type,v,slide,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fq,delay,type,q){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nb;f.type=type||'lowpass';f.frequency.value=fq||800;if(q)f.Q.value=q;
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(mg);s.start(t,rnd()*1.2);s.stop(t+d+.03);
}
function groan(vol){
  if(!AC||muted)return;
  const f0=70+rnd()*50,t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter(),lf=AC.createOscillator(),lg=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*.75,t+1.3);fl.type='lowpass';fl.frequency.value=380;fl.Q.value=4;
  lf.frequency.value=5+rnd()*3;lg.gain.value=9;lf.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*.28,t+.25);g.gain.linearRampToValueAtTime(0,t+1.4);
  o.connect(fl);fl.connect(g);g.connect(mg);o.start(t);lf.start(t);o.stop(t+1.5);lf.stop(t+1.5);
}
const sfx={
  shot(){noise(.28,.6,2200,0,'lowpass');tone(110,.18,'square',.3,-80);noise(.5,.18,300,.04);},
  empty(){tone(900,.04,'square',.08);},
  reload(){tone(300,.05,'square',.1);tone(500,.05,'square',.1,0,.5);tone(700,.07,'square',.12,0,1.0);},
  step(kind,v){const f=kind===1?900:kind===3?500:400;noise(.07,.1*v,f);tone(kind===1?150:90,.08,'sine',.07*v,-20);},
  door(){noise(.6,.16,600,0,'bandpass',4);tone(80,.5,'sawtooth',.05,40);},
  lock(){tone(180,.06,'square',.1);tone(140,.08,'square',.1,0,.08);},
  pick(){tone(880,.1,'triangle',.1);tone(1320,.14,'triangle',.1,0,.08);},
  paper(){noise(.25,.08,3500,0,'highpass');},
  hit(){tone(90,.12,'sawtooth',.2,-40);noise(.15,.25,900);},
  hurt(){noise(.3,.4,500);tone(120,.3,'sawtooth',.2,-60);},
  zdie(){tone(100,.6,'sawtooth',.18,-70);noise(.4,.2,500);},
  herb(){for(let i=0;i<4;i++)tone(500+i*180,.18,'sine',.09,0,i*.1);},
  lever(){noise(.2,.2,400);tone(70,.4,'sawtooth',.15,30,.1);tone(110,.7,'sine',.2,60,.5);},
  clear(){for(let i=0;i<7;i++)tone(330*Math.pow(1.22,i),.9,'sine',.09,0,i*.2);},
  die(){tone(70,1.6,'sawtooth',.3,-40);noise(1.2,.3,300);},
  beat(){tone(55,.12,'sine',.28,-15);tone(48,.14,'sine',.2,-12,.18);}
};

/* ================= 入力 ================= */
const keys={};let locked=false;const mouse={down:false};
addEventListener('keydown',ev=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(ev.code))ev.preventDefault();
  if(ev.repeat)return;
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  if(ev.code==='KeyM'){muted=!muted;if(windG)windG.gain.value=muted?0:.08;return;}
  if(ev.metaKey||ev.ctrlKey||ev.altKey||ev.code.startsWith('F')&&ev.code!=='KeyF')return;
  if(G.mode==='demo'){newGame('play');keys[ev.code]=true;return;}
  if(G.doc){if(ev.code==='KeyE'||ev.code==='Enter'||ev.code==='Escape'||ev.code==='Space'){G.doc=null;sfx.paper();}return;}
  if(G.scene==='dead'&&G.deadT>1.6&&(ev.code==='Enter'||ev.code==='Space')){respawn();return;}
  if(G.scene==='clear'&&G.clearT>2&&(ev.code==='Enter'||ev.code==='Space')){newGame('demo');return;}
  if(ev.code==='KeyP'||(ev.code==='Escape'&&!locked)){G.paused=!G.paused;return;}
  if(ev.code==='Escape'&&G.scene==='dead'){newGame('demo');return;}
  keys[ev.code]=true;
  if(ev.code==='KeyF')G.torch=!G.torch;
  if(ev.code==='KeyR')startReload();
  if(ev.code==='KeyH')useHerb();
  if(ev.code==='KeyE')G.useReq=true;
});
addEventListener('keyup',ev=>{keys[ev.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;if(G.mode==='play')G.paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')G.paused=true;});
cv.addEventListener('mousedown',ev=>{
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  if(G.mode==='demo'){newGame('play');return;}
  if(G.paused){G.paused=false;}
  try{if(document.pointerLockElement!==cv)cv.requestPointerLock();}catch(e){}
  if(ev.button===0)mouse.down=true;
});
addEventListener('mouseup',ev=>{if(ev.button===0)mouse.down=false;});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;});
document.addEventListener('mousemove',ev=>{if(document.pointerLockElement===cv&&G.mode==='play'&&!G.paused&&!G.doc&&G.scene==='play')P.yaw+=ev.movementX*.0023;});

/* ================= 判定・移動 ================= */
function solidAt(x,y){const cx=Math.floor(x),cy=Math.floor(y);if(cx<0||cy<0||cx>=MW||cy>=MH)return true;return WL[cy*MW+cx]!==0;}
function blockedC(x,y,r){return solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r);}
function doorAt(cx,cy){return DOORS[ID(cx,cy)];}
function openDoor(cx,cy,byBot){
  const d=doorAt(cx,cy),t=WL[ID(cx,cy)];if(!d)return false;
  if(t===18){
    if(G.flags.vent){doClear();return true;}
    if(G.lockMsgT<=0){say('避難口の扉は固く閉ざされている。換気が止まったままだ……',4);sfx.lock();G.lockMsgT=2;}return false;
  }
  if(d.key&&!G.keys[d.key]){if(G.lockMsgT<=0){say(d.lock,3);sfx.lock();G.lockMsgT=1.6;}return false;}
  WL[ID(cx,cy)]=0;sfx.door();
  if(d.key){say('鍵を使った。扉が開いた。',3);checkpoint();}
  return true;
}
function movePlayer(dx,dy){
  const r=.25;
  let nx=P.x+dx;if(!blockedC(nx,P.y,r))P.x=nx;else tryBump(nx,P.y,dx,0);
  let ny=P.y+dy;if(!blockedC(P.x,ny,r))P.y=ny;else tryBump(P.x,ny,0,dy);
}
function tryBump(x,y,dx,dy){
  const sx=dx>0?x+.26:dx<0?x-.26:x,sy=dy>0?y+.26:dy<0?y-.26:y,cx=Math.floor(sx),cy=Math.floor(sy);
  if(cx>=0&&cy>=0&&cx<MW&&cy<MH&&DOORS[ID(cx,cy)]&&WL[ID(cx,cy)])openDoor(cx,cy);
}
function moveZ(z,dx,dy){
  const r=.28;
  let nx=z.x+dx;if(!blockedC(nx,z.y,r))z.x=nx;
  let ny=z.y+dy;if(!blockedC(z.x,ny,r))z.y=ny;
}

/* ================= BFS ================= */
const QBUF=new Int32Array(MW*MH);
function bfs(tx,ty,forBot){
  const d=new Int16Array(MW*MH).fill(-1);let h=0,t=0;
  const s=ID(Math.floor(tx),Math.floor(ty));d[s]=0;QBUF[t++]=s;
  while(h<t){
    const c=QBUF[h++],cx=c%MW,cy=(c/MW)|0,dc=d[c];
    for(let k=0;k<8;k++){
      const ox=[1,-1,0,0,1,1,-1,-1][k],oy=[0,0,1,-1,1,-1,1,-1][k],nx=cx+ox,ny=cy+oy;
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const n=ID(nx,ny);if(d[n]>=0)continue;
      if(!cellPass(n,forBot))continue;
      if(ox&&oy&&(!cellPass(ID(cx+ox,cy),forBot)||!cellPass(ID(cx,cy+oy),forBot)))continue;
      d[n]=dc+1;QBUF[t++]=n;
    }
  }
  return d;
}
function cellPass(n,forBot){
  const w=WL[n];if(w===0)return true;if(!forBot)return false;
  const dd=DOORS[n];if(!dd)return false;
  if(w===18)return G.flags.vent;
  return !dd.key||!!G.keys[dd.key];
}
function stepDir(field,x,y){
  const cx=Math.floor(x),cy=Math.floor(y);let best=null,bd=field[ID(cx,cy)];if(bd<0)return null;
  for(let k=0;k<8;k++){
    const ox=[1,-1,0,0,1,1,-1,-1][k],oy=[0,0,1,-1,1,-1,1,-1][k],nx=cx+ox,ny=cy+oy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const v=field[ID(nx,ny)];if(v<0||v>=bd)continue;
    if(ox&&oy&&(field[ID(cx+ox,cy)]<0||field[ID(cx,cy+oy)]<0))continue;
    bd=v;best=[nx+.5,ny+.5];
  }
  return best;
}

/* ================= アイテム・戦闘 ================= */
function startReload(){if(!G.gun||G.reload>0||G.mag>=8||G.res<=0)return;G.reload=1.4;sfx.reload();}
function useHerb(){if(G.herb<=0){say('薬草がない。');return;}if(G.hp>=100){say('体力は満タンだ。');return;}G.herb--;G.hp=Math.min(100,G.hp+45);sfx.herb();say('薬草を使った。');}
function pickup(it){
  it.taken=true;
  if(it.t==='herb'){G.herb++;say('薬草を手に入れた。(H で使う)');sfx.pick();}
  else if(it.t==='ammo'){G.res+=8;say('拳銃の弾を手に入れた。+8');sfx.pick();if(G.gun&&G.mag===0)startReload();}
  else if(it.t==='key'){G.keys[it.id]=1;say(it.name+'を手に入れた。',4);sfx.pick();checkpoint();}
  else if(it.t==='pistol'){G.gun=true;G.mag=8;G.res+=8;say('拳銃を手に入れた!(Space/クリックで撃つ・R 装填)',5);sfx.pick();checkpoint();}
  else if(it.t==='fuse'){G.fuse=1;say('ヒューズを手に入れた。換気室のレバーに使えそうだ。',4);sfx.pick();checkpoint();}
  else if(it.t==='note'){G.notes[it.id]=1;G.doc=NOTES[it.id];sfx.paper();}
}
function interact(){
  for(const it of G.items){
    if(it.taken)continue;
    const d=hyp(it.x-P.x,it.y-P.y);if(d>1.4)continue;
    if(Math.abs(angDiff(P.yaw,Math.atan2(it.y-P.y,it.x-P.x)))>1.1&&d>.8)continue;
    if(it.t==='lever'){
      if(!G.fuse){say('レバーの基部にヒューズがない。',3);sfx.lock();return true;}
      if(!G.flags.vent){G.flags.vent=true;it.taken=true;G.fuse=0;say('ヒューズをはめ、レバーを引いた。換気装置が唸りを上げて動き出した!',5);sfx.lever();G.shake=8;checkpoint();return true;}
    }else if(it.t==='note'||it.t==='key'||it.t==='pistol'||it.t==='fuse'||it.t==='herb'||it.t==='ammo'){pickup(it);return true;}
  }
  return false;
}
function fire(){
  if(!G.gun){if(G.fireCd<=0){say('銃がない……',2);G.fireCd=.6;}return;}
  if(G.fireCd>0||G.reload>0)return;
  if(G.mag<=0){sfx.empty();G.fireCd=.35;if(G.res>0)startReload();else say('弾がない!',2);return;}
  G.mag--;G.fireCd=.34;G.kick=1;G.flash=.12;G.shake=Math.max(G.shake,2.5);sfx.shot();
  // 銃声で周囲が気づく
  for(const z of G.zombies)if(z.hp>0&&hyp(z.x-P.x,z.y-P.y)<14){z.alert=Math.max(z.alert,6);}
  // ヒットスキャン
  const fx=Math.cos(P.yaw),fy=Math.sin(P.yaw);let best=null,bd=1e9;
  for(const z of G.zombies){
    if(z.hp<=0)continue;const dx=z.x-P.x,dy=z.y-P.y,al=dx*fx+dy*fy;if(al<.2||al>16)continue;
    const lat=Math.abs(-dx*fy+dy*fx);if(lat>(z.boss?.4:.28))continue;
    if(!losGrid(P.x,P.y,z.x,z.y))continue;
    if(al<bd){bd=al;best=z;}
  }
  if(best){
    const crit=rnd()<.18,dmg=crit?2:1;best.hp-=dmg;best.hit=.25;best.stun=.35;best.alert=8;best.state='chase';sfx.hit();
    if(crit)say('ヘッドショット!',1.2);
    if(best.hp<=0){best.state='dead';best.hp=0;G.stats.kills++;sfx.zdie();}
    else if(AC&&rnd()<.4)groan(.6);
  }else{
    // 壁にあたる
  }
  if(G.mag===0&&G.res>0)G.autoRel=.35;
}
function hurtPlayer(d,boss){
  const dm=G.mode==='demo'?d*.25:d;G.hp-=dm;G.hurt=.5;G.flash=0;G.shake=Math.max(G.shake,boss?9:5);sfx.hurt();
  if(G.hp<=0&&G.scene==='play'){G.hp=0;G.scene='dead';G.deadT=0;sfx.die();
    if(G.mode==='demo'){/* デモは自動で再開 */}}
}
function doClear(){G.scene='clear';G.clearT=0;sfx.clear();}
function respawn(){
  if(G.cp){restore(G.cp);G.scene='play';G.hp=Math.max(G.hp,70);G.fade=1;}else newGame('play');
}

/* ================= 屍人AI ================= */
function updateZombies(dt){
  G.fieldT-=dt;
  if(G.fieldT<=0){G.fieldT=.4;G.field=bfs(P.x,P.y,false);}
  G.nextGroan-=dt;
  for(const z of G.zombies){
    if(z.hp<=0){continue;}
    if(z.hitT>0){z.hitT-=dt;if(z.hitT<=0&&hyp(P.x-z.x,P.y-z.y)<1.25&&G.scene==='play')hurtPlayer(z.boss?28:14,z.boss);}
    z.hit=Math.max(0,z.hit-dt);z.stun=Math.max(0,z.stun-dt);z.atk=Math.max(0,z.atk-dt);z.atkAnim=Math.max(0,z.atkAnim-dt);z.alert=Math.max(0,z.alert-dt);
    const dx=P.x-z.x,dy=P.y-z.y,d=hyp(dx,dy);
    const near=d<22;
    if(!near&&z.state!=='chase')continue;
    const see=d<(G.torch?10:7)&&losGrid(z.x,z.y,P.x,P.y);
    const sneakTooClose=d<2.6&&see;
    if(z.state==='idle'){
      if((see&&d<(G.torch?8:5.5))||sneakTooClose||z.alert>0){z.state='chase';z.lost=0;if(near&&d<16&&G.nextGroan<=0){groan(clamp(1-d/16,.2,1));G.nextGroan=2+rnd()*3;}}
      else{ // うろうろ
        z.wt-=dt;if(z.wt<=0){z.wt=2+rnd()*3;z.wx=z.home[0]+(rnd()-.5)*3;z.wy=z.home[1]+(rnd()-.5)*3;}
        const wx=z.wx-z.x,wy=z.wy-z.y,wd=hyp(wx,wy);if(wd>.3){const s=.35*dt;moveZ(z,wx/wd*s,wy/wd*s);z.face=Math.atan2(wy,wx);z.pose=1;}else z.pose=0;
      }
    }else if(z.state==='chase'){
      if(see){z.lost=0;}else z.lost+=dt;
      if(z.lost>7&&d>10){z.state='idle';continue;}
      if(d<1.0){
        z.pose=2;
        if(z.atk<=0&&z.stun<=0){z.atk=z.boss?1.4:1.1;z.atkAnim=.45;z.hitT=.26;}
      }else{
        let tx,ty;
        if(see&&d<8){tx=P.x;ty=P.y;}
        else{const st=G.field?stepDir(G.field,z.x,z.y):null;if(st){tx=st[0];ty=st[1];}else{tx=P.x;ty=P.y;}}
        const vx=tx-z.x,vy=ty-z.y,vd=hyp(vx,vy)||1;
        const sp=z.spd*(z.stun>0?.2:1)*dt;moveZ(z,vx/vd*sp,vy/vd*sp);z.face=Math.atan2(vy,vx);
        z.pose=Math.floor(G.t*3+z.wob)%2?1:0;
      }
    }
  }
  // 重なり防止
  const zs=G.zombies;
  for(let i=0;i<zs.length;i++){const a=zs[i];if(a.hp<=0)continue;for(let j=i+1;j<zs.length;j++){const b=zs[j];if(b.hp<=0)continue;const dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy);if(d<.5&&d>.001){const p=(.5-d)*.5;moveZ(a,-dx/d*p,-dy/d*p);moveZ(b,dx/d*p,dy/d*p);}}}
}

/* ================= プレイヤー更新 ================= */
function playerStep(dt,inp){
  P.yaw+=inp.turn*2.2*dt;
  const fx=Math.cos(P.yaw),fy=Math.sin(P.yaw),rx=-fy,ry=fx;
  let mx=fx*inp.fwd+rx*inp.strafe,my=fy*inp.fwd+ry*inp.strafe;const l=hyp(mx,my);if(l>1){mx/=l;my/=l;}
  const sp=inp.run?3.5:2.1;
  const k=Math.min(1,dt*10);P.vx+=(mx*sp-P.vx)*k;P.vy+=(my*sp-P.vy)*k;
  movePlayer(P.vx*dt,P.vy*dt);
  const spd=hyp(P.vx,P.vy);
  G.bobP+=spd*dt*2.2;G.step+=spd*dt;

const bot={tgt:null,field:null,fieldT:0,seq:0,wob:0,use:0,t:0,stuck:0,lx:0,ly:0};
const BOT_SEQ=[ ['key','police'],['pistol'],['key','office'],['key','gate'],['fuse'],['lever'],['exit'] ];
function botTarget(){
  for(;bot.seq<BOT_SEQ.length;bot.seq++){
    const s=BOT_SEQ[bot.seq];
    if(s[0]==='exit')return {x:75-.6,y:34.5,exit:true};
    const it=G.items.find(i=>i.t===s[0]&&(!s[1]||i.id===s[1])&&!i.taken);
    if(it)return {x:it.x,y:it.y,it};
  }
  return {x:74,y:34.5,exit:true};
}
function botInput(dt){
  const inp={fwd:0,strafe:0,turn:0,run:0,fire:false,use:false};
  bot.t+=dt;
  if(!bot.tgt||(bot.tgt.it&&bot.tgt.it.taken)){bot.tgt=botTarget();bot.fieldT=0;}
  // 戦う
  let foe=null,fd=99;
  for(const z of G.zombies){if(z.hp<=0)continue;const d=hyp(z.x-P.x,z.y-P.y);if(d<7&&d<fd&&losGrid(P.x,P.y,z.x,z.y)){foe=z;fd=d;}}
  if(foe&&G.gun&&G.mag>0){
    const want=Math.atan2(foe.y-P.y,foe.x-P.x),d=angDiff(P.yaw,want);P.yaw+=clamp(d,-6*dt,6*dt);
    if(Math.abs(d)<.12&&fd<6.5)inp.fire=true;
    if(fd<2)inp.fwd=-.5;
    return inp;
  }
  if(G.gun&&G.mag===0&&G.res>0)startReload();
  bot.fieldT-=dt;
  if(bot.fieldT<=0){bot.fieldT=.5;bot.field=bfs(bot.tgt.x,bot.tgt.y,true);}
  const st=bot.field?stepDir(bot.field,P.x,P.y):null;
  const dToT=hyp(bot.tgt.x-P.x,bot.tgt.y-P.y);
  let wx=bot.tgt.x,wy=bot.tgt.y;
  if(st&&dToT>.9){wx=st[0];wy=st[1];}
  let want=Math.atan2(wy-P.y,wx-P.x);if(bot.tgt.exit&&dToT<1.6)want=0;
  const d=angDiff(P.yaw,want);
  P.yaw+=clamp(d,-4.5*dt,4.5*dt)+Math.sin(bot.t*1.3)*.2*dt;
  inp.fwd=Math.abs(d)<.9?1:0;inp.run=foe?1:(dToT>6?1:0);
  if(dToT<1.0&&bot.tgt.it){inp.use=true;}
  if(bot.tgt.exit&&dToT<2){inp.fwd=1;}
  // 詰まり
  bot.stuck+=dt;if(bot.stuck>1.2){if(hyp(P.x-bot.lx,P.y-bot.ly)<.15){bot.fieldT=0;P.yaw+=1.4;}bot.lx=P.x;bot.ly=P.y;bot.stuck=0;}
  if(G.hp<40&&G.herb>0&&!foe)useHerb();
  return inp;
}

function render(){
  const yaw=P.yaw,fx=Math.cos(yaw),fy=Math.sin(yaw),rx=-fy*TANH,ry=fx*TANH;
  const px=P.x,py=P.y,torch=G.torch?TORCH:0;

    for(let a=0;a<AREAS;a++)rowFog[a*SH+y]=Math.exp(-dist*FOGK[a]);
  }
  for(let x=0;x<SW;x++){const cx=((x+.5)/SW*2-1)*TANH;colAng[x]=yaw+Math.atan(cx);}
  const skyBase=SKYW/TAU;
  for(let x=0;x<SW;x++){

    let mx=Math.floor(px),my=Math.floor(py);

    let sx,sy,sdx,sdy;
    if(rdx<0){sx=-1;sdx=(px-mx)*ddx;}else{sx=1;sdx=(mx+1-px)*ddx;}
    if(rdy<0){sy=-1;sdy=(py-my)*ddy;}else{sy=1;sdy=(my+1-py)*ddy;}
    let side=0,hit=0,lmx=mx,lmy=my,guard=0;

      lmx=mx;lmy=my;
      if(sdx<sdy){sdx+=ddx;mx+=sx;side=0;}else{sdy+=ddy;my+=sy;side=1;}
      if(mx<0||my<0||mx>=MW||my>=MH){hit=6;break;}

    let perp=side===0?(mx-px+(1-sx)/2)/(rdx||1e-9):(my-py+(1-sy)/2)/(rdy||1e-9);
    if(perp<.05)perp=.05;
    zb[x]=perp;
    let wallX=side===0?py+perp*rdy:px+perp*rdx;wallX-=Math.floor(wallX);
    let tx=(wallX*64)|0;if(side===0&&rdx<0)tx=63-tx;if(side===1&&rdy>0)tx=63-tx;if(tx<0)tx=0;if(tx>63)tx=63;
    const wt=WT[hit]||WT[2];
    const top=hor-FPX*.5/perp,bot=hor+FPX*.5/perp;
    let y0=Math.ceil(top),y1=Math.floor(bot);if(y0<0)y0=0;if(y1>SH-1)y1=SH-1;
    const li=Math.max(0,Math.min(MW*MH-1,lmy*MW+lmx)),area=areaOf(FL[li]);
    const ff=Math.exp(-perp*FOGK[area]),tor=tcone[x]*torch*Math.exp(-perp*.11);
    let b=AMB[area]+LM[li]+tor;if(b>1.5)b=1.5;if(side===1)b*=.82;
    const tn=TINT[area],fc=FOGC[area];
    // 毒ガスの緑がかった霧(換気前の坑道は濃い)
    let gr=1,gg=1,gb=1,gfr=0,gfg=0,gfb=0;
    if(area===2&&!G.flags.vent){gr=.9;gg=1.05;gb=.8;gfr=8;gfg=14;gfb=0;}
    const mr=b*tn[0]*ff*gr,mgn=b*tn[1]*ff*gg,mb=b*tn[2]*ff*gb,fr=fc[0]*(1-ff)+gfr*(1-ff),fg=fc[1]*(1-ff)+gfg*(1-ff),fb=fc[2]*(1-ff)+gfb*(1-ff);

      buf[y*SW+x]=0xFF000000|((bl>255?255:bl)<<16)|((g>255?255:g)<<8)|(r>255?255:r);
    }
    // 天井・空
    for(let y=y0-1;y>=0;y--){
      const dist=Math.min(rowDist[y],200);
      const wx=px+rdx*dist,wy=py+rdy*dist,cxx=Math.floor(wx),cyy=Math.floor(wy);
      const ci=(cyy<0?0:cyy>=MH?MH-1:cyy)*MW+(cxx<0?0:cxx>=MW?MW-1:cxx),fl=FL[ci],a=areaOf(fl);
      let r,g,bl;

      const ci=(cyy<0?0:cyy>=MH?MH-1:cyy)*MW+(cxx<0?0:cxx>=MW?MW-1:cxx),fl=FL[ci],a=areaOf(fl);
      const c=FT[fl][(((wy*64)|0)&63)*64+(((wx*64)|0)&63)];
      const f2=rowFog[a*SH+y],bb=Math.min(1.5,AMB[a]+LM[ci]+rowTor[y]*tcone[x]),t2=TINT[a],fc2=FOGC[a];
      let r=(c&255)*bb*t2[0]*f2+fc2[0]*(1-f2),g=((c>>8)&255)*bb*t2[1]*f2+fc2[1]*(1-f2),bl=((c>>16)&255)*bb*t2[2]*f2+fc2[2]*(1-f2);

    }
  }
  // スプライト収集
  sprites.length=0;
  for(const p of PROPS0){const d=hyp(p.x-px,p.y-py);if(d>16)continue;const S=SPR[p.t];if(!S)continue;
    const h=p.t==='lamp'?.95:p.t==='lantern'?.5:p.t==='jizo'?.4:p.t==='barrel'?.32:p.t==='corpse'?.22:.3;pushSpr(S,p.x,p.y,h,0);}

    const h=it.t==='lever'?.55:.2;pushSpr(S,it.x,it.y,h,it.t==='lever'?0:.02+Math.sin(G.t*3+it.x)*.01,1);}
  for(const z of G.zombies){

  // メッセージ
  let my=VH-170;
  for(let i=G.msg.length-1;i>=0;i--){const m=G.msg[i],a=clamp(1-(m.age-m.d+.7)/.7,0,1);ctx.globalAlpha=a;otext(m.t,VW/2,my,19,'#f2efe0','center');ctx.globalAlpha=1;my-=28;}
  if(G.hint)otext(G.hint,VW/2,VH/2+60,22,'#ffe08a');
  // ダメージ
  if(G.hurt>0){ctx.fillStyle='rgba(180,0,0,'+G.hurt*.5+')';ctx.fillRect(0,0,VW,VH);}
  if(G.hp<33&&G.hp>0){ctx.fillStyle='rgba(120,0,0,'+(.1+.07*Math.sin(G.t*6))+')';ctx.fillRect(0,0,VW,VH);}
  // ミニマップ(Tab)
  if(keys.Tab){
    const s=5,ox=VW-MW*s-14,oy=14;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(ox-4,oy-4,MW*s+8,MH*s+8);
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(!SEEN[ID(x,y)])continue;const w=WL[ID(x,y)];ctx.fillStyle=w?(DOORS[ID(x,y)]?'#c8a040':'#6a6a62'):'#2a3a2a';ctx.fillRect(ox+x*s,oy+y*s,s,s);}
    for(const z of G.zombies)if(z.hp>0&&SEEN[ID(Math.floor(z.x),Math.floor(z.y))]){ctx.fillStyle='#d44';ctx.fillRect(ox+z.x*s-1,oy+z.y*s-1,3,3);}
    ctx.fillStyle='#fff';ctx.fillRect(ox+P.x*s-2,oy+P.y*s-2,4,4);ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(ox+P.x*s,oy+P.y*s);ctx.lineTo(ox+P.x*s+Math.cos(P.yaw)*8,oy+P.y*s+Math.sin(P.yaw)*8);ctx.stroke();
  }else otext('[Tab] マップ',VW-24,24,12,'#a8b090','right');
}
function wrapText(t,w,size){ctx.font=size+'px '+FONT;const out=[];for(const para of t.split('\n')){let line='';for(const ch of para){if(ctx.measureText(line+ch).width>w){out.push(line);line=ch;}else line+=ch;}out.push(line);}return out;}
function drawDoc(){
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,VW,VH);
  const w=640,h=380,x=(VW-w)/2,y=(VH-h)/2;
  ctx.fillStyle='#d6cba6';ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(90,60,20,.12)';for(let i=0;i<30;i++)ctx.fillRect(x+Math.sin(i*7.3)*300+300,y+(i*37)%h,40,10);
  ctx.strokeStyle='#5a4628';ctx.lineWidth=3;ctx.strokeRect(x+10,y+10,w-20,h-20);
  ctx.fillStyle='#2a1f12';ctx.font='bold 26px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(G.doc.title,VW/2,y+46);
  ctx.fillRect(x+40,y+68,w-80,2);
  ctx.textAlign='left';ctx.font='20px '+FONT;const lines=wrapText(G.doc.text,w-100,20);lines.forEach((l,i)=>ctx.fillText(l,x+50,y+104+i*29));
  ctx.fillStyle='rgba(90,40,20,.8)';ctx.font='bold 16px '+FONTS;ctx.textAlign='center';ctx.fillText('[E / Enter] 閉じる',VW/2,y+h-26);
}
function drawTitle(){
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,VW,VH);
  const fl=Math.sin(G.t*19)>.94?3:0;
  ctx.save();ctx.translate(VW/2,128);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 118px '+FONT;ctx.fillStyle='rgba(150,10,10,.7)';ctx.fillText('鉛ヶ沢',-3+fl,3);ctx.fillStyle='rgba(30,150,120,.35)';ctx.fillText('鉛ヶ沢',3-fl,-2);ctx.fillStyle='#e8e2d0';ctx.fillText('鉛ヶ沢',0,0);ctx.restore();
  otext('屍人の夜  ―  NIGHT OF THE HOLLOW',VW/2,206,24,'#c8c4b0','center','rgba(0,0,0,.9)',FONT);
  otext('山奥の鉱山町を毒の霧が呑んだ夜、町の人々は屍人と化した。',VW/2,262,17,'#d8d4c0','center','rgba(0,0,0,.9)',FONT);
  otext('ガスに耐性を持つ大学生・朝倉 蓮は、一人、生き残った――。',VW/2,288,17,'#d8d4c0','center','rgba(0,0,0,.9)',FONT);
  if(Math.floor(G.t*1.5)%2===0)otext('なにかキーを おして スタート',VW/2,VH-176,30,'#ffe08a');
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(VW/2-370,VH-146,740,116);
  otext('WASD いどう / ←→・マウス みまわす / Shift はしる / Space・クリック うつ / R そうてん',VW/2,VH-124,16,'#e0e4d0');
  otext('E しらべる・拾う / H 薬草 / F 懐中電灯 / Tab マップ / P ポーズ / M おと',VW/2,VH-98,16,'#e0e4d0');
  otext('鍵と手がかりを集め、坑道の換気装置を復旧して脱出せよ。音と光に屍人は集まる。',VW/2,VH-68,16,'#b8c0a8');
  otext('ただいま デモプレイ中',VW/2,VH-44,13,'rgba(255,255,255,.5)');
}
function drawIntro(){
  if(G.intro<=0)return;const a=Math.min(1,G.intro/1.5);ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,VH/2-120,VW,200);
  otext('夏休み、山奥の鉱山町・鉛ヶ沢。',VW/2,VH/2-70,24,'#e8e4d0','center','rgba(0,0,0,.9)',FONT);
  otext('目を覚ますと、町は静まり返っていた。',VW/2,VH/2-30,24,'#e8e4d0','center','rgba(0,0,0,.9)',FONT);
  otext('廊下の向こうで――何かが、うめいている。',VW/2,VH/2+10,24,'#d8a0a0','center','rgba(0,0,0,.9)',FONT);
  otext('目的を見つけ、生きてこの町を出ろ。',VW/2,VH/2+54,20,'#ffe08a');
  ctx.globalAlpha=1;
}
function draw(){
  ctx.imageSmoothingEnabled=true;
  render();ctx.drawImage(rc,0,0,VW,VH);
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.1;ctx.drawImage(noiseC[Math.floor(G.t*24)%3],Math.floor(rnd()*-64),Math.floor(rnd()*-64),VW+128,VH+128);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.3,VW/2,VH/2,VH*.88);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.66)');ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(0,0,0,.06)';for(let y=0;y<VH;y+=3)ctx.fillRect(0,y,VW,1);
  if(G.flash>.05&&G.scene==='play'){ctx.fillStyle='rgba(255,230,160,'+G.flash*.5+')';ctx.fillRect(0,0,VW,VH);}
  drawHUD();
  drawIntro();
  if(G.scene==='dead'){
    const a=Math.min(.85,G.deadT*.5);ctx.fillStyle='rgba(60,0,0,'+a+')';ctx.fillRect(0,0,VW,VH);
    if(G.deadT>.6){otext('死亡',VW/2,VH/2-30,96,'#c02820','center','rgba(0,0,0,.9)',FONT);otext('YOU DIED',VW/2,VH/2+40,26,'#d8c0b0');}
    if(G.deadT>1.6&&G.mode==='play'&&Math.floor(G.t*2)%2===0)otext('Enter : 直前の地点からやり直す   Esc : タイトルへ',VW/2,VH-80,24,'#ffe08a');
  }
  if(G.scene==='clear'){
    ctx.fillStyle='rgba(235,240,230,'+Math.min(.92,G.clearT*.25)+')';ctx.fillRect(0,0,VW,VH);
    const a=clamp(G.clearT-1,0,1);ctx.globalAlpha=a;
    otext('脱出成功',VW/2,VH/2-90,90,'#18302a','center','rgba(255,255,255,.9)',FONT);
    otext('避難口の向こうに、朝の光が差していた。',VW/2,VH/2-10,28,'#222','center','rgba(255,255,255,.9)',FONT);
    otext('倒した屍人 '+G.stats.kills+' 体   所要時間 '+Math.floor(G.stats.time/60)+'分'+Math.floor(G.stats.time%60)+'秒',VW/2,VH/2+50,24,'#333','center','rgba(255,255,255,.9)');
    if(G.mode==='play'&&G.clearT>2&&Math.floor(G.t*2)%2===0)otext('Enter / Space : タイトルへ',VW/2,VH-70,26,'#18302a','center','rgba(255,255,255,.9)');
    ctx.globalAlpha=1;
  }
  if(G.doc)drawDoc();
  if(G.mode==='demo')drawTitle();
  if(G.fade>0){ctx.fillStyle='rgba(0,0,0,'+G.fade+')';ctx.fillRect(0,0,VW,VH);}
  if(G.paused){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,VW,VH);otext('ポーズ中',VW/2,VH/2-20,64,'#fff');otext('P キー か クリックで さいかい',VW/2,VH/2+44,22,'#cfd5c0');}
}

/* ================= メイン更新 ================= */
function newGame(mode){
  G.mode=mode;G.scene='play';G.paused=false;G.fade=1;
  newWorld();bot.seq=0;bot.tgt=null;
  G.cp=null;checkpoint();
  G.intro=mode==='play'?7:0;
  for(const k in keys)keys[k]=false;
}
function update(dt){
  G.t+=dt;G.shake*=Math.exp(-6*dt);G.flash=Math.max(0,G.flash-dt);G.hurt=Math.max(0,G.hurt-dt);G.kick=Math.max(0,G.kick-dt*5);
  if(G.paused||G.doc)return;
  G.fade=Math.max(0,G.fade-dt/1.2);G.intro=Math.max(0,G.intro-dt);G.lockMsgT=Math.max(0,G.lockMsgT-dt);
  for(const m of G.msg)m.age+=dt;G.msg=G.msg.filter(m=>m.age<m.d);
  updateEcg(dt);
  if(G.scene==='dead'){G.deadT+=dt;updateZombies(dt*.5);if(G.mode==='demo'&&G.deadT>3.5){newGame('demo');}return;}
  if(G.scene==='clear'){G.clearT+=dt;if(G.mode==='demo'&&G.clearT>8)newGame('demo');return;}
  G.stats.time+=dt;
  G.fireCd=Math.max(0,G.fireCd-dt);
  if(G.autoRel>0){G.autoRel-=dt;if(G.autoRel<=0&&G.mag===0)startReload();}
  if(G.reload>0){G.reload-=dt;if(G.reload<=0){const n=Math.min(8-G.mag,G.res);G.mag+=n;G.res-=n;}}
  let inp;
  if(G.mode==='play'){
    const k=keys;
    inp={fwd:(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0),strafe:(k.KeyD?1:0)-(k.KeyA?1:0),turn:(k.ArrowRight||k.KeyE&&false?1:0)-(k.ArrowLeft?1:0),run:!!(k.ShiftLeft||k.ShiftRight),fire:!!(k.Space||mouse.down||k.KeyZ),use:!!G.useReq};
    G.useReq=false;
  }else{inp=botInput(dt);}
  playerStep(dt,inp);
  updateZombies(dt);
  if(G.hp<100&&G.mode==='demo')G.hp=Math.min(100,G.hp+2*dt);
}

/* ================= ループ ================= */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(.1,(now-last)/1000);last=now;
  while(acc>=1/60){update(1/60);acc-=1/60;}
  draw();requestAnimationFrame(frame);
}
newGame('demo');
requestAnimationFrame(frame);
window.__g={G,P,keys,newGame,step(n){for(let i=0;i<n;i++)update(1/60);draw();},items:()=>G.items,zombies:()=>G.zombies,WL,FL,bfs,openDoor,pickup,say};
})();
</script>
