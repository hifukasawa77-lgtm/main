  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(ev.code))ev.preventDefault();
  if(ev.repeat)return;
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  if(ev.code==='KeyM'){muted=!muted;if(windG)windG.gain.value=muted?0:.08;return;}
  if(ev.metaKey||ev.ctrlKey||ev.altKey||ev.code.startsWith('F')&&ev.code!=='KeyF')return;
  if(G.mode==='demo'){newGame('play');keys[ev.code]=true;return;}
  if(G.doc){if(ev.code==='KeyE'||ev.code==='Enter'||ev.code==='Escape'||ev.code==='Space'){G.doc=null;sfx.paper();}return;}
  if(G.scene==='dead'&&G.deadT>1.6&&(ev.code==='Enter'||ev.code==='Space')){respawn();return;}
  if(G.scene==='clear'&&G.clearT>2&&(ev.code==='Enter'||ev.code==='Space')){newGame('demo');return;}
  if(ev.code==='KeyP'||(ev.code==='Escape'&&!locked)){G.paused=!G.paused;return;}
  if(ev.code==='Escape'&&G.scene==='dead'){newGame('demo');return;}
  keys[ev.code]=true;
  if(ev.code==='KeyF')G.torch=!G.torch;
  if(ev.code==='KeyR')startReload();
  if(ev.code==='KeyQ')cycleWeapon(-1);
  if(ev.code==='KeyC')cycleWeapon(1);
  if(ev.code==='KeyH')useHerb();
  if(ev.code==='KeyE')G.useReq=true;
});
addEventListener('keyup',ev=>{keys[ev.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const k in keys)keys[k]=false;mouse.down=false;}});
cv.addEventListener('mousedown',ev=>{
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  if(G.mode==='demo'){newGame('play');return;}
  if(G.paused){G.paused=false;}
  try{if(document.pointerLockElement!==cv)cv.requestPointerLock();}catch(e){}
  if(ev.button===0)mouse.down=true;
});
addEventListener('mouseup',ev=>{if(ev.button===0)mouse.down=false;});
cv.addEventListener('wheel',ev=>{ev.preventDefault();if(G.mode==='play'&&G.scene==='play'&&!G.paused)cycleWeapon(ev.deltaY>0?1:-1);},{passive:false});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;});
document.addEventListener('mousemove',ev=>{if(document.pointerLockElement===cv&&G.mode==='play'&&!G.paused&&!G.doc&&G.scene==='play'){P.yaw+=ev.movementX*.0023;P.pitch=clamp((P.pitch||0)-ev.movementY*.45,-90,100);}});


/* ================= タッチ操作(スマホ・横画面) ================= */
const TV={fwd:0,strafe:0,run:false,fire:false,look:0};let touchMode=false;
(function(){
  const tc=document.getElementById('tc'),zl=document.getElementById('tcL'),zr=document.getElementById('tcR');
  const stick=document.getElementById('stick'),knob=document.getElementById('knob');
  const $=id=>document.getElementById(id);
  function enable(){if(touchMode)return;touchMode=true;document.body.classList.add('touch');orient();}
  function orient(){document.body.classList.toggle('portrait',innerHeight>innerWidth);}
  if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)enable();
  addEventListener('touchstart',enable,{passive:true,once:true});
  addEventListener('resize',orient);addEventListener('orientationchange',()=>setTimeout(()=>{orient();fit();},200));
  let fsTried=false;
  function lockLandscape(){
    if(fsTried)return;fsTried=true;
    try{const e=document.documentElement;const r=e.requestFullscreen?e.requestFullscreen():null;
      const lk=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(_){}};
      if(r&&r.then)r.then(lk).catch(()=>{});else lk();}catch(_){}
  }
  // 画面状態を進めるタップ(タイトル・手記・死亡・クリア・ポーズ)
  function tapAdvance(){
    audioInit();if(AC&&AC.state==='suspended')AC.resume();lockLandscape();
    if(G.mode==='demo'){newGame('play');return true;}
    if(G.paused){G.paused=false;return true;}
    if(G.doc){G.doc=null;sfx.paper();return true;}
    if(G.scene==='dead'&&G.deadT>1.6){respawn();return true;}
    if(G.scene==='clear'&&G.clearT>2){newGame('demo');return true;}
    return false;
  }
  // 左: 移動スティック
  let sid=null,sx=0,sy=0;const R=55;
  zl.addEventListener('pointerdown',e=>{e.preventDefault();if(tapAdvance())return;if(sid!==null)return;sid=e.pointerId;zl.setPointerCapture(sid);sx=e.clientX;sy=e.clientY;
    stick.style.display='block';stick.style.left=sx+'px';stick.style.top=sy+'px';knob.style.transform='translate(0,0)';});
  zl.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;let dx=e.clientX-sx,dy=e.clientY-sy;const l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}
    knob.style.transform='translate('+dx+'px,'+dy+'px)';const m=Math.hypot(dx,dy)/R;
    if(m<.18){TV.fwd=0;TV.strafe=0;TV.run=false;}else{TV.strafe=dx/R;TV.fwd=-dy/R;TV.run=m>.95||TV.runBtn;}});
  const endS=e=>{if(e.pointerId!==sid)return;sid=null;TV.fwd=0;TV.strafe=0;TV.run=false;stick.style.display='none';};
  zl.addEventListener('pointerup',endS);zl.addEventListener('pointercancel',endS);
  // 右: ドラッグで視点
  let lid=null,lx=0;
  zr.addEventListener('pointerdown',e=>{e.preventDefault();if(tapAdvance())return;if(lid!==null)return;lid=e.pointerId;zr.setPointerCapture(lid);lx=e.clientX;});
  zr.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;const dx=e.clientX-lx;lx=e.clientX;
    if(G.mode==='play'&&!G.paused&&!G.doc&&G.scene==='play')P.yaw+=dx*.0065;});
  const endL=e=>{if(e.pointerId===lid)lid=null;};
  zr.addEventListener('pointerup',endL);zr.addEventListener('pointercancel',endL);
  // ボタン
  function hold(id,on,off){const b=$(id);let pid=null;
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(tapAdvance())return;pid=e.pointerId;b.setPointerCapture(pid);b.classList.add('on');on();});
    const up=e=>{if(e.pointerId!==pid)return;pid=null;b.classList.remove('on');off&&off();};
    b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);}
  function tap(id,fn){hold(id,()=>{if(G.mode==='play'&&G.scene==='play')fn();},null);}
  hold('bFire',()=>{TV.fire=true;},()=>{TV.fire=false;});
  hold('bRun',()=>{TV.runBtn=true;if(sid!==null&&(TV.fwd||TV.strafe))TV.run=true;},()=>{TV.runBtn=false;});
  tap('bUse',()=>{G.useReq=true;});tap('bRel',startReload);tap('bHerb',useHerb);tap('bWpn',()=>cycleWeapon(1));
  tap('bTorch',()=>{G.torch=!G.torch;});
  hold('bMap',()=>{keys.Tab=true;},()=>{keys.Tab=false;});
  hold('bPause',()=>{if(G.mode==='play'&&G.scene==='play')G.paused=true;},null);
  // ブラウザ既定のスクロール・ズームを止める
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('contextmenu',e=>e.preventDefault());
  // 画面が隠れたらスティック等を放す
  document.addEventListener('visibilitychange',()=>{TV.fwd=TV.strafe=0;TV.run=TV.fire=false;});
})();

/* ================= 判定・移動 ================= */
function solidAt(x,y){const cx=Math.floor(x),cy=Math.floor(y);if(cx<0||cy<0||cx>=MW||cy>=MH)return true;return WL[cy*MW+cx]!==0;}
function blockedC(x,y,r){return solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r);}
function doorAt(cx,cy){return DOORS[ID(cx,cy)];}
function openDoor(cx,cy,byBot){
  const d=doorAt(cx,cy),t=WL[ID(cx,cy)];if(!d)return false;
  if(t===0)return false;
  if(t===18){
    if(G.flags.vent){doClear();return true;}
    if(G.lockMsgT<=0){say('避難口の扉は固く閉ざされている。換気が止まったままだ……',4);sfx.lock();G.lockMsgT=2;}return false;
  }
  if(d.key&&!G.keys[d.key]){if(G.lockMsgT<=0){say(d.lock,3);sfx.lock();G.lockMsgT=1.6;}return false;}
  WL[ID(cx,cy)]=0;sfx.door();
  if(d.key){say('鍵を使った。扉が開いた。',3);checkpoint();}
  return true;
}
function movePlayer(dx,dy){
  const r=.38;
  let nx=P.x+dx;if(!blockedC(nx,P.y,r))P.x=nx;else tryBump(nx,P.y,dx,0);
  let ny=P.y+dy;if(!blockedC(P.x,ny,r))P.y=ny;else tryBump(P.x,ny,0,dy);
}
function tryBump(x,y,dx,dy){
  const sx=dx>0?x+.39:dx<0?x-.39:x,sy=dy>0?y+.39:dy<0?y-.39:y,cx=Math.floor(sx),cy=Math.floor(sy);
  if(cx>=0&&cy>=0&&cx<MW&&cy<MH&&DOORS[ID(cx,cy)]&&WL[ID(cx,cy)])openDoor(cx,cy);
}
function moveZ(z,dx,dy){
  const r=.28;
  let nx=z.x+dx;if(!blockedC(nx,z.y,r))z.x=nx;
  let ny=z.y+dy;if(!blockedC(z.x,ny,r))z.y=ny;
}

/* ================= BFS ================= */
const QBUF=new Int32Array(MW*MH);
function bfs(tx,ty,forBot){
  const d=new Int16Array(MW*MH).fill(-1);let h=0,t=0;
  const s=ID(Math.floor(tx),Math.floor(ty));d[s]=0;QBUF[t++]=s;
  while(h<t){
    const c=QBUF[h++],cx=c%MW,cy=(c/MW)|0,dc=d[c];
    for(let k=0;k<8;k++){
      const ox=[1,-1,0,0,1,1,-1,-1][k],oy=[0,0,1,-1,1,-1,1,-1][k],nx=cx+ox,ny=cy+oy;
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const n=ID(nx,ny);if(d[n]>=0)continue;
      if(!cellPass(n,forBot))continue;
      if(ox&&oy&&(!cellPass(ID(cx+ox,cy),forBot)||!cellPass(ID(cx,cy+oy),forBot)))continue;
      d[n]=dc+1;QBUF[t++]=n;
    }
  }
  return d;
}
function cellPass(n,forBot){
  const w=WL[n];if(w===0)return true;if(!forBot)return false;
  const dd=DOORS[n];if(!dd)return false;
  if(w===18)return G.flags.vent;
  return !dd.key||!!G.keys[dd.key];
}
function stepDir(field,x,y){
  const cx=Math.floor(x),cy=Math.floor(y);let best=null,bd=field[ID(cx,cy)];if(bd<0)return null;
  for(let k=0;k<8;k++){
    const ox=[1,-1,0,0,1,1,-1,-1][k],oy=[0,0,1,-1,1,-1,1,-1][k],nx=cx+ox,ny=cy+oy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const v=field[ID(nx,ny)];if(v<0||v>=bd)continue;
    if(ox&&oy&&(field[ID(cx+ox,cy)]<0||field[ID(cx,cy+oy)]<0))continue;
    bd=v;best=[nx+.5,ny+.5];
  }
  return best;
}

/* ================= アイテム・戦闘 ================= */
function cycleWeapon(dir){
 const list=['fists',...WEAPON_ORDER.filter(id=>G.owned.includes(id))];
 if(G.punchT>0||G.weaponActionT>0)return;
 equipWeapon(list[(list.indexOf(G.weapon)+dir+list.length)%list.length]);
 say('装備: '+(WEAPONS[G.weapon]?.name||'素手'),1.5);
}
function startReload(){
 const w=WEAPONS[G.weapon];if(!w||w.kind!=='gun'||G.reload>0)return;
 const mag=w===WEAPONS.shotgun?G.shellMag:G.mag,res=w===WEAPONS.shotgun?G.shellRes:G.res;
 if(mag>=w.capacity||res<=0)return;G.reloadWeapon=G.weapon;G.reload=w===WEAPONS.shotgun?1.9:1.4;sfx.reload();
}
function useHerb(){if(G.herb<=0){say('薬草がない。');return;}if(G.hp>=100){say('体力は満タンだ。');return;}G.herb--;G.hp=Math.min(100,G.hp+50);sfx.herb();say('薬草を使った。');}
function pickup(it){
  it.taken=true;
  if(it.t==='herb'){G.herb++;say('薬草を手に入れた。(H で使う)');sfx.pick();}
  else if(it.t==='ammo'){G.res+=8;say('拳銃の弾を手に入れた。+8');sfx.pick();if(G.gun&&G.mag===0)startReload();}
  else if(it.t==='shells'){G.shellRes+=4;say('散弾銃の弾を手に入れた。+4');sfx.pick();}
  else if(it.t==='weapon'){
    if(!G.owned.includes(it.id))G.owned.push(it.id);
    equipWeapon(it.id);if(it.id==='shotgun'){G.shellMag=4;G.shellRes+=4;}
    say(WEAPONS[it.id].name+'を手に入れた。Q/C またはホイールで切り替え',4);sfx.pick();checkpoint();
  }
  else if(it.t==='key'){G.keys[it.id]=1;say(it.name+'を手に入れた。',4);sfx.pick();checkpoint();}
  else if(it.t==='pistol'){G.gun=true;G.mag=8;G.res+=8;if(!G.owned.includes('pistol'))G.owned.push('pistol');equipWeapon('pistol');say('拳銃を手に入れた!(Space/クリックで撃つ・R 装填)',5);sfx.pick();checkpoint();}
  else if(it.t==='fuse'){G.fuse=1;say('ヒューズを手に入れた。換気室のレバーに使えそうだ。',4);sfx.pick();checkpoint();}
  else if(it.t==='note'){G.notes[it.id]=1;G.doc=NOTES[it.id];sfx.paper();}
}
function interact(){
  for(const it of G.items){
    if(it.taken)continue;
    const d=hyp(it.x-P.x,it.y-P.y);if(d>1.4)continue;
    if(Math.abs(angDiff(P.yaw,Math.atan2(it.y-P.y,it.x-P.x)))>1.1&&d>.8)continue;
    if(it.t==='lever'){
      if(!G.fuse){say('レバーの基部にヒューズがない。',3);sfx.lock();return true;}
      if(!G.flags.vent){G.flags.vent=true;it.taken=true;G.fuse=0;say('ヒューズをはめ、レバーを引いた。換気装置が唸りを上げて動き出した!',5);sfx.lever();G.shake=8;checkpoint();return true;}
    }else if(it.t==='note'||it.t==='key'||it.t==='pistol'||it.t==='fuse'||it.t==='herb'||it.t==='ammo'||it.t==='weapon'||it.t==='shells'){pickup(it);return true;}
  }
  for(const b of LANDMARKS){
    if(!WL[ID(b.x,b.y)])continue;
    const dx=b.x+.5-P.x,dy=b.y+.5-P.y,d=hyp(dx,dy);
    if(d<1.6&&(d<.8||Math.abs(angDiff(P.yaw,Math.atan2(dy,dx)))<1.1))return openDoor(b.x,b.y);
  }
  return false;
}
function punch(forceFists=false){
  if(G.fireCd>0||G.equipT>0)return;
  const w=forceFists?null:WEAPONS[G.weapon];
  G.attackWeapon=w?G.weapon:'fists';G.attackDuration=w?.cooldown||.48;G.fireCd=G.attackDuration;G.punchT=G.attackDuration;G.kick=.35;sfx.punch();
  G.pendingPunch=true;
}
function resolvePunch(w){
  const fx=Math.cos(P.yaw),fy=Math.sin(P.yaw);let best=null,bd=9;
  for(const z of G.zombies){
    if(z.hp<=0)continue;const dx=z.x-P.x,dy=z.y-P.y,d=hyp(dx,dy);
    if(d>(w?.reach||1.25)||d<.01)continue;if(Math.abs(angDiff(P.yaw,Math.atan2(dy,dx)))>.75)continue;
    if(d<bd){bd=d;best=z;}
  }
  if(!best)return;
  const crit=rnd()<.15,dmg=(w?.damage||1)+(crit?1:0);best.hp-=dmg;best.hit=.25;best.stun=.5;best.state='chase';best.ct=0;best.alert=3;best.atk=Math.max(best.atk,.5);
  sfx.hit();G.shake=Math.max(G.shake,4);
  const dd=hyp(best.x-P.x,best.y-P.y)||1;moveZ(best,(best.x-P.x)/dd*.55,(best.y-P.y)/dd*.55);
  if(crit)say('クリーンヒット!',1.2);
  if(best.hp<=0){best.state='dead';best.hp=0;G.stats.kills++;sfx.zdie();}
  else if(AC&&rnd()<.4)groan(.5);
}
function fire(){
  const w=WEAPONS[G.weapon];if(!w||w.kind!=='gun'){punch();return;}
  if(G.fireCd>0||G.reload>0||G.equipT>0)return;
  const shotgun=G.weapon==='shotgun',mag=shotgun?G.shellMag:G.mag,res=shotgun?G.shellRes:G.res;
  if(mag<=0){sfx.empty();G.fireCd=.35;if(res>0)startReload();else say('弾がない!',2);return;}
  if(shotgun)G.shellMag--;else G.mag--;
  G.weaponAction=G.weapon;G.weaponActionDuration=shotgun?.58:.28;G.weaponActionT=G.weaponActionDuration;
  G.fireCd=w.cooldown;G.kick=1;G.flash=.12;G.shake=Math.max(G.shake,shotgun?5:2.5);sfx.shot();
  // 銃声で周囲が気づく
  for(const z of G.zombies)if(z.hp>0&&hyp(z.x-P.x,z.y-P.y)<9){z.alert=Math.max(z.alert,3);}
  // ヒットスキャン
  const fx=Math.cos(P.yaw),fy=Math.sin(P.yaw);let best=null,bd=1e9;const hits=[];
  for(const z of G.zombies){
    if(z.hp<=0)continue;const dx=z.x-P.x,dy=z.y-P.y,al=dx*fx+dy*fy;if(al<.2||al>w.reach)continue;
    const lat=Math.abs(-dx*fy+dy*fx);if(lat>(shotgun?.75:(z.boss?.4:.28)))continue;
    if(!losGrid(P.x,P.y,z.x,z.y))continue;
    if(shotgun)hits.push({z,d:al});
    else if(al<bd){bd=al;best=z;}
  }
  if(!shotgun&&best)hits.push({z:best,d:bd});
  hits.sort((a,b)=>a.d-b.d);
  for(const {z,d} of hits.slice(0,shotgun?3:1)){
    const crit=rnd()<.18,dmg=w.damage+(shotgun&&d<4?2:0)+(crit?1:0);z.hp-=dmg;z.hit=.25;z.stun=.35;z.alert=4;z.state='chase';z.ct=0;sfx.hit();
    if(crit)say('ヘッドショット!',1.2);
    if(z.hp<=0){z.state='dead';z.hp=0;G.stats.kills++;sfx.zdie();}
    else if(AC&&rnd()<.4)groan(.6);
  }
  if((shotgun?G.shellMag:G.mag)===0&&res>0)G.autoRel=.35;
}
function hurtPlayer(d,boss){
  const dm=G.mode==='demo'?d*.25:d;G.hp-=dm;G.hurt=.5;G.flash=0;G.shake=Math.max(G.shake,boss?9:5);sfx.hurt();
  if(G.hp<=0&&G.scene==='play'){G.hp=0;G.scene='dead';G.deadT=0;sfx.die();
    if(G.mode==='demo'){/* デモは自動で再開 */}}
}
function doClear(){G.scene='clear';G.clearT=0;sfx.clear();}
function respawn(){
  if(G.cp){restore(G.cp);G.scene='play';G.hp=Math.max(G.hp,70);G.fade=1;}else newGame('play');
}

/* ================= 屍人AI ================= */
function updateZombies(dt){
  G.fieldT-=dt;
  if(G.fieldT<=0){G.fieldT=.4;G.field=bfs(P.x,P.y,false);}
  G.nextGroan-=dt;
  for(const z of G.zombies){
    if(z.hp<=0){continue;}
    if(z.hitT>0){z.hitT-=dt;if(z.hitT<=0&&hyp(P.x-z.x,P.y-z.y)<1.25&&G.scene==='play')hurtPlayer(z.boss?22:11,z.boss);}
    z.hit=Math.max(0,z.hit-dt);z.stun=Math.max(0,z.stun-dt);z.atk=Math.max(0,z.atk-dt);z.atkAnim=Math.max(0,z.atkAnim-dt);z.alert=Math.max(0,z.alert-dt);
    const dx=P.x-z.x,dy=P.y-z.y,d=hyp(dx,dy);
    const near=d<22;
    if(!near&&z.state!=='chase')continue;
    const see=d<(G.torch?8:5.5)&&losGrid(z.x,z.y,P.x,P.y);
    const sneakTooClose=d<2&&see;
    if(z.state==='idle'){
      if((see&&d<(G.torch?6.5:4.5))||sneakTooClose||z.alert>0){z.state='chase';z.lost=0;z.ct=0;if(near&&d<16&&G.nextGroan<=0){groan(clamp(1-d/16,.2,1));G.nextGroan=2+rnd()*3;}}
      else{ // うろうろ
        z.wt-=dt;if(z.wt<=0){z.wt=2+rnd()*3;z.wx=z.home[0]+(rnd()-.5)*3;z.wy=z.home[1]+(rnd()-.5)*3;}
        const wx=z.wx-z.x,wy=z.wy-z.y,wd=hyp(wx,wy);if(wd>.3){const s=.35*dt;moveZ(z,wx/wd*s,wy/wd*s);z.face=Math.atan2(wy,wx);z.pose=1;}else z.pose=0;
      }
    }else if(z.state==='chase'){
      if(see){z.lost=0;}else z.lost+=dt;
      z.ct+=dt;
      if((z.lost>2.5&&d>4.5)||(z.ct>10&&d>3)||(d>14)){z.state='idle';z.ct=0;z.alert=0;continue;}
      if(d<1.0){
        z.pose=2;
        if(z.atk<=0&&z.stun<=0){z.atk=z.boss?1.6:1.4;z.atkAnim=.45;z.hitT=.26;}
      }else{
        let tx,ty;
        if(see&&d<8){tx=P.x;ty=P.y;}

  let mx=fx*inp.fwd+rx*inp.strafe,my=fy*inp.fwd+ry*inp.strafe;const l=hyp(mx,my);if(l>1){mx/=l;my/=l;}

  movePlayer(P.vx*dt,P.vy*dt);

const bot={tgt:null,field:null,fieldT:0,seq:0,wob:0,use:0,t:0,stuck:0,lx:0,ly:0};
const BOT_SEQ=[ ['key','police'],['pistol'],['key','office'],['key','gate'],['fuse'],['lever'],['exit'] ];
function botTarget(){
  for(;bot.seq<BOT_SEQ.length;bot.seq++){
    const s=BOT_SEQ[bot.seq];

    const it=G.items.find(i=>i.t===s[0]&&(!s[1]||i.id===s[1])&&!i.taken);

function botInput(dt){
  const inp={fwd:0,strafe:0,turn:0,run:0,fire:false,use:false};
  if(G.gun&&G.weapon!=='pistol')G.weapon='pistol';
  bot.t+=dt;
  if(!bot.tgt||(bot.tgt.it&&bot.tgt.it.taken)){bot.tgt=botTarget();bot.fieldT=0;}
  // 戦う
  let foe=null,fd=99;
  for(const z of G.zombies){if(z.hp<=0)continue;const d=hyp(z.x-P.x,z.y-P.y);if(d<7&&d<fd&&losGrid(P.x,P.y,z.x,z.y)){foe=z;fd=d;}}
  if(foe&&!G.gun&&fd<1.2){const want=Math.atan2(foe.y-P.y,foe.x-P.x),d=angDiff(P.yaw,want);P.yaw+=clamp(d,-7*dt,7*dt);if(Math.abs(d)<.3)inp.fire=true;return inp;}
  if(foe&&G.gun&&G.mag>0){
    const want=Math.atan2(foe.y-P.y,foe.x-P.x),d=angDiff(P.yaw,want);P.yaw+=clamp(d,-6*dt,6*dt);
    if(Math.abs(d)<.12&&fd<6.5)inp.fire=true;

    return inp;
  }
  if(G.gun&&G.mag===0&&G.res>0)startReload();
  bot.fieldT-=dt;
  if(bot.fieldT<=0){bot.fieldT=.5;bot.field=bfs(bot.tgt.x,bot.tgt.y,true);}
  const st=bot.field?stepDir(bot.field,P.x,P.y):null;
  const dToT=hyp(bot.tgt.x-P.x,bot.tgt.y-P.y);
  let wx=bot.tgt.x,wy=bot.tgt.y;
  if(st&&dToT>.9){wx=st[0];wy=st[1];}
  let want=Math.atan2(wy-P.y,wx-P.x);if(bot.tgt.exit&&dToT<1.6)want=0;
  const d=angDiff(P.yaw,want);
  P.yaw+=clamp(d,-4.5*dt,4.5*dt)+Math.sin(bot.t*1.3)*.2*dt;
  inp.fwd=Math.abs(d)<.9?1:0;inp.run=foe?1:(dToT>6?1:0);
  if(dToT<1.0&&bot.tgt.it){inp.use=true;}
  if(bot.tgt.exit&&dToT<2){inp.fwd=1;}
  // 詰まり
  bot.stuck+=dt;if(bot.stuck>1.2){if(hyp(P.x-bot.lx,P.y-bot.ly)<.15){bot.fieldT=0;P.yaw+=1.4;}bot.lx=P.x;bot.ly=P.y;bot.stuck=0;}
  if(G.hp<40&&G.herb>0&&!foe)useHerb();
  return inp;
}

function newGame(mode){
  G.mode=mode;G.scene='play';G.paused=false;G.fade=1;
  newWorld();bot.seq=0;bot.tgt=null;
  G.cp=null;checkpoint();
  G.intro=mode==='play'?7:0;
  for(const k in keys)keys[k]=false;
}
function update(dt){
  G.equipT=Math.max(0,(G.equipT||0)-dt);G.weaponActionT=Math.max(0,(G.weaponActionT||0)-dt);
  G.t+=dt;G.punchT=Math.max(0,(G.punchT||0)-dt);
  // Resolve the unarmed hit on the full-extension frame, including slow frames.
  if(G.pendingPunch&&1-G.punchT/(G.attackDuration||.48)>=.43){G.pendingPunch=false;if(G.scene==='play'&&!G.paused&&!G.doc)resolvePunch(G.attackWeapon==='fists'?null:WEAPONS[G.attackWeapon]);}
  G.shake*=Math.exp(-6*dt);G.flash=Math.max(0,G.flash-dt);G.hurt=Math.max(0,G.hurt-dt);G.kick=Math.max(0,G.kick-dt*5);
  if(G.paused||G.doc)return;
  G.fade=Math.max(0,G.fade-dt/1.2);G.intro=Math.max(0,G.intro-dt);G.lockMsgT=Math.max(0,G.lockMsgT-dt);
  for(const m of G.msg)m.age+=dt;G.msg=G.msg.filter(m=>m.age<m.d);
  updateEcg(dt);
  if(G.scene==='dead'){G.deadT+=dt;updateZombies(dt*.5);if(G.mode==='demo'&&G.deadT>3.5){newGame('demo');}return;}
  if(G.scene==='clear'){G.clearT+=dt;if(G.mode==='demo'&&G.clearT>8)newGame('demo');return;}
  G.stats.time+=dt;
  G.fireCd=Math.max(0,G.fireCd-dt);
  if(G.autoRel>0){G.autoRel-=dt;if(G.autoRel<=0)startReload();}
  if(G.reload>0){G.reload-=dt;if(G.reload<=0){if(G.reloadWeapon==='shotgun'){const n=Math.min(4-G.shellMag,G.shellRes);G.shellMag+=n;G.shellRes-=n;}else{const n=Math.min(8-G.mag,G.res);G.mag+=n;G.res-=n;}G.reloadWeapon=null;}}
  let inp;
  if(G.mode==='play'){
    const k=keys;
    inp={fwd:clamp((k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0)+TV.fwd,-1,1),strafe:clamp((k.KeyD?1:0)-(k.KeyA?1:0)+TV.strafe,-1,1),turn:(k.ArrowRight||k.KeyE&&false?1:0)-(k.ArrowLeft?1:0),run:!!(k.ShiftLeft||k.ShiftRight||TV.run),fire:!!(k.Space||mouse.down||k.KeyZ||TV.fire),melee:!!k.KeyV,use:!!G.useReq};
    G.useReq=false;
  }else{inp=botInput(dt);}
  playerStep(dt,inp);
  updateZombies(dt);
  if(G.hp<100&&G.mode==='demo')G.hp=Math.min(100,G.hp+2*dt);
}

/* ================= ループ ================= */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(.1,(now-last)/1000);last=now;
  while(acc>=1/60){update(1/60);acc-=1/60;}
  draw();requestAnimationFrame(frame);
}

  else quad([x0,yy,total],[x1+1,yy,total],[x1+1,yy,0],[x0,yy,0],'#a9a393',FULL_BUILDING_ART[i]);
  MESH[MESH.length-1].frontFace={y:front,sign};
  // Physical balcony and projecting eaves follow the reference proportions.
  if([0,3,6].includes(i)){
   const z=total*.48;woodBox(x0+.5,front+sign*.36-.22,z,width-1,.44,.06);
   woodBox(x0+.5,front+sign*.58-.04,z+.4,width-1,.08,.06);
   for(let x=x0+.6;x<x1+.4;x+=.8)woodBox(x,front+sign*.58-.035,z,.07,.07,.43);
  }
  const porchZ=total*.30;gabledPorch(center,front+sign*.02,sign,width*.33,.6,porchZ);
  for(const x of [center-width*.14,center+width*.14])woodBox(x,front+sign*.5-.04,0,.08,.08,porchZ);
 }
}
function buildOutdoorObjects(){
 FIXTURE_COLLIDERS.length=0;
 const mapping={innDesk:'office-desk',lowTable:'low-table',futon:'futon',shoeCabinet:'wardrobe',postCounter:'reception-counter',clinicBed:'examination-bed',warehouseCrates:'shipping-crates',schoolDesk:'pupil-desk',sawBench:'sawmill-bench',shrineAltar:'shinto-altar',chair:'class-chair'};
 for(const p of PROPS0){
  const id=mapping[p.t];
  if(id){const model={...p,t:'generated-'+id,w:id==='examination-bed'?2:1.2,h:id==='futon'?.15:id==='shinto-altar'?1:.55,lift:0};buildFixedObject(model);p.fixedVolume=true;FIXTURE_COLLIDERS.push({x:p.x-model.w/2,y:p.y-.325,w:model.w,h:.65});}
  else if(['lamp','lantern','barrel','jizo','corpse'].includes(p.t)){
   const h=p.t==='lamp'?1.8:p.t==='lantern'?.55:p.t==='jizo'?.5:p.t==='corpse'?.18:.5,w=p.t==='corpse'?1.8:p.t==='lamp'?.35:.5,d=p.t==='corpse'?.6:.5;
   detailedRoomModel(p,p.t,p.x-w/2,p.y-d/2,0,w,d,h,1,surfaces(material('#71614a','wood')));if(p.t!=='corpse')FIXTURE_COLLIDERS.push({x:p.x-w/2,y:p.y-d/2,w,h:d});
  }
 }
}
function changeToVillage(building){
 saveActiveZone();const z=ZONE_CACHE.get('village');CURRENT_BUILDING=-1;CURRENT_FLOOR=0;CURRENT_ROOMS=[];CURRENT_PORTALS=[];
 WL.set(z.wl);FL.set(z.fl);SEEN.set(z.seen);replaceDoorMap(z.doors);G.items=z.items;G.zombies=z.zombies;
 LANDMARKS.splice(0,LANDMARKS.length,...OLD_LANDMARKS.map(b=>({...b})));PROPS0.splice(0,PROPS0.length,...OLD_PROPS.filter(p=>!OLD_BOUNDARIES.some(([a,b,c,d])=>p.x>=a&&p.x<c+1&&p.y>=b&&p.y<d+1)));TREE_POS.splice(0,TREE_POS.length,...OLD_TREES);
 photographicExterior();buildOutdoorObjects();bakeLights();resetActions();G.place={building:-1,floor:0};G.field=null;G.fieldT=0;
 const b=OLD_LANDMARKS.find(b=>b.name===ROOM_NAMES[building]||(building===2&&b.name==='商店'));
 const south=[1,2,3,4,8,9].includes(building);P.x=b.x+.5;P.y=b.y+(south?2.75:-1.75);P.yaw=south?Math.PI/2:-Math.PI/2;P.vx=0;P.vy=0;
 // Never return the player inside porch geometry or a wall, including restored maps.
 if(blockedC(P.x,P.y,.38)){
  let candidate=null;
  for(let radius=.5;radius<=5&&!candidate;radius+=.5)for(let i=0;i<16;i++){
   const angle=P.yaw+i*Math.PI/8,x=P.x+Math.cos(angle)*radius,y=P.y+Math.sin(angle)*radius;
   if(!blockedC(x,y,.38)){candidate={x,y};break;}
  }
  if(candidate){P.x=candidate.x;P.y=candidate.y;}
 }
 G.fade=.8;
}
function generateVillage(){
 // Keep the mountain progression and tunnel gates, while giving each external volume its own footprint.
 const caveW=WL.slice(),caveF=FL.slice();WL.fill(6);FL.fill(5);
 for(let y=16;y<=38;y++)for(let x=1;x<=59;x++){WL[ID(x,y)]=0;FL[ID(x,y)]=0;}
 for(let y=0;y<MH;y++)for(let x=60;x<MW;x++){WL[ID(x,y)]=caveW[ID(x,y)];FL[ID(x,y)]=caveF[ID(x,y)];}
 const exteriorDoors={};
 for(let i=0;i<BUILDING_BOUNDS.length;i++){
  const entry=OLD_LANDMARKS.find(b=>b.name===ROOM_NAMES[i]||(i===2&&b.name==='商店')),south=[1,2,3,4,8,9].includes(i);
  const width=OUTDOOR_WIDTHS[i],left=Math.round(entry.x+.5-width/2),right=left+width-1,near=south?entry.y-5:entry.y,far=south?entry.y:entry.y+5;
  BUILDING_BOUNDS[i].splice(0,4,left,near,right,far);
  for(let y=near;y<=far;y++)for(let x=left;x<=right;x++){WL[ID(x,y)]=2;FL[ID(x,y)]=1;}
  WL[ID(entry.x,entry.y)]=8;exteriorDoors[ID(entry.x,entry.y)]={key:i===5?'police':i===4?'office':null,lock:'鍵がかかっている。'};
 }
 for(const [key,value]of Object.entries(DOORS))if(Number(key)%MW>=60)exteriorDoors[key]=value;
 replaceDoorMap(exteriorDoors);
 const villageItems=ITEMS0.filter(i=>!OLD_BOUNDARIES.some(([a,b,c,d])=>i.x>=a&&i.x<c+1&&i.y>=b&&i.y<d+1)).map(i=>({...i,taken:false}));
 const zs=ZOM0.filter(([x,y])=>x>=60||(y>=16&&y<23)).map(mkZombie);
 const boss=mkZombie([71.5,6.5,3]);boss.boss=true;boss.hp=boss.mhp=16;boss.spd=.85;zs.push(boss);
 ZONE_CACHE.set('village',{wl:WL.slice(),fl:FL.slice(),doors:{...DOORS},items:villageItems,zombies:zs,seen:new Uint8Array(MW*MH)});
 paintVillageMap();
}
newWorld=function(){baseNewWorld();ZONE_CACHE.clear();CURRENT_BUILDING=-1;CURRENT_FLOOR=0;generateVillage();const village=ZONE_CACHE.get('village');G.items=village.items;G.zombies=village.zombies;changeFloor(0,1,[8,7,0]);};
interact=function(){
 if(CURRENT_BUILDING>=0){
  const portal=CURRENT_PORTALS.find(p=>hyp(P.x-p.x,P.y-p.y)<1.7);
  if(portal){if(portal.kind==='stairs')changeFloor(CURRENT_BUILDING,1-CURRENT_FLOOR,[44.5,16.5,Math.PI]);else if(CURRENT_FLOOR>0)say('階段で一階へ降りてから玄関へ向かおう。',2);else changeToVillage(CURRENT_BUILDING);return;}
 }else{
  for(let i=0;i<12;i++){const entry=OLD_LANDMARKS.find(b=>b.name===ROOM_NAMES[i]||(i===2&&b.name==='商店'));
   if(hyp(P.x-entry.x-.5,P.y-entry.y-.5)<2){const d=DOORS[ID(entry.x,entry.y)];if(d?.key&&!G.keys[d.key]){say(d.lock,2);return;}changeFloor(i,0);return;}
  }
 }
 baseInteract();
};
snapshot=function(){const s=baseSnapshot();s.place={building:CURRENT_BUILDING,floor:CURRENT_FLOOR};return s;};
restore=function(s){if(s.place){if(s.place.building<0)changeToVillage(0);else changeFloor(s.place.building,s.place.floor);}baseRestore(s);};
const baseVillageMap=drawVillageMap;
drawVillageMap=function(){
 if(CURRENT_BUILDING<0){baseVillageMap();return;}
 ctx.fillStyle='#d6caa6';ctx.fillRect(20,20,VW-40,VH-40);ctx.strokeStyle='#716147';ctx.lineWidth=2;ctx.strokeRect(28,28,VW-56,VH-56);
 ctx.fillStyle='#3a3429';ctx.font='bold 25px '+FONT;ctx.textAlign='center';ctx.fillText(ROOM_NAMES[CURRENT_BUILDING]+' '+(CURRENT_FLOOR+1)+'階',VW/2,60);
 const s=14,ox=110,oy=90;ctx.fillStyle='#ebe0bd';ctx.fillRect(ox+2*s,oy+15*s,48*s,4*s);
 for(const r of CURRENT_ROOMS){ctx.fillStyle='#b5a785';ctx.fillRect(ox+r.x*s,oy+r.y*s,r.w*s,r.h*s);ctx.strokeStyle='#594b38';ctx.strokeRect(ox+r.x*s,oy+r.y*s,r.w*s,r.h*s);ctx.fillStyle='#342c22';ctx.font='16px '+FONTS;ctx.fillText(r.name,ox+(r.x+r.w/2)*s,oy+(r.y+r.h/2)*s);}
 ctx.font='14px '+FONTS;ctx.fillStyle='#433629';if(CURRENT_FLOOR===0)ctx.fillText('玄関・出口',ox+3.5*s,oy+17*s);if(CURRENT_PORTALS.some(p=>p.kind==='stairs'))ctx.fillText(CURRENT_FLOOR?'↓ 一階':'↑ 二階',ox+46*s,oy+17*s);
 ctx.fillStyle='#b13527';ctx.beginPath();ctx.arc(ox+P.x*s,oy+P.y*s,4,0,TAU);ctx.fill();
};
const baseBlockedC=blockedC;
blockedC=function(x,y,r){
 if(baseBlockedC(x,y,r))return true;
 if(FIXTURE_COLLIDERS.some(b=>x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h))return true;
 if(CURRENT_BUILDING<0){for(let i=0;i<BUILDING_BOUNDS.length;i++){
  const [x0,y0,x1,y1]=BUILDING_BOUNDS[i],south=[1,2,3,4,8,9].includes(i),front=south?y1+1:y0,sign=south?1:-1,center=(x0+x1+1)/2;
  if(Math.abs(x-center)<(x1+1-x0)*.19+r&&(y-front)*sign>=0&&(y-front)*sign<.82+r)return true;
 }}
 return false;
};
const baseStep=playerStep;
playerStep=function(dt,input){baseStep(dt,input);if(CURRENT_BUILDING>=0){const p=CURRENT_PORTALS.find(p=>hyp(P.x-p.x,P.y-p.y)<1.7);if(p)G.hint=p.kind==='stairs'?'E : '+(CURRENT_FLOOR?'一階へ降りる':'二階へ上がる'):'E : 玄関から村へ';}};

newGame('demo');
requestAnimationFrame(frame);
window.__g={G,P,keys,newGame,step(n){for(let i=0;i<n;i++)update(1/60);draw();},items:()=>G.items,zombies:()=>G.zombies,WL,FL,bfs,openDoor,pickup,say};
})().catch(error=>{console.error(error);document.body.innerHTML='<p style="color:white;padding:24px">画像の読み込みに失敗しました。assets フォルダを確認してください。</p>';});
</script>
