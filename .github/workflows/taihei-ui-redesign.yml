name: Apply Taihei UI Redesign

on:
  push:
    branches:
      - taihei-ui-redesign
    paths:
      - scripts/apply-taihei-ui-redesign.mjs
      - .github/workflows/taihei-ui-redesign.yml

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: taihei-ui-redesign
      - name: Apply Canvas UI redesign
        run: node scripts/apply-taihei-ui-redesign.mjs
      - name: Commit generated taihei.html
        run: |
          if git diff --quiet -- taihei.html; then
            echo "No UI changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taihei.html
          git commit -m "太平風雲記 本体Canvas UIを中世和風デザインへ統合"
          git push origin HEAD:taihei-ui-redesign
