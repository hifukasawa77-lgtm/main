name: Run Taihei UI Redesign

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/taihei-ui-redesign-runner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-to-redesign-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: taihei-ui-redesign
          fetch-depth: 0
      - name: Apply redesign script
        run: node scripts/apply-taihei-ui-redesign.mjs
      - name: Commit taihei.html to redesign branch
        run: |
          if git diff --quiet -- taihei.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taihei.html
          git commit -m "太平風雲記 本体Canvas UIを中世和風デザインへ統合"
          git push origin HEAD:taihei-ui-redesign
