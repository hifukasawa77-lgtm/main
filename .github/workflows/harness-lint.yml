name: ハーネス整合性チェック

# .claude/（エージェント定義・スキル・フック・settings.json）に変更が入ったら
# harness-lint.sh を自動実行し、ドリフト/死蔵/同期ズレを機械的に検出する。
# 再帰的自己改善ループの「強制」段: 手作業監査に頼らず、CIで恒久的にガードする。
# 監視パスは「検査が正として読むファイル」を含めること。.claude/** だけだと、
# 検査#4/#5/#11の正である CLAUDE.md や 検査#5の正である accounting/budget.md、
# 検査#10の対象である agent-data.js を単独で変更したときにCIが起動せず、
# ドリフトがそのまま通る（2026-07-25の16thで発見）。
# obsidian-vault/** は意図的に含めない（検査#8/#9は警告のみでexit codeに影響せず、
# Daily追記のたびにCIが回るだけになるため）。
# 注: GitHub Actions は YAML アンカー（&/*）を解釈しないため、paths は push/pull_request
# それぞれに明示的に書く（片方だけ増やすと監視漏れになるので必ず両方を同時に更新する）。
on:
  push:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - 'accounting/budget.md'
      - 'assets/js/agent-data.js'
      - 'cloudflare-worker/site-knowledge.js'
      - 'scripts/gen-agent-knowledge.mjs'
      - '.github/workflows/harness-lint.yml'
  pull_request:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - 'accounting/budget.md'
      - 'assets/js/agent-data.js'
      - 'cloudflare-worker/site-knowledge.js'
      - 'scripts/gen-agent-knowledge.mjs'
      - '.github/workflows/harness-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: harness-lint を実行
        run: bash .claude/skills/self-improve/harness-lint.sh
