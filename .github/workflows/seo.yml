name: SEO tags
# 公開ページの検索・共有用タグ（title のサイト名・description・canonical・OGP・Twitterカード）、
# sitemap.xml への掲載、トップの構造化データ（ItemList）と全作品の一致を検査する。
# 新作ゲームは別のセッションから直接追加されることが多く、2026-10 に8本がタグ無し・サイトマップ外で
# 公開されていた（例外もエラーも出ないので誰も気づかなかった）。直し方: node scripts/seo-tags.mjs --write
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /浮き沈みゲーム/*.html
            /sitemap.xml
            /assets/js/agent-data.js
            /assets/og/
            /scripts/seo-tags.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node scripts/seo-tags.mjs
      - run: node scripts/seo-tags.mjs --inject
