name: Garmin Data Sync

on:
  schedule:
    - cron: '0 * * * *'  # 毎時0分
  workflow_dispatch:       # 手動トリガー

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install garmin-connect
        # サプライチェーン対策: 認証情報を渡すパッケージはバージョン固定で導入する
        # （更新時は動作確認のうえこの版数を手動で上げる）
        run: npm install garmin-connect@1.6.2

      # OAuthトークンを毎時のラン間で引き継ぎ、パスワードログイン（429の原因）を回避する。
      # keyはラン毎に一意＝成功時は常に最新トークンを保存、restore-keysで直近の成功分を復元。
      # 失敗したランはキャッシュを保存しないため、壊れたトークンが固定化されない。
      - name: Restore Garmin token cache
        uses: actions/cache@v4
        with:
          path: .garmin-token
          key: garmin-token-${{ github.run_id }}
          restore-keys: |
            garmin-token-

      - name: Fetch Garmin data
        run: node scripts/fetch-garmin.js
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Commit garmin-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garmin-data.json
          if git diff --cached --quiet; then
            echo "データに変化なし。スキップ。"
          else
            git commit -m "chore: Garmin データ更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
