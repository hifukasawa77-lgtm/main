name: Website security regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /dashboard.html
            /blog*.html
            /sw.js
            /package*.json
            /assets/js/
            /assets/css/
            /cloudflare-worker/
            /scripts/security*
            /scripts/verify-service-worker.mjs
            /tests/security.test.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node scripts/security-csp.mjs
      - run: node --test tests/security.test.mjs
      - run: node scripts/verify-service-worker.mjs
      - name: Build both Workers without deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.131.2 deploy --dry-run --outdir ../ai-worker-build --config cloudflare-worker/wrangler.toml
          npx --yes wrangler@4.131.2 deploy --dry-run --outdir ../notebook-worker-build --config cloudflare-worker/wrangler-notebook.toml
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: node scripts/security-browser.cjs
