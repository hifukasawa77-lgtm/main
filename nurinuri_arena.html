<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">

<style>
html,body{margin:0;height:100%;background:#080813;overflow:hidden;cursor:crosshair}
canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:auto}

#zl{left:0;width:42%}#zr{right:0;width:42%}
.stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.35);display:none;pointer-events:none}

.base{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,255,255,.22);pointer-events:none}

.btn.on{background:rgba(255,242,90,.6);color:#111}
#bSwim{right:176px;bottom:24px}#bBomb{right:150px;bottom:92px}#bSpec{right:222px;bottom:92px;width:50px;height:50px}
#bPause{right:max(10px,env(safe-area-inset-right));top:8px;width:40px;height:40px;font-size:16px}

#rot b{font-size:64px;display:block;animation:rt 2s ease-in-out infinite}

body.touch.easy #zl{width:70%}

@media(max-width:650px){#arenaControls label{font-size:0}#arenaControls select{font-size:11px;padding:5px}}
</style>

<body>
<canvas id="c" tabindex="0" aria-label="ぬりぬりアリーナのゲーム画面"></canvas>
<div id="artStatus" role="status" style="position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#080813;color:#fff;font:700 18px sans-serif">キャラクターとステージ画像を読み込み中 / Loading artwork…</div>
<div id="arenaControls">
 <label>ステージ <select id="stageSelect" aria-label="ステージを選ぶ"></select></label>
 <label>操作 <select id="controlSelect" aria-label="操作方法"><option value="easy">かんたん（移動だけ）</option><option value="manual">手動でねらう</option></select></label>
 <button id="startMatch" type="button">このステージで遊ぶ</button>
</div>
<div id="tui">
 <div id="bl" class="base"></div><div id="br" class="base"></div>
 <div id="zl" class="zone"></div><div id="zr" class="zone"></div>
 <div id="sl" class="stick"><i></i></div><div id="sr" class="stick"><i></i></div>
 <div id="bSwim" class="btn">およぐ<br>SWIM</div><div id="bBomb" class="btn">ボム<br>BOMB</div><div id="bSpec" class="btn">ひっさつ</div><div id="bPause" class="btn">⏸</div>
</div>
<div id="rot"><b>📱</b>画面を横向きにしてください<br>Please rotate your device to landscape</div>
<script>
(()=>{
'use strict';
/* ============================================================
   ぬりぬりアリーナ  -  4vs4 インクぬりバトル (キャラクターは生成画像アセット)
   ============================================================ */
const W=1200,H=720,CS=10,GW=W/CS,GH=H/CS,R=13,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();
const FONT='"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif';
const rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}

const TEAM=[null,
 {name:'ピンキー隊',col:'#ff3f86',dark:'#a8174f',light:'#ffa3c6'},
 {name:'アクア団',  col:'#1fd0f0',dark:'#0b7b99',light:'#a8f1ff'}];
const NAMES=[null,['ピコ','モチ','ココ','ナナ'],['ゲル','ジュレ','ポロン','タピ']];


/* ---------------- キャラクター画像 ---------------- */
const CHARACTER_ART=[null,[],[]];
let artReady=false;
function splitCharacterAtlas(image){
  const w=image.width,h=image.height,n=w*h,source=document.createElement('canvas');
  source.width=w;source.height=h;const g=source.getContext('2d');g.drawImage(image,0,0);
  const pixels=g.getImageData(0,0,w,h).data,labels=new Int32Array(n),queue=new Int32Array(n),parts=[null];
  for(let k=0;k<n;k++){
    if(labels[k]||pixels[k*4+3]<16)continue;
    const label=parts.length;let head=0,tail=1,sx=0,sy=0;queue[0]=k;labels[k]=label;
    const add=p=>{if(p>=0&&p<n&&!labels[p]&&pixels[p*4+3]>=16){labels[p]=label;queue[tail++]=p;}};
    while(head<tail){const p=queue[head++],x=p%w,y=Math.floor(p/w);sx+=x;sy+=y;if(x>0)add(p-1);if(x<w-1)add(p+1);if(y>0)add(p-w);if(y<h-1)add(p+w);}
    parts.push({area:tail,x:sx/tail,y:sy/tail,owner:-1});
  }
  const main=parts.slice(1).filter(p=>p.area>1200);
  for(const p of main)p.owner=Math.min(3,Math.floor(p.x/w*4))+Math.min(3,Math.floor(p.y/h*4))*4;
  for(const p of parts.slice(1))if(p.area>=4&&p.owner<0){let best=null,distance=Infinity;for(const m of main){const d=(p.x-m.x)**2+(p.y-m.y)**2;if(d<distance){distance=d;best=m;}}p.owner=best?best.owner:-1;}
  const owners=new Int16Array(n);owners.fill(-1);
  for(let p=0;p<n;p++)if(labels[p])owners[p]=parts[labels[p]].owner;
  for(let pass=0;pass<2;pass++){const next=owners.slice();for(let p=0;p<n;p++)if(owners[p]<0&&pixels[p*4+3]>0){const x=p%w;for(const q of [x>0?p-1:-1,x<w-1?p+1:-1,p>=w?p-w:-1,p<n-w?p+w:-1])if(q>=0&&owners[q]>=0){next[p]=owners[q];break;}}owners.set(next);}
  const bounds=Array.from({length:16},()=>({x0:w,y0:h,x1:-1,y1:-1}));
  for(let p=0;p<n;p++){const i=owners[p];if(i<0)continue;const x=p%w,y=Math.floor(p/w),b=bounds[i];b.x0=Math.min(b.x0,x);b.x1=Math.max(b.x1,x);b.y0=Math.min(b.y0,y);b.y1=Math.max(b.y1,y);}
  if(bounds.some(b=>b.x1<0))throw new Error('Missing character frame');
  const scale=224/Math.max(...bounds.map(b=>Math.max(b.x1-b.x0+1,b.y1-b.y0+1)));
  return bounds.map((b,i)=>{
    const crop=document.createElement('canvas');crop.width=b.x1-b.x0+1;crop.height=b.y1-b.y0+1;
    const cg=crop.getContext('2d'),data=cg.createImageData(crop.width,crop.height);
    for(let y=0;y<crop.height;y++)for(let x=0;x<crop.width;x++){const p=(y+b.y0)*w+x+b.x0;if(owners[p]===i)data.data.set(pixels.subarray(p*4,p*4+4),(y*crop.width+x)*4);}
    cg.putImageData(data,0,0);
    const sprite=document.createElement('canvas');sprite.width=sprite.height=256;
    const dw=crop.width*scale,dh=crop.height*scale;sprite.getContext('2d').drawImage(crop,(256-dw)/2,(256-dh)/2,dw,dh);
    return sprite;
  });
}
async function loadCharacterArt(){
  await Promise.all(['pinky','aqua'].map((name,i)=>new Promise((resolve,reject)=>{
    const image=new Image();
    image.onload=()=>{
      try{const frames=splitCharacterAtlas(image);for(let row=0;row<4;row++)CHARACTER_ART[i+1][row]=frames.slice(row*4,row*4+4);resolve();}catch(error){reject(error);}
    };
    image.onerror=()=>reject(new Error('Character asset failed: '+name));
    image.src='assets/nurinuri-arena/'+name+'.png';
  })));
  artReady=true;
}
function drawCharacterSprite(e,swim,moving,bob){
  const frame=(swim?2:0)+(moving?Math.floor(G.t*9+e.idx)%2:0);
  const sprite=CHARACTER_ART[e.team][e.idx][frame];
  const direction=swim&&moving?Math.atan2(e.vy,e.vx):e.aim;
  const size=swim?42:56;
  ctx.save();ctx.translate(0,swim?0:-2+bob);ctx.rotate(direction);
  ctx.drawImage(sprite,-size/2,-size/2,size,size);ctx.restore();
}

/* ---------------- ステージ ---------------- */
const STAGES=[
 {name:'ひろびろ広場',hint:'見通しがよく、はじめてでも遊びやすい',floor:['#334557','#203042'],wall:['#99b9c7','#557e92'],walls:[{x:380,y:180,w:70,h:110},{x:750,y:180,w:70,h:110},{x:380,y:430,w:70,h:110},{x:750,y:430,w:70,h:110}]},
 {name:'箱庭ガーデン',hint:'小さな花壇を回って、広い通路を塗ろう',floor:['#31483f','#20352e'],wall:['#9fbd8c','#567b60'],walls:[{x:260,y:140,w:90,h:90},{x:850,y:140,w:90,h:90},{x:260,y:490,w:90,h:90},{x:850,y:490,w:90,h:90},{x:450,y:285,w:90,h:150},{x:660,y:285,w:90,h:150}]},
 {name:'みなと倉庫',hint:'倉庫の間を抜けて、中央の広場へ',floor:['#294858','#1c303f'],wall:['#8dbacc','#446e89'],walls:[{x:300,y:100,w:90,h:230},{x:810,y:100,w:90,h:230},{x:300,y:430,w:90,h:190},{x:810,y:430,w:90,h:190},{x:520,y:140,w:160,h:65},{x:520,y:515,w:160,h:65}]},
 {name:'クロス市場',hint:'中央の十字路を通り、四方に塗り広げよう',floor:['#53453a','#352e2b'],wall:['#cfb494','#8a705b'],walls:[{x:340,y:140,w:180,h:120},{x:680,y:140,w:180,h:120},{x:340,y:460,w:180,h:120},{x:680,y:460,w:180,h:120}]},
 {name:'ぐるぐる工房',hint:'中央の設備を回る、内側と外側の二つの道',floor:['#464254','#29283b'],wall:['#b9adcf','#776d91'],walls:[{x:550,y:270,w:100,h:180},{x:360,y:170,w:170,h:50},{x:670,y:170,w:170,h:50},{x:360,y:500,w:170,h:50},{x:670,y:500,w:170,h:50},{x:330,y:290,w:50,h:140},{x:820,y:290,w:50,h:140}]},
 {name:'ツイン回廊',hint:'上下の通路を使って、相手の横へ回り込もう',floor:['#2a2f55','#1b1e3b'],wall:['#7f86c4','#5a609b'],walls:[
 {x:560,y:310,w:80,h:100},
 {x:300,y:110,w:40,h:190},{x:300,y:420,w:40,h:190},
 {x:860,y:110,w:40,h:190},{x:860,y:420,w:40,h:190},
 {x:440,y:200,w:60,h:60},{x:700,y:200,w:60,h:60},
 {x:440,y:460,w:60,h:60},{x:700,y:460,w:60,h:60},
 {x:500,y:60,w:200,h:24},{x:500,y:636,w:200,h:24},
 {x:150,y:300,w:30,h:120},{x:1020,y:300,w:30,h:120}
]}
];
let selectedStage=0,easyControls=true;
let WALLS=STAGES[0].walls;
const STAGE_ART=[];
let stageArtReady=false;
async function loadStageArt(){
  const names=['plaza','garden','harbor','market','workshop','corridor'];
  await Promise.all(names.map((name,index)=>new Promise((resolve,reject)=>{
    const image=new Image();
    image.onload=()=>{
      try{
        STAGE_ART[index]=[];
        for(let tile=0;tile<4;tile++){
          const texture=document.createElement('canvas');texture.width=texture.height=512;
          texture.getContext('2d').drawImage(image,(tile%2)*image.width/2,Math.floor(tile/2)*image.height/2,image.width/2,image.height/2,0,0,512,512);
          STAGE_ART[index].push(texture);
        }
        resolve();
      }catch(error){reject(error);}
    };
    image.onerror=()=>reject(new Error('Stage asset failed: '+name));
    image.src='assets/nurinuri-arena/stage-'+name+'.png';
  })));
  stageArtReady=true;
}
function applyStage(index){
  selectedStage=clamp(Math.floor(Number(index)||0),0,STAGES.length-1);WALLS=STAGES[selectedStage].walls;
  rebuildMask();buildFloor();
}

function circRect(x,y,r,w){const cx=clamp(x,w.x,w.x+w.w),cy=clamp(y,w.y,w.y+w.h),dx=x-cx,dy=y-cy;return dx*dx+dy*dy<r*r;}
function blocked(x,y,r){if(x<r||y<r||x>W-r||y>H-r)return true;for(const w of WALLS)if(circRect(x,y,r,w))return true;return false;}
function inWall(x,y){if(x<0||y<0||x>W||y>H)return true;for(const w of WALLS)if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)return true;return false;}
function los(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/10);for(let i=1;i<n;i++){const t=i/n;if(inWall(x1+(x2-x1)*t,y1+(y2-y1)*t))return false;}return true;}

/* ---------------- インク盤面 ---------------- */
const owner=new Uint8Array(GW*GH),mask=new Uint8Array(GW*GH),counts=[0,0,0];
let total=0;
function rebuildMask(){total=0;for(let i=0;i<GW*GH;i++){const x=(i%GW+.5)*CS,y=(Math.floor(i/GW)+.5)*CS;mask[i]=inWall(x,y)?0:1;total+=mask[i];}}
rebuildMask();
const inkC=document.createElement('canvas');inkC.width=W;inkC.height=H;const ink=inkC.getContext('2d');
function inkAt(x,y){const gx=Math.floor(x/CS),gy=Math.floor(y/CS);if(gx<0||gy<0||gx>=GW||gy>=GH)return 0;return owner[gy*GW+gx];}
function stamp(x,y,r,t){
  let g=0;
  const g0=Math.max(0,Math.floor((x-r)/CS)),g1=Math.min(GW-1,Math.floor((x+r)/CS)),h0=Math.max(0,Math.floor((y-r)/CS)),h1=Math.min(GH-1,Math.floor((y+r)/CS));
  for(let gy=h0;gy<=h1;gy++)for(let gx=g0;gx<=g1;gx++){
    const i=gy*GW+gx;if(!mask[i])continue;
    const dx=(gx+.5)*CS-x,dy=(gy+.5)*CS-y;
    if(dx*dx+dy*dy<=r*r&&owner[i]!==t){if(owner[i])counts[owner[i]]--;counts[t]++;owner[i]=t;g++;}
  }
  ink.fillStyle=TEAM[t].col;ink.beginPath();ink.arc(x,y,r,0,TAU);ink.fill();
  return g;
}
function paint(x,y,r,t){
  let g=stamp(x,y,r,t);
  const n=r>30?7:r>14?3:1;
  for(let i=0;i<n;i++){const a=rnd()*TAU,d=r*(.7+rnd()*.5),rr=r*(.18+rnd()*.22);g+=stamp(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.max(3,rr),t);}
  return g;
}

/* ---------------- 床(キャッシュ) ---------------- */
const floorC=document.createElement('canvas');floorC.width=W;floorC.height=H;
function buildFloor(){
  const f=floorC.getContext('2d');
  if(STAGE_ART[selectedStage]){
    f.clearRect(0,0,W,H);
    for(let y=0;y<H;y+=240)for(let x=0;x<W;x+=240){
      const texture=STAGE_ART[selectedStage][((x/240+y/240)%2)];
      f.drawImage(texture,x,y,240,240);
    }
    return;
  }
  const g=f.createLinearGradient(0,0,0,H);g.addColorStop(0,STAGES[selectedStage].floor[0]);g.addColorStop(1,STAGES[selectedStage].floor[1]);
  f.fillStyle=g;f.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=40)for(let x=0;x<W;x+=40){if(((x+y)/40)%2===0){f.fillStyle='rgba(255,255,255,.035)';f.fillRect(x,y,40,40);}}
  f.strokeStyle='rgba(255,255,255,.06)';f.lineWidth=1;
  for(let x=0;x<=W;x+=40){f.beginPath();f.moveTo(x+.5,0);f.lineTo(x+.5,H);f.stroke();}
  for(let y=0;y<=H;y+=40){f.beginPath();f.moveTo(0,y+.5);f.lineTo(W,y+.5);f.stroke();}
  f.strokeStyle='rgba(255,255,255,.12)';f.lineWidth=3;f.beginPath();f.moveTo(W/2,0);f.lineTo(W/2,H);f.stroke();
  f.beginPath();f.arc(W/2,H/2,90,0,TAU);f.stroke();
}
buildFloor();

/* ---------------- 音(WebAudioで合成) ---------------- */
let AC=null,mg=null,muted=false,noiseBuf=null;
function audioInit(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    mg=AC.createGain();mg.gain.value=.55;mg.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;
    startBgm();
  }catch(e){AC=null;}
}
function tone(f,d,type,v,slide,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fq,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;fl.type='lowpass';fl.frequency.value=fq||2000;
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(g);g.connect(mg);s.start(t,rnd()*.5);s.stop(t+d+.03);
}
const sfx={
  shoot(v){tone(520+rnd()*120,.07,'square',.035*v,-300);noise(.05,.03*v,3500);},
  hit(){tone(220,.09,'sawtooth',.07,-120);noise(.08,.06,1800);},
  splat(){noise(.28,.16,1400);tone(160,.25,'sine',.12,-100);tone(660,.1,'triangle',.05,300,.04);},
  throwB(){tone(300,.15,'triangle',.07,300);},
  boom(d){const v=clamp(1-d/700,.25,1);noise(.6,.3*v,700);tone(90,.5,'sine',.3*v,-50);},
  beep(){tone(660,.14,'square',.09);},
  go(){tone(990,.4,'square',.1);tone(1320,.4,'square',.07,0,.02);},
  special(){for(let i=0;i<5;i++)tone(440*Math.pow(1.26,i),.18,'square',.07,0,i*.06);},
  ready(){tone(880,.12,'triangle',.08);tone(1320,.2,'triangle',.08,0,.1);},
  swim(){noise(.12,.05,900);tone(200,.1,'sine',.05,200);},
  end(){for(let i=0;i<4;i++)tone(523*Math.pow(1.19,i*1.7),.35,'triangle',.1,0,i*.13);},
  respawn(){tone(330,.1,'triangle',.05,330);}
};
let bgmNext=0,bgmStep=0;
const CHORDS=[[220,261.6,329.6,440],[174.6,220,261.6,349.2],[261.6,329.6,392,523.3],[196,246.9,293.7,392]];
const ROOTS=[110,87.3,130.8,98];
function startBgm(){
  bgmNext=AC.currentTime+.1;
  setInterval(()=>{
    if(!AC||AC.state!=='running')return;
    while(bgmNext<AC.currentTime+.25){
      const s=bgmStep%16,bar=Math.floor(bgmStep/16)%4,dt=bgmNext-AC.currentTime;

}

function playerInput(e){
  const k=keys;
  let mx=(k.KeyD?1:0)-(k.KeyA?1:0),my=(k.KeyS?1:0)-(k.KeyW?1:0);
  if(easyControls&&!mx&&!my){mx=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0);my=(k.ArrowDown?1:0)-(k.ArrowUp?1:0);}
  if(!mx&&!my){mx=T.mx;my=T.my;}
  if(easyControls){
    let target=null,best=360;
    for(const foe of ents){if(!foe.alive||foe.team===e.team)continue;const d=dist(e.x,e.y,foe.x,foe.y);if(foe.swim&&d>75)continue;if(d<best&&los(e.x,e.y,foe.x,foe.y)){target=foe;best=d;}}
    if(e.ink<18)e.autoRefill=true;if(e.ink>=90)e.autoRefill=false;
    const refill=e.autoRefill&&inkAt(e.x,e.y)===e.team;
    const swim=refill||!!(k.Space||k.ShiftLeft||k.ShiftRight||T.swim);
    const aim=target?Math.atan2(target.y-e.y,target.x-e.x):(mx||my?Math.atan2(my,mx):e.aim);
    return {mx,my,aim,fire:!e.autoRefill&&!swim&&!!(target||mx||my),swim,bomb:!!(k.KeyE||k.KeyZ||T.bomb),spec:!!(e.spec>=1&&target||k.KeyQ||T.spec)};
  }
  const ax=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0),ay=(k.ArrowDown?1:0)-(k.ArrowUp?1:0);
  let aim=null,fire=false;
  if(ax||ay){aim=Math.atan2(ay,ax);fire=true;}
  else if(T.aim){aim=Math.atan2(T.ay,T.ax);fire=true;}
  else if(mouse.on){aim=Math.atan2(mouse.y-e.y,mouse.x-e.x);fire=mouse.down;}
  if(k.KeyF||k.KeyJ)fire=true;
  return {mx,my,aim,fire,swim:!!(k.Space||k.ShiftLeft||k.ShiftRight||mouse.right||T.swim),bomb:!!(k.KeyE||k.KeyZ||T.bomb),spec:!!(k.KeyQ||k.KeyX||T.spec)};
}

/* ---------------- AI ---------------- */
const N4=[[1,0],[-1,0],[0,1],[0,-1]];
function steer(inp,e,tx,ty,a){
  const base=Math.atan2(ty-e.y,tx-e.x),offs=[0,.6,-.6,1.2,-1.2,1.9,-1.9,2.6];
  for(const o of offs){const ang=base+o*a.flip;if(!blocked(e.x+Math.cos(ang)*32,e.y+Math.sin(ang)*32,15)){inp.mx=Math.cos(ang);inp.my=Math.sin(ang);return ang;}}
  inp.mx=Math.cos(base);inp.my=Math.sin(base);return base;
}
function nearestOwn(e){
  let best=null,bd=1e9;
  for(let i=0;i<70;i++){
    const idx=Math.floor(rnd()*GW*GH);if(owner[idx]!==e.team)continue;
    const x=(idx%GW+.5)*CS,y=(Math.floor(idx/GW)+.5)*CS,d=dist(e.x,e.y,x,y);
    if(d<bd){bd=d;best={x,y};}
  }
  return best;
}
function pickTarget(e){
  let best=null,bs=-1e9;
  for(let i=0;i<16;i++){
    const x=40+rnd()*(W-80),y=40+rnd()*(H-80);if(blocked(x,y,14))continue;
    const o=inkAt(x,y);
    let s=(o===e.team?0:o===0?9:12)+rnd()*4-dist(e.x,e.y,x,y)*.012;
    for(const[dx,dy]of N4)if(inkAt(x+dx*40,y+dy*40)!==e.team)s+=2;
    for(const al of ents)if(al!==e&&al.team===e.team&&al.ai.tgt)s-=Math.max(0,120-dist(x,y,al.ai.tgt.x,al.ai.tgt.y))*.04;
    if(s>bs){bs=s;best={x,y};}
  }
  return best;
}
function aiInput(e,dt){
  const a=e.ai;a.t+=dt;
  const inp={mx:0,my:0,aim:null,fire:false,swim:false,bomb:false,spec:false};
  const mine=inkAt(e.x,e.y)===e.team;
  let foe=null,fd=1e9;
  for(const o of ents){
    if(o.team===e.team||!o.alive)continue;
    const d=dist(e.x,e.y,o.x,o.y);
    if(o.swim&&d>75)continue;
    if(d<340&&d<fd&&los(e.x,e.y,o.x,o.y)){foe=o;fd=d;}
  }
  a.seeT=foe?a.seeT+dt:0;
  // 詰まり検出
  if(a.t-a.pt>.7){if(a.tgt&&dist(e.x,e.y,a.px,a.py)<8){a.tgt=null;a.flip=-a.flip;}a.px=e.x;a.py=e.y;a.pt=a.t;}
  if(e.spec>=1&&e.specT<=0&&(foe||a.t%9<.1))inp.spec=true;
  if(a.mode!=='refill'&&(e.ink<16||(e.hp<38&&foe)))a.mode='refill';
  if(a.mode==='refill'&&e.ink>=88&&e.hp>=70)a.mode='paint';
  if(a.mode==='refill'){
    if(mine){inp.swim=true;}
    else{
      if(!a.tgt||a.t-a.rt>.5){a.tgt=nearestOwn(e);a.rt=a.t;}
      if(a.tgt)steer(inp,e,a.tgt.x,a.tgt.y,a);else a.mode='paint';
      if(foe&&e.ink>=2&&fd<250&&a.seeT>.2){inp.aim=Math.atan2(foe.y-e.y,foe.x-e.x);inp.fire=true;}
    }
    return inp;
  }
  if(foe){
    const t=fd/520,px=foe.x+foe.vx*t*.7,py=foe.y+foe.vy*t*.7;
    const ang=Math.atan2(py-e.y,px-e.x);
    inp.aim=ang+Math.sin(a.t*5+e.id)*.04;
    inp.fire=e.ink>=1.5&&a.seeT>.22;
    if(a.t>a.sf){a.strafe=rnd()<.5?-1:1;a.sf=a.t+.7+rnd()*1.2;}
    const rad=fd>190?1:fd<110?-1:0,tx=Math.cos(ang),ty=Math.sin(ang);
    const vx=tx*rad+(-ty)*a.strafe*.8,vy=ty*rad+tx*a.strafe*.8;
    steer(inp,e,e.x+vx*80,e.y+vy*80,a);
    if(fd>90&&fd<240&&e.bombCd<=0&&e.ink>45&&rnd()<dt*1.4)inp.bomb=true;
    return inp;
  }
  // ぬりモード
  if(!a.tgt||dist(e.x,e.y,a.tgt.x,a.tgt.y)<30||a.t-a.rt>3.2){a.tgt=pickTarget(e);a.rt=a.t;}
  if(a.tgt){
    const ma=steer(inp,e,a.tgt.x,a.tgt.y,a);
    inp.aim=ma+Math.sin(a.t*2.3+e.idx*1.7)*.45;
    const ahead=inkAt(e.x+Math.cos(ma)*90,e.y+Math.sin(ma)*90)!==e.team;
    inp.fire=e.ink>20&&(ahead||rnd()<.3);
    inp.swim=mine&&!inp.fire&&dist(e.x,e.y,a.tgt.x,a.tgt.y)>140;
  }
  return inp;
}

/* ---------------- 戦闘 ---------------- */
function gainSpec(e,n){if(e&&e.specT<=0&&e.spec<1){e.spec=Math.min(1,e.spec+n/SPEC_CELLS);if(e.spec>=1&&e.isPlayer)sfx.ready();}}
function kill(e,src){

function hurt(e,dmg,src){

function shoot(e){
  const fever=e.specT>0,a=e.aim+(rnd()-.5)*(fever?.14:.1),sp=fever?600:520,c=Math.cos(a),s=Math.sin(a);
  bullets.push({x:e.x+c*16,y:e.y+s*16,vx:c*sp,vy:s*sp,life:(fever?300:235)/sp,team:e.team,owner:e,dmg:fever?10:11,r:fever?11:9,end:fever?24:19,lp:0,trav:0});

function throwBomb(e){

  bombs.push({x:e.x+Math.cos(e.aim)*14,y:e.y+Math.sin(e.aim)*14,vx:Math.cos(e.aim)*570,vy:Math.sin(e.aim)*570,fuse:.9,team:e.team,owner:e});

function explode(b){
  const g=paint(b.x,b.y,74,b.team);gainSpec(b.owner,g);
  splash(b.x,b.y,TEAM[b.team].col,36,320,.7);splash(b.x,b.y,'#fff',14,260,.35);
  const d0=dist(b.x,b.y,W/2,H/2);sfx.boom(d0);G.shake=Math.max(G.shake,6);
  b.ring=.35;
  for(const e of ents){

    const d=dist(b.x,b.y,e.x,e.y);
    if(d<105&&los(b.x,b.y,e.x,e.y))hurt(e,Math.max(30,120*(1-d/110)),b.owner);
  }
  ex.push({x:b.x,y:b.y,t:0,col:TEAM[b.team].col});
}
const ex=[];

function stepEnt(e,inp,dt){
  if(!e.alive){e.respawn-=dt;if(e.respawn<=0){spawn(e);sfx.respawn();}return;}
  e.inv=Math.max(0,e.inv-dt);e.fireCd-=dt;e.bombCd-=dt;e.hurtT+=dt;
  const here=inkAt(e.x,e.y),mine=here===e.team,foeInk=here!==0&&!mine;
  const wasSwim=e.swim,swim=!!(inp.swim&&mine);e.swim=swim;
  if(swim&&!wasSwim&&e.isPlayer)sfx.swim();
  let sp=150;if(e.specT>0)sp*=1.25;if(swim)sp=275;else if(foeInk)sp=72;
  if(inp.fire&&!swim)sp*=.72;
  let mx=inp.mx,my=inp.my;const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  const k=Math.min(1,dt*10);e.vx+=(mx*sp-e.vx)*k;e.vy+=(my*sp-e.vy)*k;
  const nx=e.x+e.vx*dt;if(!blocked(nx,e.y,R))e.x=nx;else e.vx=0;
  const ny=e.y+e.vy*dt;if(!blocked(e.x,ny,R))e.y=ny;else e.vy=0;
  // 向き
  let want=null;if(inp.aim!=null)want=inp.aim;else if(ml>.1)want=Math.atan2(my,mx);
  if(want!=null){
    if(e.isPlayer)e.aim=want;
    else{const d=angDiff(e.aim,want),m=10*dt;e.aim+=clamp(d,-m,m);}
  }
  // インク・体力
  if(swim){e.ink=Math.min(100,e.ink+55*dt);e.hp=Math.min(100,e.hp+45*dt);}
  else e.ink=Math.min(100,e.ink+(inp.fire?0:e.isPlayer&&easyControls?24:4)*dt);
  if(foeInk&&!swim){e.hp-=7*dt;e.hurtT=0;if(e.hp<=0){kill(e,null);return;}}
  if(e.hurtT>2.5&&e.hp<100)e.hp=Math.min(100,e.hp+22*dt);
  // 攻撃
  const fever=e.specT>0;if(fever)e.specT=Math.max(0,e.specT-dt);
  if(inp.fire&&!swim&&e.fireCd<=0&&(e.ink>=COST||fever))shoot(e);
  if(inp.bomb&&!swim&&e.bombCd<=0&&e.ink>=35)throwBomb(e);
  if(inp.spec&&e.spec>=1&&e.specT<=0){e.spec=0;e.specT=6;e.inv=Math.max(e.inv,.3);sfx.special();splash(e.x,e.y,TEAM[e.team].light,24,260,.5);if(e.isPlayer)G.shake=6;}
}

function updateProjectiles(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i],px=b.x,py=b.y,d=Math.hypot(b.vx,b.vy)*dt;
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;b.trav+=d;
    let done=false;
    if(inWall(b.x,b.y)){b.x=px;b.y=py;done=true;}
    else if(b.life<=0)done=true;
    else{
      for(const e of ents){
        if(!e.alive||e.team===b.team||e.swim||e.inv>0)continue;
        if(dist(b.x,b.y,e.x,e.y)<R+4){
          hurt(e,b.dmg,b.owner);sfx.hit();
          splash(b.x,b.y,TEAM[b.team].col,5,150,.3);
          const g=paint(b.x,b.y,12,b.team);gainSpec(b.owner,g);
          bullets.splice(i,1);done=null;break;
        }
      }
      if(done===null)continue;
      if(b.trav-b.lp>=24){b.lp=b.trav;const g=stamp(b.x,b.y,b.r*.85,b.team);gainSpec(b.owner,g);}
    }
    if(done){
      const g=paint(b.x,b.y,b.end,b.team);gainSpec(b.owner,g);
      splash(b.x,b.y,TEAM[b.team].col,4,120,.3);
      bullets.splice(i,1);
    }
  }
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];b.fuse-=dt;
    const nx=b.x+b.vx*dt;if(blocked(nx,b.y,6)){b.vx*=-.4;}else b.x=nx;
    const ny=b.y+b.vy*dt;if(blocked(b.x,ny,6)){b.vy*=-.4;}else b.y=ny;
    const f=Math.exp(-3*dt);b.vx*=f;b.vy*=f;
    if(b.fuse<=0){explode(b);bombs.splice(i,1);}
  }
}

function updatePlay(dt){
  for(const e of ents){
    const inp=!e.alive?null:(e.isPlayer?playerInput(e):aiInput(e,dt));
    stepEnt(e,inp,dt);
  }
  // 押し合い
  for(let i=0;i<ents.length;i++)for(let j=i+1;j<ents.length;j++){
    const a=ents[i],b=ents[j];if(!a.alive||!b.alive||a.swim||b.swim)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<R*1.8&&d>.01){
      const p=(R*1.8-d)*.5,ux=dx/d,uy=dy/d;
      if(!blocked(a.x-ux*p,a.y-uy*p,R)){a.x-=ux*p;a.y-=uy*p;}
      if(!blocked(b.x+ux*p,b.y+uy*p,R)){b.x+=ux*p;b.y+=uy*p;}
    }
  }
  updateProjectiles(dt);
  G.timeLeft-=dt;
  if(G.timeLeft<=10&&!G.warned){G.warned=true;}
  if(G.timeLeft<=0){
    G.timeLeft=0;G.phase='result';G.resT=0;
    G.win=counts[1]>counts[2]?1:counts[2]>counts[1]?2:0;
    sfx.end();
    for(const b of bombs.splice(0))explode(b);
  }
}

function update(dt){
  G.t+=dt;G.shake*=Math.exp(-6*dt);G.flash=Math.max(0,G.flash-dt);
  if(G.paused)return;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.exp(-4*dt);p.vx*=f;p.vy*=f;
  }
  for(let i=ex.length-1;i>=0;i--){ex[i].t+=dt;if(ex[i].t>.5)ex.splice(i,1);}
  for(let i=feed.length-1;i>=0;i--){feed[i].t+=dt;if(feed[i].t>4.5)feed.splice(i,1);}
  if(G.phase==='count'){
    G.cd-=dt;
    const n=Math.ceil(G.cd);
    if(G.mode==='play'&&n!==G.lastBeep&&n>=1&&n<=3){G.lastBeep=n;sfx.beep();}
    if(G.cd<=0){G.phase='play';G.lastBeep=0;if(G.mode==='play')sfx.go();}
    for(const e of ents)if(e.alive)stepEnt(e,{mx:0,my:0,aim:null,fire:false,swim:false,bomb:false,spec:false},dt);
  }else if(G.phase==='play')updatePlay(dt);
  else{
    G.resT+=dt;
    updateProjectiles(dt);
    if(G.mode==='demo'&&G.resT>5)newMatch('demo');
  }
}

function outlineText(t,x,y,size,fill,align,stroke){
  ctx.font='bold '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle=stroke||'rgba(10,10,30,.9)';
  ctx.strokeText(t,x,y);ctx.fillStyle=fill||'#fff';ctx.fillText(t,x,y);
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawWalls(){

function drawEnt(e){
  const T=TEAM[e.team];
  if(!e.alive){
    if(e.respawn>0&&e.respawn<3.5){
      ctx.globalAlpha=.7;outlineText(Math.ceil(e.respawn)+'',e.sx,e.sy-30,20,T.light);ctx.globalAlpha=1;
    }
    return;
  }
  ctx.save();ctx.translate(e.x,e.y);
  if(e.inv>0&&Math.floor(G.t*14)%2)ctx.globalAlpha=.45;
  const moving=Math.hypot(e.vx,e.vy)>20;
  if(e.swim){
    let vis=e.team===1?.65:.1;
    if(e.team!==1)for(const o of ents)if(o.team===1&&o.alive&&dist(o.x,o.y,e.x,e.y)<80){vis=.55;break;}
    ctx.globalAlpha*=vis;
    drawCharacterSprite(e,true,moving,0);
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.globalAlpha*=.8;
    const rr=(G.t*20+e.id)%14;ctx.beginPath();ctx.arc(0,2,10+rr,0,TAU);ctx.stroke();
  }else{
    const bob=Math.sin(G.t*14+e.id)*(moving?1.8:.6);
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,10,13,6,0,0,TAU);ctx.fill();
    drawCharacterSprite(e,false,moving,bob);
    if(e.specT>0){ctx.strokeStyle='#fff';ctx.globalAlpha=.5+.4*Math.sin(G.t*20);ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-2,R+6+Math.sin(G.t*12)*2,0,TAU);ctx.stroke();}
  }
  ctx.restore();
  // 名前・HP
  ctx.globalAlpha=1;
  if(!e.swim||e.team===1){
    if(e.hp<99&&!e.swim){
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(e.x-14,e.y-30,28,4);
      ctx.fillStyle=e.hp>35?'#7dff6a':'#ff4a4a';ctx.fillRect(e.x-14,e.y-30,28*clamp(e.hp/100,0,1),4);
    }
    outlineText(e.name,e.x,e.y-37,12,e.isPlayer?'#fff25a':T.light);
  }
  if(e.isPlayer){
    const by=e.y-50+Math.sin(G.t*8)*2;
    ctx.fillStyle='#fff25a';ctx.beginPath();ctx.moveTo(e.x,by+8);ctx.lineTo(e.x-7,by-3);ctx.lineTo(e.x+7,by-3);ctx.closePath();ctx.fill();
    if(!e.swim){
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([5,7]);ctx.lineWidth=2;ctx.beginPath();
      ctx.moveTo(e.x+Math.cos(e.aim)*28,e.y+Math.sin(e.aim)*28);ctx.lineTo(e.x+Math.cos(e.aim)*110,e.y+Math.sin(e.aim)*110);ctx.stroke();ctx.setLineDash([]);
    }
  }
}

function drawWorld(){
  ctx.drawImage(floorC,0,0);
  ctx.drawImage(inkC,0,0);
  // 光沢
  ctx.globalAlpha=.10;ctx.globalCompositeOperation='lighter';ctx.drawImage(inkC,-2,-3);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  drawWalls();
  // 爆弾
  for(const b of bombs){
    const T=TEAM[b.team],p=1-b.fuse/.9,bl=Math.floor(G.t*(8+p*14))%2;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(b.x,b.y+7,8,4,0,0,TAU);ctx.fill();
    ctx.fillStyle=bl?'#fff':T.col;ctx.beginPath();ctx.arc(b.x,b.y-3,8,0,TAU);ctx.fill();
    ctx.strokeStyle=T.dark;ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle=T.light;ctx.globalAlpha=.25+.35*p;ctx.lineWidth=2;ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(b.x,b.y,60+p*14,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  const sorted=ents.slice().sort((a,b)=>a.y-b.y);
  for(const e of sorted)drawEnt(e);
  // 弾
  for(const b of bullets){
    const T=TEAM[b.team],sp=Math.hypot(b.vx,b.vy);
    ctx.strokeStyle=T.col;ctx.lineCap='round';ctx.lineWidth=b.r*.9;
    ctx.beginPath();ctx.moveTo(b.x-b.vx/sp*14,b.y-b.vy/sp*14);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.fillStyle=T.light;ctx.beginPath();ctx.arc(b.x,b.y,b.r*.5,0,TAU);ctx.fill();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.4+.6*p.life/p.max),0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  for(const x of ex){const k=x.t/.5;ctx.strokeStyle='#fff';ctx.globalAlpha=1-k;ctx.lineWidth=6*(1-k)+1;ctx.beginPath();ctx.arc(x.x,x.y,20+k*90,0,TAU);ctx.stroke();ctx.strokeStyle=x.col;ctx.lineWidth=10*(1-k);ctx.beginPath();ctx.arc(x.x,x.y,10+k*70,0,TAU);ctx.stroke();}
  ctx.globalAlpha=1;
}

function draw(){
  ctx.save();
  if(G.shake>.3)ctx.translate((rnd()-.5)*G.shake,(rnd()-.5)*G.shake);
  drawWorld();
  ctx.restore();
  // ビネット
  const vg=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,10,.45)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const me=ents.find(e=>e.isPlayer);
  if(me&&me.alive&&me.hp<40){ctx.fillStyle='rgba(255,30,60,'+(.12+.1*Math.sin(G.t*8))+')';ctx.fillRect(0,0,W,H);}
  if(G.flash>0){ctx.fillStyle='rgba(255,60,80,'+G.flash*.5+')';ctx.fillRect(0,0,W,H);}
  drawHUD();drawHint();drawOverlay();
  outlineText(STAGES[selectedStage].name,W/2,106,16,'#dfe3ff');
}

/* ---------------- メインループ ---------------- */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;hintT+=G.paused?0:dt;
  while(acc>=1/60){update(1/60);acc-=1/60;}
  draw();
  requestAnimationFrame(frame);
}

const stageSelect=document.getElementById('stageSelect');
STAGES.forEach((stage,i)=>{const option=document.createElement('option');option.value=i;option.textContent=(i+1)+'. '+stage.name;stageSelect.appendChild(option);});
function syncControls(){document.body.classList.toggle('easy',easyControls);document.getElementById('controlSelect').value=easyControls?'easy':'manual';}
syncControls();
stageSelect.addEventListener('change',()=>{newMatch('demo',stageSelect.value);});
document.getElementById('controlSelect').addEventListener('change',event=>{easyControls=event.target.value==='easy';syncControls();for(const key of Object.keys(keys))keys[key]=false;T.mx=T.my=0;T.aim=T.swim=T.bomb=T.spec=false;mouse.down=mouse.right=false;hintT=0;cv.focus();});
document.getElementById('startMatch').addEventListener('click',()=>{audioInit();newMatch('play',stageSelect.value);cv.focus();});

document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play'&&G.phase!=='result')G.paused=true;});
newMatch('demo');
Promise.all([loadCharacterArt(),loadStageArt()]).then(()=>{
  buildFloor();
  document.getElementById('artStatus').remove();
  last=performance.now();draw();requestAnimationFrame(frame);
}).catch(error=>{
  console.error(error);
  const status=document.getElementById('artStatus');
  status.textContent='画像を読み込めませんでした。クリックして再読み込み / Click to retry';
  status.style.cursor='pointer';status.onclick=()=>location.reload();
});
window.__g={G,ents,counts,CHARACTER_ART,STAGES,WALLS:()=>WALLS,mask,owner,blocked,playerInput,get selectedStage(){return selectedStage;},get easyControls(){return easyControls;},setEasy(value){easyControls=value;syncControls();},STAGE_ART,get artReady(){return artReady&&stageArtReady;},get total(){return total;},newMatch,keys,bullets,bombs,step(n){for(let i=0;i<n;i++)update(1/60);draw();}};
})();
</script>
