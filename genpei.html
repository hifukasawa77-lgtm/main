function parseKyotenCsv(text) {
  const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
  const head = lines[0].split(',');
  const idx = (n) => head.indexOf(n);
  const I = {
    id: idx('ID'), jp: idx('拠点名'), en: idx('英名'), type: idx('種別'), prov: idx('国'),
    mx: idx('MX'), my: idx('MY'), scale: idx('規模'), def: idx('防御'),
    holder: idx('荘園領主'), suigun: idx('水軍'), note: idx('備考'),
  };
  const cols = {};
  for (const s of SCENARIOS) cols[s.col] = idx(s.col);
  return lines.slice(1).map((line) => {
    const c = line.split(',');
    const own = {};
    for (const s of SCENARIOS) own[s.col] = c[cols[s.col]] || null;
    return {
      id: c[I.id], jp: c[I.jp], en: c[I.en], type: c[I.type], province: c[I.prov],
      mx: Number(c[I.mx]), my: Number(c[I.my]),
      scale: Number(c[I.scale]) || 0, defense: Number(c[I.def]) || 0,
      holder: c[I.holder] || null, suigun: c[I.suigun] || null, note: c[I.note] || '',
      own,
    };
  });
}

async function loadData() {
  let provinces = null, kyotenCsv = null, source = 'fetch';
  // file:// では fetch が CORS で必ず失敗する。試すと console.error が出て
  // 動的テストの「console.error 0件」を毎回落とすので、最初から埋め込みへ行く。
  const isFile = location.protocol === 'file:';
  try {
    if (isFile) throw new Error('file protocol');
    const [p, k, c] = await Promise.all([
      fetch('assets/genpei/provinces.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch('kyoten_ichi.csv', { cache: 'no-store' }).then((r) => (r.ok ? r.text() : null)).catch(() => null),
      fetch('assets/genpei/coastline.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    provinces = p; kyotenCsv = k; if (c) DATA.coast = c;
  } catch (e) { /* file:// / CORS / オフライン。下でシードへ落ちる */ }

  if (!provinces || !kyotenCsv) {
    provinces = provinces || EMBED.provinces;
    kyotenCsv = kyotenCsv || EMBED.kyotenCsv;
    DATA.coast = DATA.coast || EMBED.coastline;
    source = 'embed';
    console.info('[genpei] 外部データを取得できないため埋め込みシードを使用します（file:// では正常）');
  }
  if (!provinces || !kyotenCsv) throw new Error('拠点・令制国データを読み込めませんでした');

  DATA.provinces = provinces.provinces;
  DATA.provById = Object.fromEntries(DATA.provinces.map((p) => [p.id, p]));
  DATA.kyoten = parseKyotenCsv(kyotenCsv);
  DATA.kyotenById = Object.fromEntries(DATA.kyoten.map((k) => [k.id, k]));
  DATA.byProvince = {};
  for (const k of DATA.kyoten) (DATA.byProvince[k.province] = DATA.byProvince[k.province] || []).push(k);
  // 国の範囲（拡大図のカメラ用）と重心
  DATA.provBox = {};
  for (const [pid, list] of Object.entries(DATA.byProvince)) {
    const xs = list.map((k) => k.mx), ys = list.map((k) => k.my);
    DATA.provBox[pid] = {
      x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys),
      cx: xs.reduce((a, b) => a + b, 0) / xs.length, cy: ys.reduce((a, b) => a + b, 0) / ys.length,
      hull: convexHull(list.map((k) => [k.mx, k.my])),
    };
  }
  DATA.source = source;
  // 輪郭は毎フレーム全本を舐めると重い。外れているものを弾くため外接矩形を先に持つ
  if (DATA.coast) {
    const box = (polys) => polys.map((flat) => {
      let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      for (let i = 0; i < flat.length; i += 2) {
        if (flat[i] < x0) x0 = flat[i]; if (flat[i] > x1) x1 = flat[i];
        if (flat[i + 1] < y0) y0 = flat[i + 1]; if (flat[i + 1] > y1) y1 = flat[i + 1];
      }
      return { flat, x0, y0, x1, y1 };
    });
    DATA.coastLand = box(DATA.coast.land);
    DATA.coastRelief = (DATA.coast.relief || []).map(box);
  }
}

/* 凸包（単調鎖法）。国の領域を塗るための近似輪郭に使う */
function convexHull(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const build = (arr) => {
    const st = [];
    for (const q of arr) {
      while (st.length >= 2 && cross(st[st.length - 2], st[st.length - 1], q) <= 0) st.pop();
      st.push(q);
    }
    st.pop();
    return st;
  };
  return build(p).concat(build(p.slice().reverse()));
}

/* ============================================================================
 * 3. ルール層（純粋関数。state を書き換えず値を返す）
 * ========================================================================== */
const Rule = {
  seasonOf(month) {
    if (month >= 8 && month <= 10) return 'autumn';
    if (month >= 11 || month <= 1) return 'winter';
    if (month <= 4) return 'spring';
    return 'summer';
  },
  monthIndex(y, m) { return y * 12 + (m - 1); },
  famineActive(state) {
    const now = Rule.monthIndex(state.year, state.month), f = RULE.famine;
    return now >= Rule.monthIndex(f.from.y, f.from.m) && now <= Rule.monthIndex(f.to.y, f.to.m);
  },
  famineCoef(state, provinceId) {
    if (!Rule.famineActive(state)) return 0;
    const p = DATA.provById[provinceId];
    return RULE.famine.coef[p && p.famineZone] || 0;
  },

  /* 名分（基本設計 4.1）。権威 + 家格 + 評判 − 朝敵 */
  calcMeibun(state, fid) {
    const f = state.factions[fid];
    if (!f) return 0;
    let v = 0;
    for (const a of f.authority) v += (AUTHORITY[a] ? AUTHORITY[a].value : 0);
    v += (LORD_KAKAKU[f.lord] || 40) * RULE.meibun.kakakuMul;
    v += f.reputation;
    if (f.choteki) v -= RULE.meibun.chotekiPenalty;
    return clamp(Math.round(v), 0, RULE.meibun.max);
  },
  meibunBreakdown(state, fid) {
    const f = state.factions[fid];
    return {
      authority: f.authority.reduce((s, a) => s + (AUTHORITY[a] ? AUTHORITY[a].value : 0), 0),
      kakaku: (LORD_KAKAKU[f.lord] || 40) * RULE.meibun.kakakuMul,
      reputation: f.reputation,
      choteki: f.choteki ? -RULE.meibun.chotekiPenalty : 0,
      total: Rule.calcMeibun(state, fid),
    };
  },

  adjacent(a, b) {
    if (!a || !b || a.id === b.id) return false;
    if (a.province === b.province) return true;
    const p = DATA.provById[a.province];
    return !!(p && p.neighbors.includes(b.province));
  },
  ownedKyoten(state, fid) { return DATA.kyoten.filter((k) => state.kyoten[k.id].owner === fid); },

  /* 国の支配勢力 = その国の国府の持ち主 */
  provinceOwner(state, pid) {
    const k = DATA.kyotenById['kokufu_' + pid];
    return k ? state.kyoten[k.id].owner : null;
  },

  income(state, fid) {
    const hv = RULE.econ.harvest[Rule.seasonOf(state.month)];
    let food = 0, gold = 0, levy = 0, troops = 0;
    for (const k of Rule.ownedKyoten(state, fid)) {
      const famine = 1 - Rule.famineCoef(state, k.province);
      if (k.type === 'shoen' || k.type === 'mura') food += k.scale * hv * famine;
      if (k.type === 'machi') gold += k.scale * 0.4;
      if (k.type === 'sekisho') gold += k.scale * 0.02;
      if (k.type === 'kokufu') { gold += k.scale * RULE.econ.taxRate; levy += k.scale * RULE.econ.levyMul; }
      troops += state.kyoten[k.id].garrison;
    }
    const upkeep = troops * RULE.econ.foodPerTroop;
    return {
      food: Math.round(food), gold: Math.round(gold), levyCap: Math.round(levy),
      upkeep: Math.round(upkeep), net: Math.round(food - upkeep), troops,
    };
  },

  /* 出兵の強さ。守備は防御値ぶんだけ嵩上げされる */
  defenseStrength(state, k) { return state.kyoten[k.id].garrison + k.defense * 4; },

  aiActions(state, fid) {
    if (RULE.ai.famineBlock && Rule.famineActive(state)) return [];
    const cand = [];
    for (const src of Rule.ownedKyoten(state, fid)) {
      const sg = state.kyoten[src.id].garrison;
      if (sg < RULE.ai.minGarrison) continue;
      for (const k of DATA.kyoten) {
        const st = state.kyoten[k.id];
        if (st.owner === fid || !Rule.adjacent(src, k)) continue;
        const need = Rule.defenseStrength(state, k) * RULE.ai.attackRatio;
        if (sg <= need) continue;
        cand.push({ kind: 'capture', from: src.id, to: k.id, troops: Math.floor(sg * 0.6),
                    score: k.scale + (sg - need) * 0.1 });
      }
    }
    // 価値の高い順に、拠点の重複を避けて上限まで採る
    cand.sort((a, b) => b.score - a.score);
    const acts = [], usedFrom = new Set(), usedTo = new Set();
    for (const c of cand) {
      if (acts.length >= RULE.ai.maxActions) break;
      if (usedFrom.has(c.from) || usedTo.has(c.to)) continue;
      usedFrom.add(c.from); usedTo.add(c.to); acts.push(c);
    }
    return acts;
  },

  checkVictory(state) {
    const f = state.factions[state.faction];
    const owned = Rule.ownedKyoten(state, state.faction);
    const seats = owned.filter((k) => k.type === 'kokufu').length;
    if (owned.length === 0) return { done: true, win: false, reason: '拠点をすべて失った / All sites lost' };
    if (Rule.monthIndex(state.year, state.month) < Rule.monthIndex(state.endYear, state.endMonth)) return { done: false };
    const v = FACTIONS[state.faction].victory;
    let win;
    if (v === 'survive_regime') win = f.authority.includes('emperor') && !f.choteki && seats >= 20;
    else if (v === 'bakufu') win = f.authority.includes('senji') && seats >= 35;
    else if (v === 'hiraizumi') win = !!state.kyoten['tachi_hiraizumi'] && state.kyoten['tachi_hiraizumi'].owner === state.faction;
    else win = owned.length > 0;
    return { done: true, win, reason: win ? '勝利条件を満たした / Victory conditions met' : '終幕 / The age has ended' };
  },
};

/* ============================================================================
 * 4. ゲーム状態
 * ========================================================================== */
function buildState(scenarioId, factionId) {
  const scn = SCENARIOS.find((s) => s.id === scenarioId);
  const state = {
    version: SAVE_VERSION, scenario: scenarioId, faction: factionId,
    year: scn.start[0], month: scn.start[1], turn: 1,
    endYear: scn.end[0], endMonth: scn.end[1],
    factions: {}, kyoten: {}, log: [], result: null,
  };
  for (const fid of Object.keys(FACTIONS)) {
    state.factions[fid] = {
      authority: (scn.authority[fid] || []).slice(),
      lord: scn.lords[fid] || FACTIONS[fid].jp,
      reputation: 0, choteki: false, chotekiUntil: 0, courtInfluence: fid === 'taira' ? 55 : 20,
      gold: 200, food: 0, alive: false,
    };
  }
  for (const k of DATA.kyoten) {
    const owner = k.own[scn.col] || null;
    // 駐留兵は種別と規模から導く（Phase 1 の暫定。Phase 2 で武士団へ移す）
    const mul = { kokufu: 1.2, tachi: 0.5, kisaku: 0.8, toride: 0.8, shoen: 2, tera: 6,
                  jinja: 3, sekisho: 1.2, machi: 2, mura: 4, minato: 3 }[k.type] || 1;
    state.kyoten[k.id] = { owner, garrison: Math.round(k.scale * mul + k.defense * 3) };
    if (owner) state.factions[owner].alive = true;
  }
  for (const fid of Object.keys(FACTIONS)) state.factions[fid].food = Rule.income(state, fid).food * 3;
  pushLog(state, `${scn.jp} — ${state.year}年${state.month}月、乱世はじまる`);
  return state;
}

function pushLog(state, text) {
  state.log.unshift({ y: state.year, m: state.month, text });
  if (state.log.length > 120) state.log.length = 120;
}

/* 出兵の解決。★プレイヤーもAIも必ずこの関数を通す（判定が二重化すると必ず食い違う） */
function applyActions(state, fid, acts) {
  for (const act of acts) {
    const src = state.kyoten[act.from], dst = state.kyoten[act.to];
    if (!src || !dst || src.owner !== fid || src.garrison < act.troops) continue;
    const target = DATA.kyotenById[act.to];
    src.garrison -= act.troops;
    // 攻め手が守りを上回れば落ちる。下回れば撃退され、双方が兵を失う。
    // （「攻めれば必ず落ちる」にすると、拠点の多い勢力が毎ターン版図を倍にしてしまう）
    const defence = Rule.defenseStrength(state, target);
    const prev = dst.owner;
    if (act.troops > defence) {
      dst.owner = fid;
      dst.garrison = Math.max(1, act.troops - defence);
      state.factions[fid].alive = true;
      if (prev === state.faction || fid === state.faction) pushLog(state, `${FACTIONS[fid].jp}が${target.jp}を落とした`);
    } else {
      dst.garrison = Math.max(0, dst.garrison - Math.floor(act.troops * 0.6));
      src.garrison += Math.floor(act.troops * 0.3);   // 生き残りが本領へ戻る
      if (prev === state.faction || fid === state.faction) pushLog(state, `${target.jp}が${FACTIONS[fid].jp}の攻めを凌いだ`);
    }
  }
}

/* 徴兵。金を兵に換える。国府の規模で決まる動員上限を超えられない */
function levy(state, fid, kyotenId, want) {
  const f = state.factions[fid], st = state.kyoten[kyotenId];
  if (!st || st.owner !== fid) return { ok: false, why: '自勢力の拠点ではない' };
  const inc = Rule.income(state, fid);
  const room = Math.max(0, inc.levyCap - inc.troops);
  const n = Math.min(want, room, Math.floor(f.gold / LEVY_COST));
  if (n <= 0) return { ok: false, why: room <= 0 ? '動員上限に達している' : '金が足りない' };
  f.gold -= n * LEVY_COST;
  st.garrison += n;
  return { ok: true, n };
}
const LEVY_COST = 0.5;   // 兵1あたりの金

/* ターン終了（詳細設計 第5節のシーケンス。Phase 1 で実装済みの段のみ） */
function endTurn(state) {
  // 1. 時代イベントの発火
  for (const ev of TIMELINE) if (ev.y === state.year && ev.m === state.month) pushLog(state, ev.jp);
  // 3-4. 収支と兵糧枯渇
  for (const fid of Object.keys(FACTIONS)) {
    const f = state.factions[fid];
    if (!f.alive) continue;
    const inc = Rule.income(state, fid);
    f.food = Math.max(0, f.food + inc.net);
    f.gold += inc.gold;
    if (f.food <= 0 && inc.troops > 0) {
      for (const k of Rule.ownedKyoten(state, fid)) {
        const st = state.kyoten[k.id];
        st.garrison = Math.max(0, Math.round(st.garrison * (1 - RULE.econ.starveTroop)));
      }
      if (fid === state.faction) pushLog(state, '兵糧が尽き、兵が逃散した');
    }
  }
  // 9. AI の行動
  for (const fid of Object.keys(FACTIONS)) {
    if (fid === state.faction) continue;
    const f = state.factions[fid];
    if (!f.alive || !FACTIONS[fid].playable) continue;
    applyActions(state, fid, Rule.aiActions(state, fid));
  }
  for (const fid of Object.keys(FACTIONS)) state.factions[fid].alive = Rule.ownedKyoten(state, fid).length > 0;
  // 12. 月を進める
  state.month++;
  if (state.month > 12) { state.month = 1; state.year++; }
  state.turn++;
  // 11. 勝敗
  const v = Rule.checkVictory(state);
  if (v.done) state.result = v;
  // 13. オートセーブ
  save.set('autosave', state);
  return state;
}

/* ============================================================================
 * 5. 描画のユーティリティ
 * ========================================================================== */
const ASSETS = { map: null, mapReady: false };
const MAP_ASPECT = 941 / 1672;

function loadMap() {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { ASSETS.map = img; ASSETS.mapReady = true; resolve(true); };
    img.onerror = () => { ASSETS.mapReady = false; resolve(false); };
    img.src = MAP_ASSET;
  });
}
function mapAspect() {
  const img = ASSETS.map;
  return img && img.naturalWidth ? img.naturalHeight / img.naturalWidth : MAP_ASPECT;
}

/* 巻物風の枠。参照UIの金枠に合わせる */
function frame(ctx, x, y, w, h, opts) {
  const o = opts || {};
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, o.radius || 6);
  ctx.fillStyle = o.fill || 'rgba(10,15,22,0.86)';
  ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = o.stroke || 'rgba(216,178,106,0.34)';
  ctx.stroke();
  ctx.restore();
}
function frameTitle(ctx, x, y, w, title, en) {
  frame(ctx, x, y, w, 22, { fill: 'rgba(216,178,106,0.13)', stroke: 'rgba(216,178,106,0.30)', radius: 5 });
  txt(ctx, title, x + 10, y + 4, { font: '600 13px "Hiragino Mincho ProN", serif', color: '#e8d3a0', align: 'left' });
  if (en) txt(ctx, en, x + w - 10, y + 6, { font: '10px "Segoe UI", sans-serif', color: '#8a7a58', align: 'right' });
}
function txt(ctx, str, x, y, o) {
  ctx.save();
  ctx.font = (o && o.font) || '13px "Hiragino Mincho ProN", serif';
  ctx.fillStyle = (o && o.color) || '#dbe4ee';
  ctx.textAlign = (o && o.align) || 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function fitText(ctx, str, max, font) {
  ctx.save(); ctx.font = font;
  let s = str;
  while (s.length > 1 && ctx.measureText(s).width > max) s = s.slice(0, -1);
  ctx.restore();
  return s === str ? s : s.slice(0, -1) + '…';
}
function button(ctx, b, hover) {
  frame(ctx, b.x, b.y, b.w, b.h, {
    fill: b.disabled ? 'rgba(255,255,255,0.03)' : hover ? 'rgba(216,178,106,0.20)' : 'rgba(216,178,106,0.09)',
    stroke: b.disabled ? 'rgba(255,255,255,0.10)' : hover ? 'rgba(216,178,106,0.75)' : 'rgba(216,178,106,0.38)',
    radius: b.radius != null ? b.radius : 5,
  });
  const cx = b.x + b.w / 2;
  txt(ctx, b.jp, cx, b.y + (b.en ? b.h / 2 - 15 : b.h / 2 - 8), {
    font: b.font || '600 16px "Hiragino Mincho ProN", serif',
    color: b.disabled ? '#5b6675' : '#f0e2c0', align: 'center',
  });
  if (b.en) txt(ctx, b.en, cx, b.y + b.h / 2 + 5, { font: '10px "Segoe UI", sans-serif', color: '#8a7a58', align: 'center' });
}
function hit(b, p) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

/* --------------------------------------------------------------------------
 * 拠点アイコン — Canvas のみで描く小さな建物図形。
 * ★ 画像アセットに依存しないので、後読みの失敗で「白い箱」になることがない。
 * ------------------------------------------------------------------------ */
function drawSiteIcon(ctx, kind, x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.lineWidth = Math.max(1, s * 0.08);
  ctx.strokeStyle = 'rgba(0,0,0,0.75)';
  ctx.fillStyle = color;
  const roof = (w, h, dy) => {                        // 反りのある屋根
    ctx.beginPath();
    ctx.moveTo(-w, dy);
    ctx.quadraticCurveTo(-w * 0.5, dy - h * 1.5, 0, dy - h);
    ctx.quadraticCurveTo(w * 0.5, dy - h * 1.5, w, dy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  const box = (w, h, dy) => { ctx.beginPath(); ctx.rect(-w, dy, w * 2, h); ctx.fill(); ctx.stroke(); };
  switch (kind) {
    case 'kokufu':                                     // 国府: 大きな瓦屋根＋旗
      roof(s * 1.0, s * 0.45, 0); box(s * 0.72, s * 0.5, 0);
      ctx.beginPath(); ctx.moveTo(0, -s * 0.5); ctx.lineTo(0, -s * 1.25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -s * 1.25); ctx.lineTo(s * 0.6, -s * 1.05); ctx.lineTo(0, -s * 0.85);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    case 'tachi':                                      // 館: 屋敷
      roof(s * 0.85, s * 0.4, 0); box(s * 0.6, s * 0.45, 0);
      break;
    case 'kisaku': {                                   // 城柵: 柵＋櫓
      box(s * 0.34, s * 0.55, -s * 0.1); roof(s * 0.5, s * 0.3, -s * 0.1);
      ctx.beginPath();
      for (let i = -3; i <= 3; i++) { ctx.moveTo(i * s * 0.28, s * 0.15); ctx.lineTo(i * s * 0.28, s * 0.5); }
      ctx.moveTo(-s, s * 0.28); ctx.lineTo(s, s * 0.28);
      ctx.strokeStyle = color; ctx.stroke();
      break;
    }
    case 'toride': {                                   // 砦: 土塁＋逆茂木
      ctx.beginPath(); ctx.moveTo(-s, s * 0.5); ctx.lineTo(-s * 0.35, -s * 0.35);
      ctx.lineTo(s * 0.35, -s * 0.35); ctx.lineTo(s, s * 0.5); ctx.closePath();
      ctx.fill(); ctx.stroke();
      break;
    }
    case 'shoen': {                                    // 荘園: 稲束
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(i * s * 0.55, s * 0.5);
        ctx.lineTo(i * s * 0.55 - s * 0.28, -s * 0.4); ctx.lineTo(i * s * 0.55 + s * 0.28, -s * 0.4);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      break;
    }
    case 'tera': {                                     // 寺: 多重塔
      for (let i = 0; i < 3; i++) {
        const w = s * (0.95 - i * 0.22), dy = s * (0.45 - i * 0.42);
        roof(w, s * 0.24, dy); box(w * 0.55, s * 0.2, dy);
      }
      ctx.beginPath(); ctx.moveTo(0, -s * 0.8); ctx.lineTo(0, -s * 1.2); ctx.stroke();
      break;
    }
    case 'jinja': {                                    // 神社: 鳥居
      ctx.beginPath();
      ctx.moveTo(-s, -s * 0.55); ctx.lineTo(s, -s * 0.55);
      ctx.moveTo(-s * 0.8, -s * 0.22); ctx.lineTo(s * 0.8, -s * 0.22);
      ctx.moveTo(-s * 0.55, -s * 0.55); ctx.lineTo(-s * 0.42, s * 0.55);
      ctx.moveTo(s * 0.55, -s * 0.55); ctx.lineTo(s * 0.42, s * 0.55);
      ctx.lineWidth = Math.max(1.4, s * 0.19); ctx.strokeStyle = color; ctx.stroke();
      break;
    }
    case 'sekisho': {                                  // 関所: 門
      ctx.beginPath();
      ctx.moveTo(-s * 0.9, -s * 0.4); ctx.lineTo(s * 0.9, -s * 0.4);
      ctx.moveTo(-s * 0.6, -s * 0.4); ctx.lineTo(-s * 0.6, s * 0.55);
      ctx.moveTo(s * 0.6, -s * 0.4); ctx.lineTo(s * 0.6, s * 0.55);
      ctx.lineWidth = Math.max(1.3, s * 0.17); ctx.strokeStyle = color; ctx.stroke();
      break;
    }
    case 'machi': {                                    // 町: 家並み
      for (let i = -1; i <= 1; i++) {
        ctx.save(); ctx.translate(i * s * 0.62, i === 0 ? -s * 0.16 : 0);
        roof(s * 0.34, s * 0.2, 0); box(s * 0.24, s * 0.34, 0);
        ctx.restore();
      }
      break;
    }
    case 'mura':                                       // 村: 小屋
      roof(s * 0.6, s * 0.34, s * 0.1); box(s * 0.36, s * 0.3, s * 0.1);
      break;
    case 'minato': {                                   // 湊: 舟
      ctx.beginPath();
      ctx.moveTo(-s, s * 0.1); ctx.quadraticCurveTo(0, s * 0.8, s, s * 0.1);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, s * 0.1); ctx.lineTo(0, -s * 0.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -s * 0.85); ctx.lineTo(s * 0.7, -s * 0.35); ctx.lineTo(0, -s * 0.2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    }
    default:
      ctx.beginPath(); ctx.arc(0, 0, s * 0.55, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
/* 勢力の目印（家紋の代わりの簡易章。Phase 5 で本物の家紋に差し替える） */
function drawKamon(ctx, fid, x, y, r) {
  const c = FACTIONS[fid] ? FACTIONS[fid].color : '#94a3b8';
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(8,11,17,0.85)'; ctx.fill();
  ctx.lineWidth = 1.4; ctx.strokeStyle = c; ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.72, Math.sin(a) * r * 0.72);
  }
  ctx.strokeStyle = c; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
  ctx.restore();
}

/* --------------------------------------------------------------------------
 * ベクター地図 — 拡大図・周辺図で使う。
 *
 * ★ 地図素材は 1672×941 しかない。国の拡大図は横 0.06 相当を 726px へ伸ばすので
 *   7倍以上の拡大になり、写真を貼る限り必ずぼやける（より大きな素材は存在しない）。
 *   線とベタ塗りは何倍でも鮮明なので、拡大図は輪郭から描き起こす。
 * ------------------------------------------------------------------------ */
const MAPC = {
  sea0: '#0c2c42', sea1: '#071a28',
  land: '#2f3f27',
  relief: ['#3d4c2d', '#575c39'],     // 丘陵 / 山地
  coast: 'rgba(226,200,142,0.5)',
  shallow: 'rgba(120,190,205,0.18)',
};
/* 地図はカメラが動かない限り同じ絵になる。毎フレーム1万点超のパスを作り直すと
   拡大時に 60fps を割るので、オフスクリーンに焼いて使い回す。 */
const VEC_CACHE = {};
function drawVectorMap(ctx, rect, view, key) {
  if (!DATA.coastLand) return false;
  if (key) {
    const k = `${Math.round(rect.w)}x${Math.round(rect.h)}|${key}`;
    let c = VEC_CACHE[key === undefined ? '_' : rect.cacheId || key];
    const slot = rect.cacheId || key;
    c = VEC_CACHE[slot];
    if (!c || c.key !== k) {
      const cv = (c && c.canvas) || document.createElement('canvas');
      cv.width = Math.max(1, Math.round(rect.w)); cv.height = Math.max(1, Math.round(rect.h));
      const cx = cv.getContext('2d');
      cx.clearRect(0, 0, cv.width, cv.height);
      // オフスクリーンでは原点を (0,0) にした矩形で描く
      const local = { x: 0, y: 0, w: rect.w, h: rect.h };
      const shift = {
        s: view.s,
        toScreen: (mx, my) => { const p = view.toScreen(mx, my); return { x: p.x - rect.x, y: p.y - rect.y }; },
        toMap: (px, py) => view.toMap(px + rect.x, py + rect.y),
      };
      drawVectorMap(cx, local, shift);
      c = VEC_CACHE[slot] = { key: k, canvas: cv };
    }
    ctx.drawImage(c.canvas, rect.x, rect.y);
    return true;
  }
  const g = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.h);
  g.addColorStop(0, MAPC.sea0); g.addColorStop(1, MAPC.sea1);
  ctx.fillStyle = g; ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

  // 表示範囲を正規化座標で求め、外れる輪郭を弾く
  const tl = view.toMap(rect.x, rect.y), br = view.toMap(rect.x + rect.w, rect.y + rect.h);
  const pad = 0.01;
  const visible = (b) => !(b.x1 < tl.x - pad || b.x0 > br.x + pad || b.y1 < tl.y - pad || b.y0 > br.y + pad);
  const pathOf = (flat) => {
    ctx.beginPath();
    for (let i = 0; i < flat.length; i += 2) {
      const s = view.toScreen(flat[i], flat[i + 1]);
      i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y);
    }
    ctx.closePath();
  };
  // 浅瀬（陸をぼかして海側へにじませる）
  ctx.save();
  ctx.strokeStyle = MAPC.shallow;
  ctx.lineWidth = Math.max(3, view.s * 0.006);
  ctx.lineJoin = 'round';
  for (const b of DATA.coastLand) { if (!visible(b)) continue; pathOf(b.flat); ctx.stroke(); }
  ctx.restore();
  // 陸
  ctx.fillStyle = MAPC.land;
  for (const b of DATA.coastLand) { if (!visible(b)) continue; pathOf(b.flat); ctx.fill(); }
  // 標高帯（丘陵 → 山地の順に重ねて起伏を出す）
  (DATA.coastRelief || []).forEach((band, i) => {
    ctx.fillStyle = MAPC.relief[i] || MAPC.relief[MAPC.relief.length - 1];
    for (const b of band) { if (!visible(b)) continue; pathOf(b.flat); ctx.fill(); }
  });
  // 海岸線
  ctx.save();
  ctx.strokeStyle = MAPC.coast;
  ctx.lineWidth = Math.max(0.8, Math.min(2.2, view.s * 0.0009));
  ctx.lineJoin = 'round';
  for (const b of DATA.coastLand) { if (!visible(b)) continue; pathOf(b.flat); ctx.stroke(); }
  ctx.restore();
  return true;
}

class Backdrop {
  constructor() { this.p = new GameKit.Particles(W, H, { count: 40 }); }

    const g = ctx.createLinearGradient(0, 0, W, H);

    ctx.save(); ctx.globalAlpha = 0.45; this.p.draw(ctx); ctx.restore();
  }
}

function wrapText(ctx, str, x, y, maxW, lh, opts) {
  ctx.save(); ctx.font = opts.font;
  let line = '', yy = y;
  for (const ch of str) {
    if (ctx.measureText(line + ch).width > maxW) { txt(ctx, line, x, yy, opts); line = ch; yy += lh; }
    else line += ch;
  }
  if (line) txt(ctx, line, x, yy, opts);
  ctx.restore();
  return yy + lh;
}

class MapScene extends GameKit.Scene {
  constructor(state) { super(); this.state = state; }
  enter(g) {
    // 全国図のカメラ
    // 幅に合わせて列島全体を見せる。枠を覆う倍率まで寄せると東西が切れてしまう。
    // 余る上下は海として塗る（地図の周囲はもともと外洋なので違和感がない）。
    this.minZoom = 1;
    this.cam = { cx: 0.5, cy: 0.5, zoom: this.minZoom };
    this.drag = null;
    // 選択: 自勢力の本拠がある国を初期選択にする
    const mine = Rule.ownedKyoten(this.state, this.state.faction);
    this.province = mine.length ? mine[0].province : 'sagami';
    this.sel = mine.length ? mine[0].id : null;
    this.listScroll = 0;
    this.notice = null; this.noticeT = 0;
    this.cmdButtons = this._layoutCommands();
    this._bindWheel(g);
  }
  exit() { if (this._wheel) canvas.removeEventListener('wheel', this._wheel); }

  _layoutCommands() {
    const n = COMMANDS.length, gap = 6;
    const w = (L.cmd.w - gap * (n - 1)) / n;
    return COMMANDS.map((c, i) => ({
      ...c, x: L.cmd.x + i * (w + gap), y: L.cmd.y, w, h: L.cmd.h,
      jp: c.jp, font: '600 15px "Hiragino Mincho ProN", serif', radius: 4,
    }));
  }
  _bindWheel(g) {
    this._wheel = (e) => {
      const p = g.input.pointer;
      if (!inRect(L.nation, p)) return;
      e.preventDefault();
      const before = this._n2m(p);
      this.cam.zoom = clamp(this.cam.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), this.minZoom, this.minZoom * 5);
      const after = this._n2m(p);
      this.cam.cx += before.x - after.x; this.cam.cy += before.y - after.y;
      this._clampCam();
    };
    canvas.addEventListener('wheel', this._wheel, { passive: false });
  }
  /* 全国図: 画面 → 地図正規化 */
  _nationScale() { return L.nation.w * this.cam.zoom; }
  _n2m(p) {
    const s = this._nationScale();
    return {
      x: this.cam.cx + (p.x - L.nation.x - L.nation.w / 2) / s,
      y: this.cam.cy + (p.y - L.nation.y - L.nation.h / 2) / (s * mapAspect()),
    };
  }
  _m2n(mx, my) {
    const s = this._nationScale();
    return {
      x: L.nation.x + L.nation.w / 2 + (mx - this.cam.cx) * s,
      y: L.nation.y + L.nation.h / 2 + (my - this.cam.cy) * s * mapAspect(),
    };
  }
  _clampCam() {
    const s = this._nationScale();
    const hx = (L.nation.w / 2) / s, hy = (L.nation.h / 2) / (s * mapAspect());
    this.cam.cx = clamp(this.cam.cx, Math.min(0.5, hx), Math.max(0.5, 1 - hx));
    this.cam.cy = clamp(this.cam.cy, Math.min(0.5, hy), Math.max(0.5, 1 - hy));
  }

  /* 国の拡大図 / 拠点の周辺図: 与えた中心と幅で地図を切り出す共通変換 */
  _viewFor(rect, cx, cy, halfW) {
    const s = rect.w / (halfW * 2);
    return {
      s,
      toScreen: (mx, my) => ({
        x: rect.x + rect.w / 2 + (mx - cx) * s,
        y: rect.y + rect.h / 2 + (my - cy) * s * mapAspect(),
      }),
      toMap: (px, py) => ({
        x: cx + (px - rect.x - rect.w / 2) / s,
        y: cy + (py - rect.y - rect.h / 2) / (s * mapAspect()),
      }),
    };
  }
  _provView() {
    const b = DATA.provBox[this.province];
    const halfW = Math.max(0.035, (b.x1 - b.x0) / 2 + 0.022);
    return this._viewFor(L.prov, (b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, halfW);
  }
  _localView() {
    const k = this.sel ? DATA.kyotenById[this.sel] : null;
    const b = DATA.provBox[this.province];
    const cx = k ? k.mx : b.cx, cy = k ? k.my : b.cy;
    return this._viewFor(L.local, cx, cy, 0.016);
  }

  update(dt, g) {
    const p = g.input.pointer;
    if (this.noticeT > 0) this.noticeT -= dt;

    if (p.justPressed) {
      // コマンドバー
      for (const b of this.cmdButtons) {
        if (!hit(b, p)) continue;
        if (b.id === 'endTurn') {
          if (!this.state.result) { endTurn(this.state); g.audio.jingle([{ f: 330, d: 0.08 }, { f: 392, d: 0.12 }]); }
        } else if (b.id === 'kino') { g.changeScene(new TitleScene()); return; }
        else if (b.id === 'joho') this._notice(`拠点 ${DATA.kyoten.length}／国 ${DATA.provinces.length}／${DATA.source === 'embed' ? '埋め込みデータ' : '外部データ'}`);
        else this._notice(`「${b.jp}」は Phase ${b.phase} で開きます / coming in Phase ${b.phase}`);
        return;
      }
      // 命令ボタン（詳細パネル）
      for (const b of (this.actionButtons || [])) {
        if (!hit(b, p)) continue;
        const k = DATA.kyotenById[this.sel];
        if (b.id === 'levy') {
          const res = levy(this.state, this.state.faction, k.id, 500);
          this._notice(res.ok ? `${k.jp} で ${res.n} 名を徴発した` : `徴兵できない — ${res.why}`);
        } else if (b.id === 'attack') {
          const src = this._attackSource(k);
          if (!src) { this._notice('隣接する自勢力の拠点に兵がいない'); return; }
          const troops = Math.floor(this.state.kyoten[src.id].garrison * 0.7);
          applyActions(this.state, this.state.faction, [{ from: src.id, to: k.id, troops }]);
          this._notice(this.state.kyoten[k.id].owner === this.state.faction
            ? `${src.jp} より出陣、${k.jp} を落とした` : `${k.jp} の守りに阻まれた`);
        }
        g.audio.jingle([{ f: 349, d: 0.08 }, { f: 440, d: 0.1 }]);
        return;
      }
      // 全国図: 国を選ぶ
      if (inRect(L.nation, p)) {
        const pid = this._pickProvince(p);
        if (pid) {
          this.province = pid; this.listScroll = 0;
          const list = DATA.byProvince[pid];
          this.sel = list && list.length ? list[0].id : null;
          g.audio.jingle([{ f: 523, d: 0.06 }]);
        } else this.drag = { x: p.x, y: p.y, cx: this.cam.cx, cy: this.cam.cy };
      }
      // 拡大図・周辺図: 拠点を選ぶ
      if (inRect(L.prov, p)) { const k = this._pickKyoten(p, this._provView(), null); if (k) { this.sel = k.id; g.audio.jingle([{ f: 587, d: 0.05 }]); } }
      if (inRect(L.local, p)) { const k = this._pickKyoten(p, this._localView(), null); if (k) { this.sel = k.id; g.audio.jingle([{ f: 587, d: 0.05 }]); } }
      // 拠点一覧
      if (inRect(L.list, p)) {
        const i = Math.floor((p.y - (L.list.y + 42)) / 20) + this.listScroll;
        const list = this._provList();
        if (i >= 0 && i < list.length) { this.sel = list[i].id; g.audio.jingle([{ f: 587, d: 0.05 }]); }
      }
    }
    if (p.isDown && this.drag) {
      const s = this._nationScale();
      this.cam.cx = this.drag.cx - (p.x - this.drag.x) / s;
      this.cam.cy = this.drag.cy - (p.y - this.drag.y) / (s * mapAspect());
      this._clampCam();
    }
    if (!p.isDown) this.drag = null;
    if (g.input.justPressed('Space') && !this.state.result) endTurn(this.state);
  }
  _notice(msg) { this.notice = msg; this.noticeT = 2.6; }
  _provList() { return (DATA.byProvince[this.province] || []).slice().sort((a, b) => KYOTEN_TYPE[a.type].tier - KYOTEN_TYPE[b.type].tier || b.scale - a.scale); }

  _pickProvince(p) {
    const m = this._n2m(p);
    let best = null, bestD = 0.05;
    for (const [pid, b] of Object.entries(DATA.provBox)) {
      const d = Math.hypot(b.cx - m.x, (b.cy - m.y) / mapAspect());
      if (d < bestD) { bestD = d; best = pid; }
    }
    return best;
  }
  _pickKyoten(p, view, types) {
    let best = null, bestD = 15;
    for (const k of DATA.byProvince[this.province] || []) {
      if (types && !types.includes(k.type)) continue;
      const s = view.toScreen(k.mx, k.my);
      const d = Math.hypot(s.x - p.x, s.y - p.y);
      if (d < bestD) { bestD = d; best = k; }
    }
    return best;
  }

  draw(ctx, g) {
    ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
    this._drawTopBar(ctx);
    this._drawNation(ctx);
    this._drawProvince(ctx);
    this._drawLocal(ctx);
    this._drawDetail(ctx);
    this._drawList(ctx, g);
    this._drawEvents(ctx);
    this._drawSide(ctx);
    const p = g.input.pointer;
    for (const b of this.cmdButtons) button(ctx, b, hit(b, p));
    if (this.noticeT > 0) {
      const a = clamp(this.noticeT / 0.6, 0, 1);
      ctx.save(); ctx.globalAlpha = a;
      frame(ctx, W / 2 - 260, H - 122, 520, 34, { fill: 'rgba(216,178,106,0.16)', stroke: 'rgba(216,178,106,0.5)' });
      txt(ctx, this.notice, W / 2, H - 112, { font: '13px "Hiragino Mincho ProN", serif', color: '#f0e2c0', align: 'center' });
      ctx.restore();
    }
    if (this.state.result) this._drawResult(ctx);
  }

  /* -------- 上部ステータスバー -------- */
  _drawTopBar(ctx) {
    const st = this.state, me = st.factions[st.faction], f = FACTIONS[st.faction];
    frame(ctx, L.bar.x, L.bar.y, L.bar.w, L.bar.h, { fill: 'rgba(216,178,106,0.10)', stroke: 'rgba(216,178,106,0.30)', radius: 4 });
    const inc = Rule.income(st, st.faction);
    let x = L.bar.x + 12;
    const put = (s, color, font) => {
      txt(ctx, s, x, L.bar.y + 6, { font: font || '13px "Hiragino Mincho ProN", serif', color: color || '#e8eef5' });
      ctx.save(); ctx.font = font || '13px "Hiragino Mincho ProN", serif';
      x += ctx.measureText(s).width + 18; ctx.restore();
    };
    put(`${st.year}年（${waReki(st.year)}）${st.month}月`, '#f0e2c0');
    put(SEASON_JP[Rule.seasonOf(st.month)], '#d8b26a');
    drawKamon(ctx, st.faction, x + 8, L.bar.y + 13, 8); x += 22;
    put(me.lord, '#e8eef5', '600 13px "Hiragino Mincho ProN", serif');
    const meibun = Rule.calcMeibun(st, st.faction);
    put(`名分 ${meibun}`, meibun >= 500 ? '#5eead4' : meibun >= 250 ? '#f9d423' : '#fca5a5');
    put(`金銭 ${me.gold}`);
    put(`兵糧 ${me.food}`, inc.net < 0 ? '#fca5a5' : '#e8eef5');
    put(`兵士 ${inc.troops}`);
    put(`拠点 ${Rule.ownedKyoten(st, st.faction).length}`);
    put(`朝廷支持 ${Math.round(me.courtInfluence)}`);
    if (me.choteki) put('朝敵', '#fca5a5', '600 13px "Hiragino Mincho ProN", serif');
    if (Rule.famineActive(st)) txt(ctx, '養和の飢饉', L.bar.x + L.bar.w - 12, L.bar.y + 6, { font: '600 13px "Hiragino Mincho ProN", serif', color: '#f9d423', align: 'right' });
  }

  /* -------- 全国図 -------- */
  _drawNation(ctx) {
    const r = L.nation;
    frame(ctx, r.x, r.y, r.w, r.h, { fill: '#0a2233' });
    ctx.save();
    ctx.beginPath(); ctx.roundRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2, 6); ctx.clip();
    // 2.2倍を超えると写真がぼやけるのでベクター地図へ切り替える。
    // 等倍付近では写真の方が美しいので、そこは写真のまま。
    const view = { s: this._nationScale(), toScreen: (mx, my) => this._m2n(mx, my), toMap: (px, py) => this._n2m({ x: px, y: py }) };
    if (this.cam.zoom > 2.2) {
      drawVectorMap(ctx, r, view, `nation:${this.cam.cx.toFixed(4)},${this.cam.cy.toFixed(4)},${this.cam.zoom.toFixed(3)}`);
    } else if (ASSETS.mapReady) {
      const s = this._nationScale(), o = this._m2n(0, 0);
      ctx.drawImage(ASSETS.map, o.x, o.y, s, s * mapAspect());
      ctx.fillStyle = 'rgba(5,7,11,0.34)'; ctx.fillRect(r.x, r.y, r.w, r.h);
    }
    // 国の領有を凸包で塗る（地図画像に境界線がないための近似）
    ctx.globalCompositeOperation = 'lighter';
    for (const [pid, b] of Object.entries(DATA.provBox)) {
      const owner = Rule.provinceOwner(this.state, pid);
      if (!owner || !b.hull.length) continue;
      ctx.beginPath();
      b.hull.forEach((pt, i) => { const s = this._m2n(pt[0], pt[1]); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
      ctx.closePath();
      ctx.fillStyle = hexA(FACTIONS[owner].color, pid === this.province ? 0.34 : 0.20);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const [pid, b] of Object.entries(DATA.provBox)) {
      const owner = Rule.provinceOwner(this.state, pid);
      if (!owner || !b.hull.length) continue;
      ctx.beginPath();
      b.hull.forEach((pt, i) => { const s = this._m2n(pt[0], pt[1]); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
      ctx.closePath();
      ctx.lineWidth = pid === this.province ? 1.8 : 0.7;
      ctx.strokeStyle = hexA(FACTIONS[owner].color, pid === this.province ? 0.95 : 0.55); ctx.stroke();
    }
    // 勢力の名札（各勢力の最大拠点の位置に置く）
    const marks = {};
    for (const k of DATA.kyoten) {
      const o = this.state.kyoten[k.id].owner;
      if (!o || k.type !== 'kokufu') continue;
      if (!marks[o] || k.scale > marks[o].scale) marks[o] = k;
    }
    for (const [fid, k] of Object.entries(marks)) {
      const s = this._m2n(k.mx, k.my);
      if (s.x < r.x || s.x > r.x + r.w || s.y < r.y || s.y > r.y + r.h) continue;
      drawKamon(ctx, fid, s.x, s.y, 9);
      ctx.save();
      ctx.font = '600 13px "Hiragino Mincho ProN", serif'; ctx.textAlign = 'left';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.strokeText(FACTIONS[fid].jp, s.x + 13, s.y + 5);
      ctx.fillStyle = FACTIONS[fid].color; ctx.fillText(FACTIONS[fid].jp, s.x + 13, s.y + 5);
      ctx.restore();
    }
    // 選択中の国を示す枠（参照UIの黄色い矩形）
    const b = DATA.provBox[this.province];
    if (b) {
      const a = this._m2n(b.x0 - 0.012, b.y0 - 0.012), c = this._m2n(b.x1 + 0.012, b.y1 + 0.012);
      ctx.lineWidth = 1.6; ctx.strokeStyle = '#f9d423';
      ctx.setLineDash([5, 3]);
      ctx.strokeRect(a.x, a.y, c.x - a.x, c.y - a.y);
      ctx.setLineDash([]);
    }
    ctx.restore();
    frameTitle(ctx, r.x, r.y, r.w, '全国図 — 国をクリックして選ぶ', 'National Map');
    // 凡例
    const alive = Object.keys(FACTIONS).filter((fid) => this.state.factions[fid].alive);
    const lh = 17, lw = 108;
    frame(ctx, r.x + 8, r.y + 30, lw, alive.length * lh + 10, { fill: 'rgba(8,11,17,0.8)' });
    alive.forEach((fid, i) => {
      const y = r.y + 36 + i * lh;
      ctx.fillStyle = FACTIONS[fid].color; ctx.fillRect(r.x + 16, y + 3, 9, 9);
      txt(ctx, FACTIONS[fid].jp, r.x + 31, y, { font: '11px "Hiragino Mincho ProN", serif', color: '#cbd5e1' });
    });
  }

  /* -------- 国の拡大図 -------- */
  _drawProvince(ctx) {
    const r = L.prov, prov = DATA.provById[this.province];
    frame(ctx, r.x, r.y, r.w, r.h, { fill: '#071018' });
    const view = this._provView();
    ctx.save();
    ctx.beginPath(); ctx.roundRect(r.x + 1, r.y + 23, r.w - 2, r.h - 46, 6); ctx.clip();
    if (!drawVectorMap(ctx, r, view, 'prov:' + this.province) && ASSETS.mapReady) {
      const o = view.toScreen(0, 0);
      ctx.drawImage(ASSETS.map, o.x, o.y, view.s, view.s * mapAspect());
      ctx.fillStyle = 'rgba(5,7,11,0.30)'; ctx.fillRect(r.x, r.y, r.w, r.h);
    }
    this._drawProvinceTint(ctx, view);
    // 街道: 同国内の拠点を国府から結ぶ＋隣国の国府へ伸ばす
    this._drawRoads(ctx, view);
    for (const k of DATA.kyoten) {
      const ty = KYOTEN_TYPE[k.type];
      if (ty.tier > 1) continue;
      const s = view.toScreen(k.mx, k.my);
      if (s.x < r.x - 20 || s.x > r.x + r.w + 20 || s.y < r.y || s.y > r.y + r.h) continue;
      this._drawSite(ctx, k, s, 8, k.province === this.province);
    }
    ctx.restore();
    frameTitle(ctx, r.x, r.y, r.w, `拡大図（${prov ? prov.nameJP : this.province}国）`, prov ? prov.nameEN : '');
    // 下端のステータス帯（参照UIの選択拠点バー）
    const k = this.sel ? DATA.kyotenById[this.sel] : null;
    const by = r.y + r.h - 22;
    frame(ctx, r.x, by, r.w, 22, { fill: 'rgba(216,178,106,0.10)', stroke: 'rgba(216,178,106,0.28)', radius: 4 });
    if (k) {
      const st = this.state.kyoten[k.id];
      const own = st.owner ? FACTIONS[st.owner].jp : '中立';
      txt(ctx, `${k.jp}（${KYOTEN_TYPE[k.type].jp}）  ${own}  兵士 ${st.garrison}  規模 ${k.scale}  防御 ${k.defense}`,
        r.x + 10, by + 4, { font: '12px "Hiragino Mincho ProN", serif', color: '#e8d3a0' });
    }
  }

  /* 拡大図・周辺図で国の領有を薄く重ねる */
  _drawProvinceTint(ctx, view) {
    ctx.save();
    for (const [pid, b] of Object.entries(DATA.provBox)) {
      const owner = Rule.provinceOwner(this.state, pid);
      if (!owner || !b.hull.length) continue;
      ctx.beginPath();
      b.hull.forEach((pt, i) => { const s = view.toScreen(pt[0], pt[1]); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
      ctx.closePath();
      ctx.fillStyle = hexA(FACTIONS[owner].color, pid === this.province ? 0.16 : 0.08);
      ctx.fill();
      ctx.lineWidth = pid === this.province ? 1.4 : 0.6;
      ctx.strokeStyle = hexA(FACTIONS[owner].color, pid === this.province ? 0.8 : 0.35);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 街道: 国府どうしを隣接関係で結ぶ（令制七道の近似） */
  _drawRoads(ctx, view) {
    ctx.save();
    ctx.strokeStyle = 'rgba(216,178,106,0.30)';
    ctx.lineWidth = 1.6; ctx.setLineDash([6, 4]);
    for (const p of DATA.provinces) {
      const a = DATA.kyotenById['kokufu_' + p.id];
      if (!a) continue;
      const sa = view.toScreen(a.mx, a.my);
      for (const nb of p.neighbors) {
        if (nb < p.id) continue;                       // 双方向を1回だけ描く
        const b = DATA.kyotenById['kokufu_' + nb];
        if (!b) continue;
        const sb = view.toScreen(b.mx, b.my);
        ctx.beginPath(); ctx.moveTo(sa.x, sa.y); ctx.lineTo(sb.x, sb.y); ctx.stroke();
      }
    }
    ctx.setLineDash([]);
    ctx.restore();
  }

  _drawSite(ctx, k, s, size, inFocus) {
    const ty = KYOTEN_TYPE[k.type];
    const st = this.state.kyoten[k.id];
    const owner = st && st.owner ? FACTIONS[st.owner] : null;
    ctx.save();
    ctx.globalAlpha = inFocus ? 1 : 0.42;
    // 勢力色の台座
    ctx.beginPath(); ctx.ellipse(s.x, s.y + size * 0.62, size * 0.85, size * 0.34, 0, 0, Math.PI * 2);
    ctx.fillStyle = owner ? hexA(owner.color, 0.85) : 'rgba(150,160,175,0.7)'; ctx.fill();
    drawSiteIcon(ctx, ty.icon, s.x, s.y, size, ty.color);
    if (this.sel === k.id) {
      ctx.beginPath(); ctx.arc(s.x, s.y, size * 1.6, 0, Math.PI * 2);
      ctx.lineWidth = 2; ctx.strokeStyle = '#f9d423'; ctx.stroke();
    }
    if (inFocus) {
      ctx.font = '10px "Hiragino Mincho ProN", serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.92)';
      ctx.strokeText(k.jp, s.x, s.y + size * 1.9);
      ctx.fillStyle = '#e8eef5'; ctx.fillText(k.jp, s.x, s.y + size * 1.9);
    }
    ctx.restore();
  }

  /* -------- 拠点の周辺図 -------- */
  _drawLocal(ctx) {
    const r = L.local;
    frame(ctx, r.x, r.y, r.w, r.h, { fill: '#071018' });
    const k = this.sel ? DATA.kyotenById[this.sel] : null;
    const view = this._localView();
    ctx.save();
    ctx.beginPath(); ctx.roundRect(r.x + 1, r.y + 23, r.w - 2, r.h - 24, 6); ctx.clip();
    if (!drawVectorMap(ctx, r, view, 'local:' + (this.sel || this.province)) && ASSETS.mapReady) {
      const o = view.toScreen(0, 0);
      ctx.drawImage(ASSETS.map, o.x, o.y, view.s, view.s * mapAspect());
      ctx.fillStyle = 'rgba(5,7,11,0.24)'; ctx.fillRect(r.x, r.y, r.w, r.h);
    }
    this._drawProvinceTint(ctx, view);
    this._drawRoads(ctx, view);
    for (const kk of DATA.kyoten) {
      const s = view.toScreen(kk.mx, kk.my);
      if (s.x < r.x - 30 || s.x > r.x + r.w + 30 || s.y < r.y || s.y > r.y + r.h) continue;
      this._drawSite(ctx, kk, s, 13, true);
    }
    ctx.restore();
    frameTitle(ctx, r.x, r.y, r.w, k ? `${k.jp} 周辺` : '周辺図', 'Local Map');
  }

  /* -------- 拠点の詳細 -------- */
  _drawDetail(ctx) {
    const r = L.detail;
    frame(ctx, r.x, r.y, r.w, r.h);
    const k = this.sel ? DATA.kyotenById[this.sel] : null;
    frameTitle(ctx, r.x, r.y, r.w, k ? k.jp : '拠点', k ? k.en : 'Site');
    if (!k) return;
    const st = this.state.kyoten[k.id], ty = KYOTEN_TYPE[k.type];
    // 拠点の絵（大きめのアイコン）
    ctx.save();
    frame(ctx, r.x + 8, r.y + 28, r.w - 16, 62, { fill: 'rgba(255,255,255,0.03)', stroke: 'rgba(255,255,255,0.08)', radius: 4 });
    drawSiteIcon(ctx, ty.icon, r.x + r.w / 2, r.y + 62, 22, ty.color);
    ctx.restore();
    let y = r.y + 96;
    const rowLimit = r.y + r.h - 48;      // 命令ボタンの上端まで
    const row = (jp, v, color) => {
      if (y > rowLimit) return;
      txt(ctx, jp, r.x + 12, y, { font: '11px "Hiragino Mincho ProN", serif', color: '#8a7a58' });
      txt(ctx, String(v), r.x + r.w - 12, y - 1, { font: '600 12px "Segoe UI", sans-serif', color: color || '#e8eef5', align: 'right' });
      y += 17;
    };
    row('種類', ty.jp, ty.color);
    const prov = DATA.provById[k.province];
    row('国', prov ? prov.nameJP : k.province);
    row('支配勢力', st.owner ? FACTIONS[st.owner].jp : '中立', st.owner ? FACTIONS[st.owner].color : '#94a3b8');
    row('兵士', st.garrison);
    row('規模', k.scale);
    row('防御', k.defense);
    if (k.holder) row('領主', HOLDER_JP[k.holder] || k.holder, '#c792ea');
    if (k.suigun) row('水軍', k.suigun, '#4dd0e1');
    if (k.note === 'riverPort') row('河港', 'はい');
    // 命令ボタン
    this.actionButtons = [];
    const bw = r.w - 20, by = r.y + r.h - 40;
    if (st.owner === this.state.faction) {
      this.actionButtons.push({ id: 'levy', x: r.x + 10, y: by, w: bw, h: 30, jp: '徴 兵', font: '600 14px "Hiragino Mincho ProN", serif', radius: 4 });
    } else if (this._attackSource(k)) {
      this.actionButtons.push({ id: 'attack', x: r.x + 10, y: by, w: bw, h: 30, jp: '出 兵', font: '600 14px "Hiragino Mincho ProN", serif', radius: 4 });
    }
    for (const b of this.actionButtons) button(ctx, b, false);
  }

  /* 攻め手になれる自勢力の拠点（隣接かつ兵の多い順の先頭） */
  _attackSource(target) {
    const mine = Rule.ownedKyoten(this.state, this.state.faction)
      .filter((k) => Rule.adjacent(k, target) && this.state.kyoten[k.id].garrison >= 100)
      .sort((a, b) => this.state.kyoten[b.id].garrison - this.state.kyoten[a.id].garrison);
    return mine[0] || null;
  }

  /* -------- 拠点一覧（選択中の国） -------- */
  _drawList(ctx, g) {
    const r = L.list, prov = DATA.provById[this.province];
    frame(ctx, r.x, r.y, r.w, r.h);
    frameTitle(ctx, r.x, r.y, r.w, `拠点一覧（${prov ? prov.nameJP : ''}国）`, 'Sites');
    const cols = [12, 132, 196, 300, 372, 440];
    const head = ['拠点名', '種類', '支配勢力', '兵士', '規模'];
    head.forEach((h, i) => txt(ctx, h, r.x + cols[i], r.y + 26, { font: '10px "Hiragino Mincho ProN", serif', color: '#8a7a58' }));
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y + 40, r.w, r.h - 42); ctx.clip();
    const list = this._provList();
    const rows = Math.floor((r.h - 46) / 20);
    this.listScroll = clamp(this.listScroll, 0, Math.max(0, list.length - rows));
    for (let i = 0; i < rows && i + this.listScroll < list.length; i++) {
      const k = list[i + this.listScroll], st = this.state.kyoten[k.id];
      const y = r.y + 44 + i * 20;
      if (this.sel === k.id) frame(ctx, r.x + 6, y - 3, r.w - 12, 19, { fill: 'rgba(249,212,35,0.14)', stroke: 'rgba(249,212,35,0.4)', radius: 3 });
      const owner = st.owner ? FACTIONS[st.owner] : null;
      txt(ctx, fitText(ctx, k.jp, 112, '12px "Hiragino Mincho ProN", serif'), r.x + cols[0], y, { font: '12px "Hiragino Mincho ProN", serif', color: '#e8eef5' });
      txt(ctx, KYOTEN_TYPE[k.type].jp, r.x + cols[1], y, { font: '12px "Hiragino Mincho ProN", serif', color: KYOTEN_TYPE[k.type].color });
      txt(ctx, owner ? owner.jp : '中立', r.x + cols[2], y, { font: '12px "Hiragino Mincho ProN", serif', color: owner ? owner.color : '#7c8ba1' });
      txt(ctx, String(st.garrison), r.x + cols[4], y, { font: '12px "Segoe UI", sans-serif', color: '#cbd5e1', align: 'right' });
      txt(ctx, String(k.scale), r.x + cols[5] + 22, y, { font: '12px "Segoe UI", sans-serif', color: '#8b98ab', align: 'right' });
    }
    ctx.restore();
    if (list.length > rows) txt(ctx, `${this.listScroll + 1}–${Math.min(list.length, this.listScroll + rows)} / ${list.length}`, r.x + r.w - 10, r.y + 26, { font: '10px sans-serif', color: '#6b7787', align: 'right' });
  }

  /* -------- 時代イベント -------- */
  _drawEvents(ctx) {
    const r = L.events;
    frame(ctx, r.x, r.y, r.w, r.h);
    frameTitle(ctx, r.x, r.y, r.w, '時代イベント', 'Chronicle');
    const now = Rule.monthIndex(this.state.year, this.state.month);
    let y = r.y + 30;
    const rows = Math.floor((r.h - 34) / 17);
    // 直近に起きたもの＋これから起きるものを窓で見せる
    let start = TIMELINE.findIndex((e) => Rule.monthIndex(e.y, e.m) >= now);
    if (start < 0) start = TIMELINE.length - rows;
    start = clamp(start - 2, 0, Math.max(0, TIMELINE.length - rows));
    for (let i = start; i < Math.min(TIMELINE.length, start + rows); i++) {
      const e = TIMELINE[i], past = Rule.monthIndex(e.y, e.m) < now;
      txt(ctx, `${e.y}年`, r.x + 12, y, { font: '11px "Segoe UI", sans-serif', color: past ? '#5c6673' : '#d8b26a' });
      txt(ctx, fitText(ctx, e.jp, r.w - 74, '12px "Hiragino Mincho ProN", serif'), r.x + 62, y,
        { font: '12px "Hiragino Mincho ProN", serif', color: past ? '#7c8ba1' : '#dbe4ee' });
      y += 17;
    }
  }

  /* -------- 右下: 勢力一覧と年代記 -------- */
  _drawSide(ctx) {
    const r = L.side;
    frame(ctx, r.x, r.y, r.w, r.h);
    frameTitle(ctx, r.x, r.y, r.w, '勢力と年代記', 'Powers & Log');
    let y = r.y + 30;
    const rows = Object.keys(FACTIONS)
      .filter((fid) => this.state.factions[fid].alive)
      .map((fid) => ({ fid, n: Rule.ownedKyoten(this.state, fid).length, m: Rule.calcMeibun(this.state, fid) }))
      .sort((a, b) => b.m - a.m).slice(0, 4);
    for (const row of rows) {
      ctx.fillStyle = FACTIONS[row.fid].color; ctx.fillRect(r.x + 12, y + 3, 9, 9);
      txt(ctx, FACTIONS[row.fid].jp, r.x + 27, y, { font: '12px "Hiragino Mincho ProN", serif', color: '#dbe4ee' });
      txt(ctx, `名分 ${row.m}`, r.x + 130, y, { font: '11px "Segoe UI", sans-serif', color: '#8b98ab' });
      txt(ctx, `${row.n}`, r.x + r.w - 12, y, { font: '11px "Segoe UI", sans-serif', color: '#8b98ab', align: 'right' });
      y += 17;
    }
    y += 6;
    for (const l of this.state.log.slice(0, 3)) {
      txt(ctx, `${l.m}月`, r.x + 12, y, { font: '10px "Segoe UI", sans-serif', color: '#d8b26a' });
      txt(ctx, fitText(ctx, l.text, r.w - 60, '11px "Hiragino Mincho ProN", serif'), r.x + 46, y, { font: '11px "Hiragino Mincho ProN", serif', color: '#a9b6c6' });
      y += 16;
    }
  }

  _drawResult(ctx) {
    ctx.fillStyle = 'rgba(5,7,11,0.86)'; ctx.fillRect(0, 0, W, H);
    const r = this.state.result;
    txt(ctx, r.win ? '勝 利' : '終 幕', W / 2, H / 2 - 80, { font: '600 58px "Hiragino Mincho ProN", serif', color: r.win ? '#d8b26a' : '#cbd5e1', align: 'center' });
    txt(ctx, r.reason, W / 2, H / 2 + 6, { font: '16px "Hiragino Mincho ProN", serif', color: '#94a3b8', align: 'center' });
    txt(ctx, '「機能」からタイトルへ戻れます / Use 機能 to return to the title', W / 2, H / 2 + 46, { font: '12px "Segoe UI", sans-serif', color: '#6b7787', align: 'center' });
  }
}

function inRect(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* ============================================================================
 * 8. 起動
 * ========================================================================== */
game.changeScene(new BootScene());
game.start();
// 検査（scripts/verify-genpei-boot.mjs）から状態を覗くための橋。
// ★ 新しい関数・定数を足したらここにも追加する（追加し忘れると検査側が落ちる）。
window.GENPEI_DEBUG = {
  game, save, DATA, RULE, FACTIONS, SCENARIOS, AUTHORITY, KYOTEN_TYPE, TIMELINE, Rule,
  buildState, endTurn, waReki, applyActions, levy,
  scene: () => (game.scene ? game.scene.constructor.name : null),
  errors: () => game.errors || [],
  gotoMap: (scnId, fid) => { game.changeScene(new MapScene(buildState(scnId, fid))); return true; },
  state: () => (game.scene && game.scene.state) || null,
};
</script>
