<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="assets/js/frame-guard.js"></script>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>降魔七星剣 | Shichisei-Ken Retro Action</title>
<meta name="description" content="ファミコン風の横スクロールアクション『降魔七星剣』の基盤版。七星剣で敵の弾を消し、属性相性で3倍ダメージ。画像アセットは差し替え式。 / A retro NES-style side-scrolling action game foundation.">
<style>
  html, body { margin: 0; background: #000; color: #ddd; font-family: "Yu Gothic", "Meiryo", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #wrap { width: min(100vw, calc((100vh - 70px) * 256 / 240)); margin-top: 8px; }
  canvas { width: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; border: 1px solid #333; }
  #help { font-size: 12px; line-height: 1.6; padding: 6px 12px 12px; max-width: 760px; color: #aaa; }
  #asset-status { font-size: 11px; color: #6c6; }
  a { color: #8cf; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" aria-label="降魔七星剣のゲーム画面 / Game screen" tabindex="0"></canvas></div>
<div id="help">
  <div>矢印/WASD 移動・<b>↓</b>しゃがみ・<b>↑/Space</b>ジャンプ（真上・斜め）／<b>Z</b> 七星剣（敵の弾を消す）／<b>X</b> セレクトアイテム／<b>Enter</b> ポーズ（単発アイテム）／<b>C</b> 武器切替（訓練場）／<b>`</b> 判定表示</div>
  <div>Arrows/WASD move · ↓ crouch · ↑/Space jump · Z sword (cancels shots) · X select item · Enter pause (single-use items) · C cycle weapon (training) · ` hitboxes</div>
  <div id="asset-status">assets: loading…</div>
  <div><a href="index.html">← hideの部屋 / Home</a></div>
</div>
<script src="assets/koma-ken/js/core.js"></script>
<script src="assets/koma-ken/js/assets_config.js"></script>
<script src="assets/koma-ken/js/asset_manager.js"></script>
<script src="assets/koma-ken/js/placeholders.js"></script>
<script src="assets/koma-ken/js/items.js"></script>
<script src="assets/koma-ken/js/input.js"></script>
<script src="assets/koma-ken/js/enemy.js"></script>
<script src="assets/koma-ken/js/player.js"></script>
<script src="assets/koma-ken/js/stages.js"></script>
<script src="assets/koma-ken/js/game.js"></script>
<script>
(function () {
  var K = window.KOMA;
  var assets = new K.AssetManager(K.ASSET_CONFIG);
  K.installPlaceholders(assets);
  var game = new K.Game(document.getElementById('screen'), assets);
  window.__KOMA = { game: game, assets: assets, step: function (n) { for (var i = 0; i < n; i++) game.update(); game.draw(); } };
  window.addEventListener('keydown', function (e) { if (e.code === 'Backquote') game.debug = !game.debug; });
  assets.loadAll().then(function () {
    var s = assets.summary();
    document.getElementById('asset-status').textContent = 'assets: 画像 ' + s.loaded + ' / 仮描画 ' + s.placeholder + ' / 失敗 ' + s.failed + '（assets_config.js で差し替え）';
  });
  var acc = 0, last = performance.now();
  function frame(now) {
    acc += Math.min(now - last, 100); last = now;
    while (acc >= 1000 / 60) { game.update(); acc -= 1000 / 60; }
    game.draw(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
